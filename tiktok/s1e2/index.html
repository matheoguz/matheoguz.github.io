  etincelles.forEach((m, i) => {
    const vis = k > 0 && k < 0.9; m.visible = vis;
    if (vis) { const a = i * 2.4, v = 1.2 + (i % 4) * 0.4; m.position.set(Math.cos(a) * v * k, 1.3 + Math.sin(a) * v * k - 2.5 * k * k, 0.3); }
  });
  // groupe électrogène
  groupeE.visible = t > P("groupe", 0.6); groupeE.position.y = groupeE.visible ? lerp(0.6, 0, ease(t, P("groupe", 0.6), 0.35)) : 0;
  const tourne = t > P("lumiere") - 0.3;
  groupeE.rotation.z = tourne ? Math.sin(t * 50) * 0.008 : 0;
  fumee.forEach((m, i) => { const cyc = (t * 0.7 + i / fumee.length) % 1; m.material.opacity = tourne ? 0.5 * (1 - cyc) : 0; m.position.set(0.45 + cyc * 0.3, 1.25 + cyc * 1.4, -0.2); m.scale.setScalar(0.6 + cyc * 1.8); });
}

/* ---------- Interface ---------- */
const v3 = new THREE.Vector3();
function ecran(obj, dy) { obj.updateMatrixWorld(); v3.set(0, dy, 0).applyMatrix4(obj.matrixWorld).project(camera); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H]; }
function bulle(x, y, texte, fondC = "#ffffff", o = 1) {
  if (o <= 0) return "";
  const w = texte.length * 17 + 40;
  return `<g opacity="${o}" transform="translate(${x},${y - 40}) scale(${0.8 + 0.2 * o})"><rect x="${-w / 2}" y="-30" width="${w}" height="52" rx="14" fill="${fondC}"/><path d="M-10 21 l 10 16 l 10 -16 Z" fill="${fondC}"/><text x="0" y="5" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#1b1b1b">${texte}</text></g>`;
}

const SAUTS = [[FP("calc1"), 1000, 94], [FP("calc2"), 400, 93]];
function hud(t) {
  const oF = vis(t, P("hudFam"), 1e9, 0.3), oA = vis(t, P("hudAll"), 1e9, 0.3);
  if (oA <= 0) return "";
  let budget = 19000, delai = 99, pb = 19000, pd = 99, delta = null;
  for (const [ts, b, d] of SAUTS) { const p = ease(t, ts, 0.7); if (t >= ts) { budget = lerp(pb, b, p); delai = Math.round(lerp(pd, d, p)); if (t < ts + 2) delta = { v: b - pb, o: vis(t, ts, ts + 2, 0.2) }; } pb = b; pd = d; }
  const boite = (cx, lab, val, col, o) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},340) scale(${0.85 + 0.15 * o})">
    <rect x="-118" y="-56" width="236" height="104" rx="18" fill="#121828" stroke="${col}" stroke-width="5"/>
    <text x="0" y="-21" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#b9c0d0" letter-spacing="3">${lab}</text>
    <text x="0" y="28" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="${col}">${val}</text></g>`;
  let s = boite(285, "DÉLAI", `${delai} JOURS`, "#ff5a5f", oA) + boite(540, "FAMILLES", "0 / 50", "#4ade80", oF) + boite(795, "BUDGET", `${euros(budget)} €`, "#ffc93c", oA);
  if (delta) s += `<text x="795" y="426" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#ff5a5f" opacity="${delta.o}">−${euros(-delta.v)} €</text>`;
  return s;
}
function puce(t) {
  const etapes = [["1.", " LA PISCINE", P("piscine"), P("verif")], ["2.", " L'ÉLECTRICITÉ", P("soir"), P("bilan")]];
  let s = "";
  for (const [n, txt, a, b] of etapes) {
    const o = vis(t, a, b, 0.2); if (o <= 0) continue;
    const w = (n + txt).length * 19 + 50;
    s += `<g opacity="${o}" transform="translate(540,450) scale(${0.85 + 0.15 * o})"><rect x="${-w / 2}" y="-26" width="${w}" height="50" rx="12" fill="#ffffff"/><text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="900" font-size="28" fill="#1b1b1b"><tspan fill="#ff5a5f">${n}</tspan>${txt}</text></g>`;
  }
  const o = vis(t, P("verif"), P("reste"), 0.2);
  if (o > 0) s += `<g opacity="${o}" transform="translate(540,450) scale(${0.85 + 0.15 * o})"><rect x="-150" y="-26" width="300" height="50" rx="12" fill="#0f1f3a" stroke="#4fa3ff" stroke-width="4"/><text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="900" font-size="28" fill="#4fa3ff">VÉRIFICATION</text></g>`;
  return s;
}
function cahier(t, a, b, titre, lignes, total, rot = -2.5) {
  const o = vis(t, a, b, 0.25); if (o <= 0) return "";
  const h = 120 + lignes.length * 56 + (total ? 70 : 0);
  let s = `<g opacity="${o}" transform="translate(540,${510 + (1 - o) * -30}) rotate(${rot})">
    <rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#000" opacity=".25" transform="translate(8,10)"/>
    <rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#fbf7ec"/>`;
  for (let y = 70; y < h; y += 56) s += `<line x1="-300" y1="${y}" x2="300" y2="${y}" stroke="#cdd9ee" stroke-width="2"/>`;
  s += `<line x1="-240" y1="0" x2="-240" y2="${h}" stroke="#ef9a9a" stroke-width="3"/><text x="0" y="52" text-anchor="middle" font-family="Inter" font-weight="900" font-size="32" fill="#1b1b1b" letter-spacing="2">${titre}</text>`;
  lignes.forEach(([lab, val, coche], i) => {
    const oi = clamp((t - a - 0.3 - i * 0.4) / 0.2), y = 116 + i * 56;
    s += `<g opacity="${oi}"><text x="-222" y="${y}" font-family="Inter" font-weight="800" font-size="27" fill="#2b2b2b">${lab}</text><text x="272" y="${y}" text-anchor="end" font-family="Inter" font-weight="900" font-size="28" fill="#2b2b2b">${val}</text>
      ${coche ? `<path d="M210 ${y - 14} l 14 16 l 30 -34" stroke="#22a55a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${clamp((t - coche) / 0.2)}"/>` : ""}</g>`;
  });
  if (total) { const ot = clamp((t - a - 0.3 - lignes.length * 0.4) / 0.2), yt = 116 + lignes.length * 56 + 6;
    s += `<g opacity="${ot}"><line x1="-222" y1="${yt - 36}" x2="272" y2="${yt - 36}" stroke="#1b1b1b" stroke-width="3"/><text x="-222" y="${yt + 4}" font-family="Inter" font-weight="900" font-size="28" fill="#e23b3b">TOTAL</text><text x="272" y="${yt + 4}" text-anchor="end" font-family="Inter" font-weight="900" font-size="32" fill="#e23b3b">${total}</text></g>`; }
  return s + `</g>`;
}

function choix(t) {
  const a = P("choix"), b = DUREE - 2.6; let s = "";
  const carte = (cx, titre, prix, sous, col, o) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},640) scale(${0.8 + 0.2 * o})"><rect x="-200" y="-120" width="400" height="240" rx="24" fill="#121828" stroke="${col}" stroke-width="7"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" fill="#ffffff">${prix}</text>
    <text x="0" y="40" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="${col}">${titre}</text><text x="0" y="84" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#b9c0d0" letter-spacing="2">${sous}</text></g>`;
  s += carte(285, "PETIT PRIX", "450 €", "PAR SEMAINE", "#4fa3ff", vis(t, a, b, 0.25));
  s += carte(795, "PLEIN TARIF", "650 €", "PAR SEMAINE", "#ffc93c", vis(t, P("choix2"), b, 0.25));
  const oo = vis(t, P("choix2", -0.3), b, 0.2); if (oo > 0) s += `<g opacity="${oo}"><circle cx="540" cy="640" r="44" fill="#ffffff"/><text x="540" y="654" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#1b1b1b">OU</text></g>`;
  const oc = vis(t, P("comment"), b, 0.25); if (oc > 0) s += `<g opacity="${oc}" transform="translate(540,860) scale(${0.85 + 0.15 * oc})"><rect x="-390" y="-38" width="780" height="76" rx="38" fill="#ff3b5c"/><text x="0" y="13" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff">ÉCRIS « PETIT PRIX » OU « PLEIN TARIF »</text></g>`;
  return s;
}
function sousTitres(t) {
  const c = CHUNKS.find((k) => t >= k.t0 && t < k.t1);
  if (!c || t > FIN_VOIX + 0.3) return "";
  const pop = 0.92 + 0.08 * easeIO(clamp((t - c.t0) / 0.1));
  const COUL = { w: "#ffffff", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#4fa3ff" };
  const sp = c.map((w) => `<tspan fill="${t >= w.t ? COUL[w.c] : "#9a9089"}">${w.txt.toUpperCase()}</tspan>`).join(" ");
  const MES = sousTitres.c || (sousTitres.c = document.createElement("canvas").getContext("2d")); MES.font = "900 52px Inter";
  const larg = MES.measureText(c.map((w) => w.txt.toUpperCase()).join(" ")).width + 20;
  const k = Math.min(1, 1000 / larg);
  return `<g transform="translate(540,1330) scale(${pop * k})"><text x="3" y="4" text-anchor="middle" font-family="Inter" font-weight="900" font-size="52" fill="#000" opacity=".35" letter-spacing="1">${c.map((w) => w.txt.toUpperCase()).join(" ")}</text><text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" font-size="52" letter-spacing="1" stroke="#1b120c" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${sp}</text></g>`;
}

function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35); if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c" opacity=".88"/>
    <text x="540" y="760" text-anchor="middle" font-family="Inter" font-weight="900" font-size="38" fill="#4ade80" letter-spacing="6">LES PINS PERDUS · SAISON 1</text>
    <text x="540" y="860" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffffff">ÉPISODE 3</text>
    <text x="540" y="950" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffc93c">L'OUVERTURE</text>
    <g transform="translate(540,1120)"><rect x="-340" y="-44" width="680" height="88" rx="44" fill="#ff3b5c"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#fff">+ ABONNE-TOI POUR LA SUITE</text></g></g>`;
}
const FLASHS = [FP("calc1"), P("plein"), P("clac"), P("lumiere")];
function interface_(t) {
  let s = "";
  const [mx, my] = ecran(malo, 3.6), [rx, ry] = ecran(roger, 1.6);
  const Bb = (x, y, txt, c, o) => bulle(clamp(x, 200, 860), clamp(y, 520, 1000), txt, c, o);
  s += Bb(mx, my, "BEURK…", "#ffffff", vis(t, P("piscine", 0.8), P("travaux1"), 0.2));
  s += Bb(mx, my, "ZÉRO FUITE !", "#4ade80", vis(t, P("plein", 0.6), P("roger"), 0.2));
  s += Bb(rx, ry, "NON.", "#ffffff", vis(t, P("roger", 0.5), P("reste"), 0.2));
  s += Bb(mx, my, "NOIR TOTAL !", "#ffffff", vis(t, P("clac", 0.5), P("tableau", 0.5), 0.2));
  s += Bb(rx, ry, "WOUF !", "#ffffff", vis(t, P("lumiere", 0.3), P("bilan"), 0.2));
  s += hud(t) + puce(t);
  // premier commentaire (vrai commentaire d'abonné, fourni par Matheo)
  const oCom = vis(t, 0.7, P("piscine", -0.1), 0.25);
  if (oCom > 0) s += `<g opacity="${oCom}" transform="translate(540,${830 + (1 - oCom) * 30}) rotate(1.5)">
    <rect x="-330" y="-78" width="660" height="156" rx="26" fill="#000" opacity=".3" transform="translate(6,8)"/>
    <rect x="-330" y="-78" width="660" height="156" rx="26" fill="#1f1f1f"/>
    <circle cx="-262" cy="-18" r="40" fill="#7a1f24" stroke="#c0392b" stroke-width="4"/><text x="-262" y="-4" text-anchor="middle" font-family="Inter" font-weight="900" font-size="38" fill="#fff">I</text>
    <text x="-198" y="-34" font-family="Inter" font-weight="700" font-size="26" fill="#a8a8a8">Ilya</text>
    <text x="-198" y="10" font-family="Inter" font-weight="800" font-size="40" fill="#ffffff">Piscine</text>
    <rect x="-198" y="30" width="254" height="36" rx="8" fill="#3a3a3a"/><text x="-71" y="56" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#cfcfcf">Premier commentaire</text>
    <path d="M250 -10 c -10 -16 -34 -10 -30 8 c 3 12 30 28 30 28 c 0 0 27 -16 30 -28 c 4 -18 -20 -24 -30 -8 Z" fill="#ff3b5c"/></g>`;
  s += cahier(t, 0.15, P("piscine", -0.1), "LE VOTE", [["PISCINE", "", 0.9], ["MOBIL-HOMES", ""]], null, 2);
  s += cahier(t, P("rep"), P("verif", 0.1), "LE CALCUL", [["FISSURES + ÉTANCHÉITÉ", "12 000 €"], ["POMPE + FILTRE", "6 000 €"]], "18 000 €");
  s += cahier(t, P("prix"), P("groupe", -0.1), "LE CALCUL", [["TABLEAU NEUF", "12 000 €"], ["DANS LA CAISSE", "1 000 €"]], null);
  s += cahier(t, P("groupe"), P("lumiere", 0.3), "LE CALCUL", [["GROUPE ÉLECTROGÈNE", "600 €"], ["(LOCATION / SEMAINE)", ""]], "600 €");
  s += choix(t) + sousTitres(t);
  for (const ft of FLASHS) { const o = 0.5 * clamp(1 - (t - ft) / 0.3); if (t >= ft && o > 0) s += `<rect width="1080" height="1920" fill="#ffffff" opacity="${o.toFixed(3)}"/>`; }
  s += carteFin(t);
  document.getElementById("ui").innerHTML = s;
}

/* ---------- Bruitages ---------- */
const EVENEMENTS = [];
const ev = (t, type, d = 0) => { if (t >= 0) EVENEMENTS.push({ t: +t.toFixed(3), type, d }); };
[0.15, P("prix"), P("groupe"), P("choix"), P("comment")].forEach((t) => ev(t, "pop"));
ev(P("roger", 0.5), "wouf"); ev(P("lumiere", 0.3), "wouf");
SAUTS.forEach(([t]) => ev(t, "kaching"));
ev(P("verif", 0.6), "eau", Math.min(4, FP("plein") - P("verif")));
ev(P("plein"), "ding"); ev(P("clac"), "tampon"); ev(P("lumiere"), "ding");
ev(P("lumiere", -0.3), "moteur", 2.5);
ev(DUREE - 2.6, "fin");
window.EVENEMENTS = EVENEMENTS;

/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt);
  const c = plan(t), yc = 1.05 / c.z;
  camera.zoom = c.z; camera.updateProjectionMatrix();
  camera.position.set(c.x, yc + 7, 40); camera.lookAt(c.x, yc, 0);
  fond.position.set(c.x, yc + 10, -90); etoiles.position.set(c.x * 0.9, 0, 0);
  lune.position.set(c.x + 2.6 / c.z, yc + 5.5 / c.z, -80); lune.scale.setScalar(1 / c.z);
  const j = jourDe(t); soleilDisque.position.set(c.x - 2.4 / c.z, yc + lerp(-3, 5.8, ease(j, 0.2, 0.8)) / c.z, -80); soleilDisque.scale.setScalar(1 / c.z); soleilDisque.visible = j > 0.15;
  arriere.position.x = c.x * 0.35;
  luneL.target.position.set(c.x, 0, 0); face.target.position.set(c.x, -2, 0); face.position.set(c.x, 2, 40); luneL.position.set(c.x - 8, 14, 12); soleil.target.position.set(c.x, 0, 0); soleil.position.set(c.x - 10, 14, 10);
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;
await document.fonts.ready;
window.pret = true;
if (!location.search.includes("rendu")) {
  rendre(0.3);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => { btn.remove(); voix.currentTime = 0; voix.play().catch(() => {}); const d0 = performance.now();
    const boucle = () => { const t = (performance.now() - d0) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); }; requestAnimationFrame(boucle); };
} else document.body.classList.add("rendu");
</script>
