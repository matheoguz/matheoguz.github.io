<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#12081f}
  .ad{
    width:100%;height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    font-family:Arial,sans-serif;color:#fff;padding:40px 32px;
    background:radial-gradient(circle at 50% 30%,#2a1454 0%,#12081f 70%);
  }
  .num{font-size:0.95rem;font-weight:700;color:#a78bfa;letter-spacing:0.15em;margin-bottom:24px}
  h1{font-size:2.3rem;font-weight:900;line-height:1.25;margin-bottom:18px;text-shadow:0 2px 16px rgba(0,0,0,0.4)}
  p{font-size:1.15rem;color:#d8ccff;line-height:1.5;max-width:340px}
  .swipe{position:absolute;bottom:36px;font-size:0.9rem;color:#8b7ab8;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="ad">
  <div class="num">1 / 4</div>
  <h1>Ta chambre est trop banale le soir ?</h1>
  <p>Lumière blanche, mur vide, aucune ambiance... même après une longue journée.</p>
  <div class="swipe">➡️ Swipe pour la solution</div>
</div>
</body>
</html>
