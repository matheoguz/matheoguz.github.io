<script type="module">
import * as THREE from "three";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

/* =========================================================
   LES PINS PERDUS — Saison 1, épisode 1 (vue de côté, sol en coupe)
   ========================================================= */
const SCRIPT = /*@@SCRIPT@@*/null;
const MINUTAGE = /*@@MINUTAGE@@*/null;
const WORDS = MINUTAGE.words, SENT = MINUTAGE.sent, B = {};
SCRIPT.forEach(([, beat], i) => { if (beat) B[beat] = SENT[i].t0; });
const FIN_VOIX = MINUTAGE.duree_voix;
const DUREE = MINUTAGE.duree_fichier + 2.6;
const CHUNKS = [];
(function decouper() {
  let cur = [];
  const pousser = () => { if (cur.length) { CHUNKS.push(cur); cur = []; } };
  WORDS.forEach((w, i) => { const s = WORDS[i + 1]; cur.push(w); if (cur.length >= 3 || /[.:?!,…]$/.test(w.txt) || !s || s.si !== w.si) pousser(); });
  CHUNKS.forEach((c, i) => { c.t0 = c[0].t; c.t1 = CHUNKS[i + 1] ? CHUNKS[i + 1][0].t : c.at(-1).t + c.at(-1).d + 0.4; });
})();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const ease = (t, a, d) => easeIO(clamp((t - a) / d));
const lerp = (a, b, p) => a + (b - a) * p;
const euros = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const vis = (t, a, b, f = 0.25) => clamp(Math.min((t - a) / f, (b - t) / f));
const P = (beat, d = 0) => (B[beat] ?? 0) + d;
const FP = (beat, d = 0) => { const i = SCRIPT.findIndex((s) => s[1] === beat); return SENT[i].t1 + d; };

/* ---------- Moteur ---------- */
const W = 1080, H = 1920, VUE = 16; // hauteur visible (unités) au zoom 1
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
document.getElementById("cadre").prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-VUE * W / H / 2, VUE * W / H / 2, VUE / 2, -VUE / 2, 0.1, 200);
/*@@PERSOS@@*/

fond.position.z = -90; scene.add(fond);
function peindreCiel(haut, bas) { const x = cielCan.getContext("2d"); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, haut); g.addColorStop(0.55, bas); g.addColorStop(1, bas); x.fillStyle = g; x.fillRect(0, 0, 4, 256); cielTex.needsUpdate = true; }
const etoiles = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(Array.from({ length: 500 }, () => [(alea() - 0.5) * 120, 2 + alea() * 40, -80]).flat(), 3)), new THREE.PointsMaterial({ color: "#ffffff", size: 0.09, transparent: true, sizeAttenuation: false }));
etoiles.material.size = 2.2; scene.add(etoiles);
const lune = new THREE.Mesh(new THREE.CircleGeometry(1.1, 18), new THREE.MeshBasicMaterial({ color: "#eef2fa", transparent: true, fog: false })); lune.position.z = -80; scene.add(lune);
const soleilDisque = new THREE.Mesh(new THREE.CircleGeometry(1.3, 18), new THREE.MeshBasicMaterial({ color: "#ffe08a", fog: false })); soleilDisque.position.z = -80; scene.add(soleilDisque);

/* ---------- Le terrain en coupe ---------- */
const TERRE = mat("#7a5032"), TERRE2 = mat("#5e3d26"), HERBE = mat("#4f8a3c");
const AVANT = 1.6; // face avant de la coupe
scene.add(pose(new THREE.Mesh(new THREE.BoxGeometry(140, 12, 30), TERRE), 10, -6, AVANT - 15));
scene.add(pose(new THREE.Mesh(new THREE.BoxGeometry(140, 0.35, 0.02), mat("#3d2a1c")), 10, -0.18, AVANT + 0.01));
scene.add(pose(new THREE.Mesh(new THREE.BoxGeometry(140, 7, 0.02), TERRE2), 10, -8.6, AVANT + 0.01));
for (let i = 0; i < 140; i++) { const x = -60 + alea() * 140, y = -0.6 - alea() * 4.5; scene.add(pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.06 + alea() * 0.12, 0), 0.02), mat(alea() > 0.5 ? "#6e4a33" : "#7d5a40")), x, y, AVANT + 0.03)); }
const herbe = pose(new THREE.Mesh(new THREE.BoxGeometry(140, 0.12, 30), HERBE), 10, 0.0, AVANT - 15); herbe.receiveShadow = true; scene.add(herbe);
scene.add(pose(new THREE.Mesh(new THREE.BoxGeometry(140, 0.14, 0.04), mat("#3f7a30")), 10, 0.0, AVANT + 0.01));

// câble électrique (intact, en coupe)
scene.add(pose(new THREE.Mesh(new THREE.BoxGeometry(60, 0.07, 0.04), mat("#d8b23a", 0.15)), 8, -0.32, AVANT + 0.04));
// ancienne canalisation : morceaux éclatés
const vieuxTuyau = groupe(); scene.add(vieuxTuyau);
for (let x = -6; x < 30; x += 1.5) {
  const l = 0.9 + alea() * 0.4, m = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, l, 7), mat(alea() > 0.4 ? "#8b8f96" : "#8a5a3a"));
  m.rotation.z = Math.PI / 2 + (alea() - 0.5) * 0.25; m.position.set(x + 0.2, -0.72 + (alea() - 0.5) * 0.1, AVANT + 0.08); vieuxTuyau.add(m);
}
// nouvelle canalisation : grandit de gauche à droite, avec branchements
const tuyau = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1, 8), mat("#3f8fd6", 0.25)); tuyau.rotation.z = Math.PI / 2; tuyau.position.set(0, -0.72, AVANT + 0.1); scene.add(tuyau);
const BRANCHES = [0, 4, 8, 12, 14.6, 22.5];
const branches = BRANCHES.map((x) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.72, 6), mat("#3f8fd6", 0.25)); m.position.set(x, -0.36, AVANT + 0.1); scene.add(m); return m; });
const compteur = pose(bloc(0.5, 0.5, 0.3, "#2b5e8f", 0.01), -6, -0.72, AVANT + 0.2); scene.add(compteur);
const flux = []; for (let i = 0; i < 16; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.02), new THREE.MeshBasicMaterial({ color: "#cfeaff" })); m.position.set(0, -0.72, AVANT + 0.24); scene.add(m); flux.push(m); }

/* ---------- La route d'accès (x -26 → -6) ---------- */
const route = groupe(); scene.add(route);
const routeMat = mat("#9a7650");
route.add(pose(new THREE.Mesh(facettes(new THREE.BoxGeometry(20, 0.16, 3.2, 20, 1, 3), 0.03), routeMat), -16, 0.08, AVANT - 1.6));
const routeCoupe = pose(new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 0.03), mat("#b9a27a")), -16, -0.25, AVANT + 0.02); routeCoupe.scale.x = 0.001; scene.add(routeCoupe);
const trous = [];
for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.55 + alea() * 0.35, 0.5, 0.05, 8), mat(i % 2 ? "#3b2a1c" : "#4f7fa6", i % 2 ? 0 : 0.25)); m.position.set(-25.5 + i * 1.65 + alea() * 0.4, 0.17, AVANT - 0.6 - alea() * 1.4); m.scale.z = 0.7; route.add(m); trous.push(m); }
// le rouleau compresseur
const rouleau = groupe(-30, 0, 0.4); scene.add(rouleau);
rouleau.add(pose(bloc(1.6, 0.9, 1.2, "#f2b33d", 0.02), 0.2, 1.0, 0), pose(bloc(0.8, 0.7, 1.0, "#2b3a4a", 0.02), -0.1, 1.75, 0), pose(bloc(0.5, 0.08, 1.2, "#d23c3c", 0), 0.2, 2.15, 0));
const cyl = ombre(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.4, 10), mat("#8d9199"))); cyl.rotation.x = Math.PI / 2; cyl.position.set(1.2, 0.55, 0); rouleau.add(cyl);
const roue = ombre(new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.3, 10), mat("#222"))); roue.rotation.x = Math.PI / 2; roue.position.set(-0.6, 0.45, 0); rouleau.add(roue);
ombre(rouleau);

/* ---------- L'entrée ---------- */
const entree = groupe(-5, 0, -0.6); scene.add(entree);
for (const x of [-1.5, 1.5]) { entree.add(pose(bloc(0.5, 2.2, 0.5, "#8f8a80", 0.05, 2), x, 1.1, 0), pose(bloc(0.65, 0.18, 0.65, "#a29d93", 0.03), x, 2.3, 0)); }
const texPanneau = texteTexture([["CAMPING", 40, 50], ["LES PINS PERDUS", 56, 110]], "#8a7a62", "#4a3c2b");
const panneau = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.95, 0.1), [mat("#5b4c38"), mat("#5b4c38"), mat("#5b4c38"), mat("#5b4c38"), new THREE.MeshStandardMaterial({ map: texPanneau, roughness: 0.9 }), mat("#5b4c38")]);
panneau.position.set(0, 2.85, 0); panneau.rotation.z = -0.06; panneau.castShadow = true; entree.add(panneau);

/* ---------- Les mobil-homes ---------- */
function creerMobilHome(x, z) {
  const g = groupe(x, 0, z), u = {};
  g.add(pose(bloc(3.2, 0.3, 0.3, "#777", 0.02), 0, 0.15, 0.5), pose(bloc(3.2, 0.3, 0.3, "#777", 0.02), 0, 0.15, -0.5));
  u.murMat = mat("#9c9282"); u.toitMat = mat("#5c5248"); u.bandeMat = mat("#7a6a55");
  const mur = ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(3.6, 1.5, 1.8, 3, 2, 2), 0.04), u.murMat)); mur.position.y = 1.05; g.add(mur);
  g.add(pose(new THREE.Mesh(new THREE.BoxGeometry(3.62, 0.18, 1.82), u.bandeMat), 0, 0.62, 0));
  u.toit = ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(3.9, 0.18, 2.1, 3, 1, 2), 0.04), u.toitMat)); u.toit.position.set(0, 1.88, 0); g.add(u.toit);
  u.fenMat = mat("#20242c"); u.porteMat = mat("#5b4a38");
  g.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.5, 0.04), u.fenMat), -0.9, 1.2, 0.92), pose(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.5, 0.04), u.fenMat), 1.05, 1.2, 0.92));
  u.porte = pose(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.05, 0.04), u.porteMat), 0.1, 0.95, 0.92); g.add(u.porte);
  u.planches = groupe(); g.add(u.planches);
  for (const [px, r] of [[-0.9, 0.5], [-0.9, -0.4], [1.05, 0.3]]) u.planches.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.09, 0.03), mat("#7a5636")), px, 1.2, 0.95, 0, 0, r));
  u.mousse = groupe(); g.add(u.mousse);
  for (const [px, py] of [[-1.5, 1.98], [1.2, 1.98], [-1.6, 0.4]]) u.mousse.add(pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.22, 0), 0.06), mat("#3f5a2c")), px, py, 0.6));
  u.terrasse = groupe(); g.add(u.terrasse); u.terrasse.visible = false;
  u.terrasse.add(pose(bloc(2.6, 0.12, 1.0, "#a8743f", 0.01), 0.3, 0.32, 1.45), pose(bloc(0.3, 0.3, 0.3, "#c0392b", 0.01), 1.4, 0.55, 1.75), pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.22, 0), 0.04), mat("#3f9a4c")), 1.4, 0.85, 1.75));
  u.lum = new THREE.PointLight("#ffcf8a", 0, 4, 1.6); u.lum.position.set(0, 1.2, 1.6); g.add(u.lum);
  u.etat = 0; g.userData = u;
  return g;
}
function etatMobilHome(m, p, t) {
  const u = m.userData;
  u.murMat.color.set("#9c9282").lerp(new THREE.Color("#f4f1ea"), p);
  u.toitMat.color.set("#5c5248").lerp(new THREE.Color("#3e5266"), p);
  u.bandeMat.color.set("#7a6a55").lerp(new THREE.Color("#2e8b57"), p);
  u.fenMat.color.set("#20242c").lerp(new THREE.Color("#ffd98a"), p); u.fenMat.emissive.set("#ffb84d"); u.fenMat.emissiveIntensity = p * 0.7;
  u.porteMat.color.set(p > 0.5 ? "#2e6b52" : "#5b4a38");
  u.toit.rotation.z = lerp(0.07, 0, p); u.toit.position.y = lerp(1.82, 1.88, p);
  u.planches.visible = p < 0.5; u.mousse.visible = p < 0.5; u.terrasse.visible = p > 0.5;
  const bond = p > 0 && p < 1 ? Math.sin(p * Math.PI) * 0.12 : 0; m.scale.set(1 + bond, 1 + bond, 1);
  u.lum.intensity = p * 2.5;
}
const MH_X = [0, 4.2, 8.4, 12.6, 17];
const mobilHomes = MH_X.map((x) => { const m = creerMobilHome(x, -0.4); scene.add(m); return m; });
const mhRoger = creerMobilHome(30, -0.4); scene.add(mhRoger);
mhRoger.userData.fenMat.color.set("#ffcf73"); mhRoger.userData.fenMat.emissive.set("#ffb84d"); mhRoger.userData.fenMat.emissiveIntensity = 0.9;
const lumRoger = new THREE.PointLight("#ffb257", 5, 6, 1.5); lumRoger.position.set(30, 1.3, 1.6); scene.add(lumRoger);
scene.add(pose(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 0.12, 8), mat("#c0392b")), 32.2, 0.1, 1.0));

/* ---------- La piscine (x 20 → 26), en coupe ---------- */
const piscine = groupe(23, 0, 0); scene.add(piscine);
piscine.add(pose(new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.05, 3.2), mat("#1e2a36")), 0, 0.07, -0.1));
for (const [w, d, x, z] of [[6.6, 0.25, 0, 1.55], [6.6, 0.25, 0, -1.75], [0.25, 3.4, -3.2, -0.1], [0.25, 3.4, 3.2, -0.1]]) piscine.add(pose(bloc(w, 0.14, d, "#e8e2d4", 0.01), x, 0.1, z));
const bassin = pose(new THREE.Mesh(new THREE.BoxGeometry(6.0, 2.2, 0.04), mat("#8fb9cc")), 0, -1.1, AVANT + 0.05); piscine.add(bassin);
for (const [x, y] of [[-3, -1.1], [3, -1.1]]) piscine.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.2, 0.06), mat("#e8e2d4")), x, y, AVANT + 0.07));
piscine.add(pose(new THREE.Mesh(new THREE.BoxGeometry(6.1, 0.12, 0.06), mat("#e8e2d4")), 0, -2.2, AVANT + 0.07));
const fissP = groupe(); piscine.add(fissP);
for (const [x, y, r, l] of [[-1.5, -0.8, 0.5, 0.8], [-1.2, -1.4, -0.4, 0.7], [1.4, -1.0, -0.6, 1.0], [1.7, -1.7, 0.3, 0.5]]) fissP.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.06, l, 0.03), mat("#2a231c")), x, y, AVANT + 0.09, 0, 0, r));
for (let i = 0; i < 7; i++) piscine.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.03), mat(i % 2 ? "#a0602e" : "#7a6a2a")), -2.4 + alea() * 4.8, -2.05, AVANT + 0.1, 0, 0, alea()));
for (const s of [-1, 1]) piscine.add(pose(bloc(0.06, 1.1, 0.06, "#c9ced6", 0), -2.6 + s * 0.25, 0.5, 1.2));

/* ---------- Le robinet (vérification) ---------- */
const robinet = groupe(14.6, 0, 1.0); scene.add(robinet);
robinet.add(pose(bloc(0.14, 1.2, 0.14, "#7b7f86", 0.01), 0, 0.6, 0), pose(bloc(0.14, 0.12, 0.42, "#8d9199", 0.01), 0, 1.15, 0.16), pose(bloc(0.1, 0.2, 0.1, "#8d9199", 0.01), 0, 1.02, 0.34), pose(bloc(0.26, 0.08, 0.1, "#d24b3e", 0.01), 0, 1.28, 0.04));
const jet = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.9, 6), new THREE.MeshStandardMaterial({ color: "#7cc4ff", emissive: "#2b6fae", emissiveIntensity: 0.5, transparent: true, opacity: 0.85 }));
jet.position.set(0, 0.47, 0.34); jet.scale.y = 0.001; robinet.add(jet);
const flaque = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.02, 10), new THREE.MeshStandardMaterial({ color: "#7cc4ff", transparent: true, opacity: 0.7 })); flaque.position.set(0, 0.07, 0.4); flaque.scale.set(0.001, 1, 0.5); robinet.add(flaque);

/* ---------- Arbres (fond + bords) ---------- */
function sapin(x, z, h) {
  const g = groupe(x, 0, z);
  g.add(pose(bloc(0.18, 0.6, 0.18, "#4a2f1c", 0.02), 0, 0.3, 0));
  for (let i = 0; i < 3; i++) g.add(pose(ombre(new THREE.Mesh(facettes(new THREE.ConeGeometry(0.9 - i * 0.22, 1.1, 6, 1), 0.08), mat(i % 2 ? "#1f4a32" : "#245a3a"))), 0, 0.9 + i * 0.6, 0));
  g.scale.setScalar(h); g.rotation.y = alea() * 3; return g;
}
const arriere = groupe(); scene.add(arriere);
for (let x = -40; x < 50; x += 6 + alea() * 5) arriere.add(sapin(x, -6 - alea() * 3, 0.5 + alea() * 0.3));
for (let x = -40; x < 50; x += 3) arriere.add(pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(2.6 + alea() * 1.6, 0), 0.4), mat("#2c3f6a")), x, -1.9, -16 - alea() * 3));
for (const x of [-8, 19.6, 27.3, 34]) scene.add(sapin(x, -2.4, 0.7 + alea() * 0.15));

/* ---------- Lumières ---------- */
const hemi = new THREE.HemisphereLight("#9ab0ee", "#3a4a2a", 2.1); scene.add(hemi);
const face = new THREE.DirectionalLight("#b9c6ff", 0.9); face.position.set(0, 2, 40); scene.add(face, face.target);
const luneL = new THREE.DirectionalLight("#8faaff", 1.6); luneL.position.set(-8, 14, 12); luneL.castShadow = true;
luneL.shadow.mapSize.set(2048, 2048); Object.assign(luneL.shadow.camera, { left: -16, right: 16, top: 12, bottom: -4, near: 1, far: 60 }); luneL.shadow.bias = -0.0008;
scene.add(luneL, luneL.target);
const soleil = new THREE.DirectionalLight("#ffe2b0", 0); soleil.position.set(-10, 14, 10); scene.add(soleil, soleil.target);
Object.assign(soleil.shadow.camera, { left: -16, right: 16, top: 12, bottom: -4, near: 1, far: 60 }); soleil.shadow.mapSize.set(2048, 2048);
scene.fog = new THREE.Fog("#1a2650", 40, 120);

const malo = creerMalo(); malo.scale.setScalar(0.72); scene.add(malo);
const roger = creerRoger(); roger.scale.setScalar(0.8); scene.add(roger);

/* ---------- Épisode 3 : état de départ = fin de l'épisode 2 ---------- */
routeMat.color.set("#a7a39a"); trous.forEach((m) => (m.visible = false)); routeCoupe.scale.x = 1; routeCoupe.position.x = -16; rouleau.visible = false;
vieuxTuyau.visible = false; tuyau.scale.y = 26; tuyau.position.x = 7; branches.forEach((b, i) => (b.visible = i < 5)); compteur.visible = true;
jet.visible = false; flaque.visible = false; fissP.visible = false;
piscine.children.filter((m) => Math.abs(m.position.y + 2.05) < 0.01).forEach((f) => (f.visible = false));
bassin.material.color.set("#6ec3ee");
const eauMat = new THREE.MeshStandardMaterial({ color: "#2f8fd8", transparent: true, opacity: 0.82, emissive: "#0f4f8a", emissiveIntensity: 0.25 });
const eauCoupe = new THREE.Mesh(new THREE.BoxGeometry(5.86, 2.05, 0.05), eauMat); eauCoupe.position.set(0, -2.18 + 1.025, AVANT + 0.08); piscine.add(eauCoupe);

  L.forEach(([a, b, tm], i) => { const y = 116 + i * 56; s += `<g opacity="${clamp((t - tm) / 0.2)}"><text x="-222" y="${y}" font-family="Inter" font-weight="800" font-size="27" fill="#2b2b2b">${a}</text><text x="272" y="${y}" text-anchor="end" font-family="Inter" font-weight="900" font-size="28" fill="#2b2b2b">${b}</text></g>`; });
  const yt = 116 + 3 * 56 + 6;
  s += `<g opacity="${clamp((t - P("total", 0.2)) / 0.2)}"><line x1="-222" y1="${yt - 36}" x2="272" y2="${yt - 36}" stroke="#1b1b1b" stroke-width="3"/><text x="-222" y="${yt + 4}" font-family="Inter" font-weight="900" font-size="28" fill="#e23b3b">TOTAL</text><text x="272" y="${yt + 4}" text-anchor="end" font-family="Inter" font-weight="900" font-size="32" fill="#e23b3b">3 500 €</text></g>`;
  return s + `</g>`;
}
function rapport(t) {
  const o = vis(t, P("conforme", -0.1), P("voiture", -0.1), 0.25); if (o <= 0) return "";
  const L = [["Barrière piscine", P("conforme", 0.7), 1], ["Extincteurs", P("conforme", 2.3), 1], ["Éclairage", P("conforme", 3.85), 1], ["Lac : baignade", P("interdite", 0.3), 0]];
  const h = 120 + 4 * 56 + 20;
  let s = `<g opacity="${o}" transform="translate(540,${510 + (1 - o) * -30}) rotate(2)">
    <rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#000" opacity=".25" transform="translate(8,10)"/><rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#ffffff"/>
    <rect x="-300" y="0" width="600" height="72" rx="6" fill="#3b4048"/><text x="0" y="48" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="2">RAPPORT D'INSPECTION</text>`;
  L.forEach(([a, tm, ok], i) => {

        : `<text x="200" y="${y}" text-anchor="end" font-family="Inter" font-weight="900" font-size="26" fill="#d62828">INTERDITE</text><path d="M222 ${y - 22} l 26 26 M248 ${y - 22} l -26 26" stroke="#d62828" stroke-width="7" stroke-linecap="round"/>`}</g>`;
  });
  const st = clamp((t - P("ouvrir", 0.3)) / 0.18);
  if (st > 0) s += `<g opacity="${st}" transform="translate(40,${h - 40}) rotate(-10) scale(${1 + 0.5 * (1 - st)})"><rect x="-230" y="-48" width="460" height="92" rx="10" fill="#ffffff" fill-opacity=".85" stroke="#22a55a" stroke-width="8"/><text x="0" y="16" text-anchor="middle" font-family="Inter" font-weight="900" font-size="42" fill="#22a55a">AUTORISÉ À OUVRIR</text></g>`;
  return s + `</g>`;
}
function plusTard(t) {
  const o = vis(t, P("plustard", -0.25), P("plustard", 1.3), 0.25); if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c"/><text x="540" y="930" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="#ffffff">10 JOURS</text><text x="540" y="1030" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" fill="#ffc93c">PLUS TARD…</text></g>`;
}
const ETIQUETTES = [["1ʳᵉ FAMILLE !", "une", 0.1, "question", 640, "#22a55a"]];
function etiquettes(t) {
  let s = "";
  for (const [txt, a, d, b, y, col] of ETIQUETTES) {
    const o = vis(t, P(a, d), P(b), 0.15); if (o <= 0) continue;
    const w = txt.length * 26 + 50, k = 1 + 0.4 * (1 - easeIO(clamp((t - P(a, d)) / 0.18)));
    s += `<g opacity="${o}" transform="translate(560,${y}) rotate(-6) scale(${k})"><rect x="${-w / 2}" y="-34" width="${w}" height="66" rx="10" fill="${col}" stroke="#ffffff" stroke-width="5"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="1">${txt}</text></g>`;
  }
  return s;
}
function choix(t) {
  const a = P("choix"), b = DUREE - 2.6; let s = "";
  const carte = (cx, titre, sous, col, ic, o) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},640) scale(${0.8 + 0.2 * o})"><rect x="-205" y="-120" width="410" height="240" rx="24" fill="#121828" stroke="${col}" stroke-width="7"/>${ic}
    <text x="0" y="58" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="${col}">${titre}</text><text x="0" y="96" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#b9c0d0" letter-spacing="2">${sous}</text></g>`;
  const bouee = `<g transform="translate(0,-40)"><circle r="40" fill="none" stroke="#ffffff" stroke-width="20"/><circle r="40" fill="none" stroke="#e63946" stroke-width="20" stroke-dasharray="31.4 31.4"/></g>`;
  const poisson = `<g transform="translate(-6,-40)"><path d="M-46 0 q 36 -36 74 0 q -38 36 -74 0 Z" fill="#7cc4ff"/><path d="M26 0 l 26 -22 l 0 44 Z" fill="#7cc4ff"/><circle cx="-26" cy="-6" r="5" fill="#121828"/></g>`;
  s += carte(280, "MAÎTRE-NAGEUR", "2 000 € PAR MOIS", "#ff5a5f", bouee, vis(t, a, b, 0.25));
  s += carte(800, "PÊCHE & PÉDALOS", "PAS DE BAIGNADE", "#4fa3ff", poisson, vis(t, P("choix2"), b, 0.25));
  const oo = vis(t, P("choix2", -0.3), b, 0.2); if (oo > 0) s += `<g opacity="${oo}"><circle cx="540" cy="640" r="44" fill="#ffffff"/><text x="540" y="654" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#1b1b1b">OU</text></g>`;
  const oc = vis(t, P("comment"), b, 0.25); if (oc > 0) s += `<g opacity="${oc}" transform="translate(540,860) scale(${0.85 + 0.15 * oc})"><rect x="-400" y="-38" width="800" height="76" rx="38" fill="#ff3b5c"/><text x="0" y="12" text-anchor="middle" font-family="Inter" font-weight="900" font-size="29" fill="#fff">ÉCRIS « MAÎTRE-NAGEUR » OU « PÊCHE »</text></g>`;
  return s;
}
function sousTitres(t) {
  const c = CHUNKS.find((k) => t >= k.t0 && t < k.t1);
  if (!c || t > FIN_VOIX + 0.3) return "";
  const pop = 0.92 + 0.08 * easeIO(clamp((t - c.t0) / 0.1));
  const COUL = { w: "#ffffff", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#4fa3ff" };
  const sp = c.map((w) => `<tspan fill="${t >= w.t ? COUL[w.c] : "#9a9089"}">${w.txt.toUpperCase()}</tspan>`).join(" ");
  const MES = sousTitres.c || (sousTitres.c = document.createElement("canvas").getContext("2d")); MES.font = "900 64px Inter";
  const larg = MES.measureText(c.map((w) => w.txt.toUpperCase()).join(" ")).width + 20;
  const k = Math.min(1, 1000 / larg);
  return `<g transform="translate(540,1330) scale(${pop * k})"><text x="3" y="4" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" fill="#000" opacity=".35" letter-spacing="1">${c.map((w) => w.txt.toUpperCase()).join(" ")}</text><text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" letter-spacing="1">${sp}</text></g>`;
}


function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35); if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c" opacity=".88"/>
    <text x="540" y="760" text-anchor="middle" font-family="Inter" font-weight="900" font-size="38" fill="#4ade80" letter-spacing="6">LES PINS PERDUS · SAISON 1</text>
    <text x="540" y="860" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffffff">ÉPISODE 5</text>
    <text x="540" y="950" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffc93c">BIENTÔT</text>
    <g transform="translate(540,1120)"><rect x="-360" y="-44" width="720" height="88" rx="44" fill="#ff3b5c"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#fff">+ ABONNE-TOI = +1 € POUR LE CAMPING</text></g></g>`;
}
function vignette(t) {
  const n = nuitP3(t); if (n <= 0.01) return "";
  return `<defs><radialGradient id="vg" cx="50%" cy="48%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".65"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#vg)" opacity="${n.toFixed(3)}"/>`;
}
const FLASHS = [P("une")];
function interface_(t) {
  let s = vignette(t);
  const [mx, my] = ecran(malo, 3.6), [rx, ry] = ecran(roger, 1.6), [ax, ay] = ecran(maire, 3.4), [ix, iy] = ecran(inspecteur, 3.4), [gx, gy] = ecran(gamin, 3.4);
  const Bb = (x, y, txt, c, o) => bulle(clamp(x, 220, 860), clamp(y, 560, 1000), txt, c, o);
  s += titre(t) + hud(t) + etiquettes(t) + carteRappel(t) + sondage(t) + carteArgent(t) + carteLettre(t) + carteAvis(t) + liste(t) + rapport(t);
  s += choix(t);
  s += Bb(ax, ay, "VOUS REFUSEZ ?", "#ffffff", vis(t, P("inspection"), P("inspection", 1.2), 0.15));
  s += Bb(ax, ay, "JE LE FERME.", "#ffffff", vis(t, P("ferme", 1.4), P("dix", 0.2), 0.15));
  s += Bb(mx, my, "NON MERCI !", "#ffffff", vis(t, P("dechire", 1.7), P("maire"), 0.15));
  s += Bb(ix, iy, "HMM…", "#ffffff", vis(t, P("note", 0.2), P("conforme"), 0.15));
  s += Bb(rx, ry, "WOUF !", "#ffffff", vis(t, P("une", 0.3), P("garcon"), 0.2));
  s += Bb(gx, gy, "ON PEUT SE BAIGNER ?", "#4fa3ff", vis(t, P("question"), P("choix"), 0.2));
  s += sousTitres(t);
  for (const ft of FLASHS) { const o = 0.45 * clamp(1 - (t - ft) / 0.3); if (t >= ft && o > 0) s += `<rect width="1080" height="1920" fill="#ffffff" opacity="${o.toFixed(3)}"/>`; }
  for (const c of COUPES) { const o = clamp(1 - Math.abs(t - c) / 0.25); if (o > 0) s += `<rect width="1080" height="1920" fill="#000" opacity="${(o * 0.9).toFixed(3)}"/>`; }
  s += plusTard(t) + carteFin(t);
  document.getElementById("ui").innerHTML = s;
}

/* ---------- Bruitages ---------- */
const EVENEMENTS = [];
const ev = (t, type, d = 0) => { if (t >= 0) EVENEMENTS.push({ t: +t.toFixed(3), type, d }); };
[P("rappel"), P("vote"), P("argent"), P("inspection", 1.3), P("p1", 0.3), P("conforme"), P("choix"), P("comment")].forEach((t) => ev(t, "pop"));
ev(FP("gain"), "kaching"); ev(P("dechire", 1.65), "whoosh"); ev(P("ferme", 1.4), "tampon");
ev(P("p2", 1.3), "pop"); ev(P("p3b", 0.4), "ding"); ev(P("total", 0.4), "kaching");
[P("conforme", 0.7), P("conforme", 2.3), P("conforme", 3.85)].forEach((t) => ev(t, "coche"));
ev(P("interdite", 0.3), "tampon"); ev(P("ouvrir", 0.3), "tampon");
ev(P("voiture", 0.2), "moteur", 2.2); ev(P("une", 0.1), "ding"); ev(P("une", 0.8), "wouf");
ev(DUREE - 2.6, "fin");
window.EVENEMENTS = EVENEMENTS;


/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt); animerMaire(t, dt); animerInspecteur(t, dt); animerFamille(t, dt);
  const c = plan(t), yc = 1.05 / c.z;
  camera.zoom = c.z; camera.updateProjectionMatrix();
  camera.position.set(c.x, yc + 7, 40); camera.lookAt(c.x, yc, 0);
  fond.position.set(c.x, yc + 10, -90); etoiles.position.set(c.x * 0.9, 0, 0);
  lune.position.set(c.x + 2.6 / c.z, yc + 5.5 / c.z, -80); lune.scale.setScalar(1 / c.z);
  const j = jourDe(t); soleilDisque.position.set(c.x - 2.4 / c.z, yc + lerp(-3, 5.8, ease(j, 0.2, 0.8)) / c.z, -80); soleilDisque.scale.setScalar(1 / c.z); soleilDisque.visible = j > 0.75;
  arriere.position.x = c.x * 0.35;
  luneL.target.position.set(c.x, 0, 0); face.target.position.set(c.x, -2, 0); face.position.set(c.x, 2, 40); luneL.position.set(c.x - 8, 14, 12); soleil.target.position.set(c.x, 0, 0); soleil.position.set(c.x - 10, 14, 10);
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;
await document.fonts.ready;
window.pret = true;
if (!location.search.includes("rendu")) {
  rendre(0.3);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => { btn.remove(); voix.currentTime = 0; voix.play().catch(() => {}); const d0 = performance.now();
    const boucle = () => { const t = (performance.now() - d0) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); }; requestAnimationFrame(boucle); };
} else document.body.classList.add("rendu");
</script>
