<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="caseLid16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="50%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="caseBot16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEEEEE"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="budBody16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="caseShine16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="caseShad16">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="budShad16">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="ledGlow16">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="#EDE7F6"/>

  <!-- Shadow under case -->
  <ellipse cx="200" cy="330" rx="100" ry="16" fill="#000" opacity="0.08"/>

  <!-- Case bottom (pill shape) -->
  <g filter="url(#caseShad16)">
    <rect x="95" y="200" width="210" height="110" rx="55" fill="url(#caseBot16)"/>
    <!-- Inner cavity -->
    <rect x="105" y="205" width="190" height="95" rx="47" fill="#DDD"/>
    <!-- Inner shadow -->
    <rect x="110" y="210" width="180" height="85" rx="42" fill="#D5D5D5"/>

    <!-- Earbud wells -->
    <!-- Left well -->
    <ellipse cx="160" cy="255" rx="30" ry="28" fill="#CCC"/>
    <ellipse cx="160" cy="255" rx="26" ry="24" fill="#C8C8C8"/>
    <!-- Right well -->
    <ellipse cx="240" cy="255" rx="30" ry="28" fill="#CCC"/>
    <ellipse cx="240" cy="255" rx="26" ry="24" fill="#C8C8C8"/>

    <!-- Charging pins in wells -->
    <circle cx="155" cy="265" r="2" fill="#B0B0B0"/>
    <circle cx="165" cy="265" r="2" fill="#B0B0B0"/>
    <circle cx="235" cy="265" r="2" fill="#B0B0B0"/>
    <circle cx="245" cy="265" r="2" fill="#B0B0B0"/>
  </g>

  <!-- Left earbud in case -->
  <g filter="url(#budShad16)">
    <!-- Earbud body -->
    <ellipse cx="160" cy="248" rx="20" ry="18" fill="url(#budBody16)"/>
    <!-- Stem going down -->
    <rect x="154" y="258" width="12" height="22" rx="5" fill="url(#budBody16)"/>
    <!-- Ear tip -->
    <ellipse cx="160" cy="242" rx="10" ry="9" fill="#555"/>
    <ellipse cx="160" cy="242" rx="7" ry="6" fill="#444"/>
    <!-- Mesh grill -->
    <circle cx="158" cy="241" r="1" fill="#333"/>
    <circle cx="162" cy="241" r="1" fill="#333"/>
    <circle cx="160" cy="244" r="1" fill="#333"/>
    <!-- Touch surface highlight -->
    <ellipse cx="160" cy="250" rx="12" ry="8" fill="url(#caseShine16)"/>
    <!-- Sensor dot -->
    <circle cx="160" cy="253" r="1.5" fill="#DDD"/>
  </g>

  <!-- Right earbud in case -->
  <g filter="url(#budShad16)">
    <!-- Earbud body -->
    <ellipse cx="240" cy="248" rx="20" ry="18" fill="url(#budBody16)"/>
    <!-- Stem going down -->
    <rect x="234" y="258" width="12" height="22" rx="5" fill="url(#budBody16)"/>
    <!-- Ear tip -->
    <ellipse cx="240" cy="242" rx="10" ry="9" fill="#555"/>
    <ellipse cx="240" cy="242" rx="7" ry="6" fill="#444"/>
    <!-- Mesh grill -->
    <circle cx="238" cy="241" r="1" fill="#333"/>
    <circle cx="242" cy="241" r="1" fill="#333"/>
    <circle cx="240" cy="244" r="1" fill="#333"/>
    <!-- Touch surface highlight -->
    <ellipse cx="240" cy="250" rx="12" ry="8" fill="url(#caseShine16)"/>
    <!-- Sensor dot -->
    <circle cx="240" cy="253" r="1.5" fill="#DDD"/>
  </g>

  <!-- Case lid (open, tilted back) -->
  <g filter="url(#budShad16)">
    <!-- Lid -->
    <path d="M100 205 Q95 140 120 105 Q140 85 200 80 Q260 85 280 105 Q305 140 300 205" fill="url(#caseLid16)"/>
    <!-- Lid inner face -->
    <path d="M110 200 Q108 148 128 115 Q145 98 200 94 Q255 98 272 115 Q292 148 290 200" fill="#E0E0E0"/>
    <!-- Hinge area -->
    <rect x="105" y="198" width="190" height="8" rx="4" fill="#D8D8D8"/>
    <!-- Lid highlight/shine -->
    <path d="M140 130 Q160 108 200 104 Q220 106 240 115" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3"/>
    <!-- Brand indent on lid -->
    <ellipse cx="200" cy="150" rx="20" ry="12" fill="none" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- LED indicator on case front -->
  <g filter="url(#ledGlow16)">
    <circle cx="200" cy="308" r="3" fill="#2979FF"/>
    <circle cx="200" cy="308" r="6" fill="#2979FF" opacity="0.2"/>
    <circle cx="200" cy="308" r="10" fill="#2979FF" opacity="0.08"/>
  </g>

  <!-- USB-C port on bottom -->
  <rect x="191" y="318" width="18" height="5" rx="2" fill="#BDBDBD"/>
  <rect x="194" y="319" width="12" height="3" rx="1" fill="#999"/>

  <!-- "R" and "L" labels -->
  <text x="160" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#AAA" font-weight="600">L</text>
  <text x="240" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#AAA" font-weight="600">R</text>
</svg>