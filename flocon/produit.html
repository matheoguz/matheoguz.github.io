<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flocon — Déco de Noël</title>
<meta name="theme-color" content="#1f3d2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a3242c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11'/%3E%3C/svg%3E">
</head>
<body>
<div id="top"></div>

<main class="wrap" id="main"></main>

<section class="block" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><h2>Ça va bien avec</h2></div>
    <div class="grid" id="related"></div>
  </div>
</section>

<div id="foot"></div>

<script src="assets/store.js"></script>
<script>
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>';
var id = new URLSearchParams(location.search).get('id');
var p = getProduct(id);
var main = document.getElementById('main');

if (!p) {
  main.innerHTML = '<div class="empty"><h1 class="page-title">Produit introuvable</h1><a class="btn btn-green" href="index.html#boutique">Voir la collection</a></div>';
} else {
  document.title = p.name + ' — Flocon';
  var specs = Object.keys(p.specs).map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + esc(p.specs[k]) + '</dd>'; }).join('');
  var worth = packWorth(p);
  main.innerHTML =
    '<div class="crumbs"><a href="index.html">Accueil</a> / <a href="index.html#boutique">Collection</a> / ' + esc(p.name) + '</div>' +
    '<div class="product">' +
      '<div><div class="gallery-main"><img id="mainImg" src="' + U(p.images[0], 1200) + '" alt="' + esc(p.name) + '"></div>' +
      '<div class="thumbs">' + p.images.map(function (im, i) {
        return '<button class="' + (i === 0 ? 'on' : '') + '" data-img="' + im + '" aria-label="Photo ' + (i + 1) + '"><img src="' + U(im, 200) + '" alt=""></button>';
      }).join('') + '</div>' +
      '<p class="photo-note">Photos d\'ambiance. Le produit livré peut légèrement différer.</p></div>' +
      '<div class="info">' +
        (p.tag ? '<span class="eyebrow" style="color:var(--red)">' + esc(p.tag) + '</span>' : '') +
        '<h1>' + esc(p.name) + '</h1>' +
        '<div class="price">' + eur(p.price) + (worth ? ' <span style="font-size:.95rem;font-weight:400;color:var(--muted)">au lieu de ' + eur(worth) + ' séparément</span>' : '') + '</div>' +
        '<p class="lead">' + esc(p.desc) + '</p>' +
        '<ul class="feat">' + p.features.map(function (f) { return '<li>' + CHECK + '<span>' + esc(f) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="buy"><div class="qty"><button id="minus" aria-label="Moins">−</button><span id="q">1</span><button id="plus" aria-label="Plus">+</button></div>' +
        '<button class="btn btn-red" id="addBtn">Ajouter au panier</button></div>' +
        '<div class="ship-note"><div><strong>Livraison :</strong> ' + CONFIG.deliveryDays + ', offerte dès ' + CONFIG.freeShippingFrom + ' €.</div>' +
        '<div><strong>Pour Noël :</strong> commande avant le ' + CONFIG.christmasDeadline + '.</div>' +
        '<div><strong>Retours :</strong> 14 jours pour changer d\'avis.</div></div>' +
        '<div class="specs"><h3>Caractéristiques</h3><dl>' + specs + '</dl></div>' +
      '</div>' +
    '</div>';

  var q = 1, qEl = document.getElementById('q');
  document.getElementById('minus').onclick = function () { q = Math.max(1, q - 1); qEl.textContent = q; };
  document.getElementById('plus').onclick = function () { q = Math.min(20, q + 1); qEl.textContent = q; };
  document.getElementById('addBtn').onclick = function () { addToCart(p.id, q); };
  document.querySelectorAll('.thumbs button').forEach(function (b) {
    b.onclick = function () {
      document.getElementById('mainImg').src = U(b.getAttribute('data-img'), 1200);
      document.querySelectorAll('.thumbs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
  });

  var related = PRODUCTS.filter(function (x) { return x.id !== p.id; }).slice(0, 3);
  document.getElementById('related').innerHTML = related.map(cardHTML).join('');
  bindAddButtons(document.getElementById('related'));
}
</script>
</body>
</html>
