<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0612}
  .ad{position:relative;width:100%;height:100vh;font-family:Arial,sans-serif;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,18,0.1) 0%,rgba(10,6,18,0.15) 50%,rgba(10,6,18,0.95) 100%)}
  .num{position:absolute;top:24px;left:26px;z-index:3;font-size:0.9rem;font-weight:700;color:#a78bfa;letter-spacing:0.1em;background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:100px}
  .content{position:relative;z-index:2;padding:28px 26px 46px}
  h1{font-size:1.9rem;font-weight:900;line-height:1.2;margin-bottom:10px}
  p{font-size:1.05rem;color:#e5d9ff}
</style>
</head>
<body>
<div class="ad">
  <img class="bgimg" src="https://m.media-amazon.com/images/I/91hIlAZuQjL._AC_UL450_SY450_QL70_.jpg" alt="Projecteur Galaxy LED">
  <div class="overlay"></div>
  <div class="num">2 / 4</div>
  <div class="content">
    <h1>Le Projecteur Galaxy LED</h1>
    <p>Un simple appui, et ta pièce devient une vraie galaxie immersive.</p>
  </div>
</div>
</body>
</html>
