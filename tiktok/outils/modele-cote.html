(function decouper() {
  let cur = [];
  const pousser = () => { if (cur.length) { CHUNKS.push(cur); cur = []; } };
  WORDS.forEach((w, i) => { const s = WORDS[i + 1]; cur.push(w); if (cur.length >= 3 || /[.:?!,…]$/.test(w.txt) || !s || s.si !== w.si) pousser(); });
  CHUNKS.forEach((c, i) => { c.t0 = c[0].t; c.t1 = CHUNKS[i + 1] ? CHUNKS[i + 1][0].t : c.at(-1).t + c.at(-1).d + 0.4; });
})();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

const etoiles = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(Array.from({ length: 500 }, () => [(alea() - 0.5) * 120, 2 + alea() * 40, -80]).flat(), 3)), new THREE.PointsMaterial({ color: "#ffffff", size: 0.09, transparent: true, sizeAttenuation: false }));

const compteur = pose(bloc(0.5, 0.5, 0.3, "#2b5e8f", 0.01), -6, -0.72, AVANT + 0.2); scene.add(compteur);

  g.add(pose(new THREE.Mesh(new THREE.BoxGeometry(3.62, 0.18, 1.82), u.bandeMat), 0, 0.62, 0));

  g.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.5, 0.04), u.fenMat), -0.9, 1.2, 0.92), pose(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.5, 0.04), u.fenMat), 1.05, 1.2, 0.92));
  u.porte = pose(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.05, 0.04), u.porteMat), 0.1, 0.95, 0.92); g.add(u.porte);
  u.planches = groupe(); g.add(u.planches);
  for (const [px, r] of [[-0.9, 0.5], [-0.9, -0.4], [1.05, 0.3]]) u.planches.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.09, 0.03), mat("#7a5636")), px, 1.2, 0.95, 0, 0, r));
  u.mousse = groupe(); g.add(u.mousse);
  for (const [px, py] of [[-1.5, 1.98], [1.2, 1.98], [-1.6, 0.4]]) u.mousse.add(pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.22, 0), 0.06), mat("#3f5a2c")), px, py, 0.6));
  u.terrasse = groupe(); g.add(u.terrasse); u.terrasse.visible = false;
  u.terrasse.add(pose(bloc(2.6, 0.12, 1.0, "#a8743f", 0.01), 0.3, 0.32, 1.45), pose(bloc(0.3, 0.3, 0.3, "#c0392b", 0.01), 1.4, 0.55, 1.75), pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.22, 0), 0.04), mat("#3f9a4c")), 1.4, 0.85, 1.75));
  u.lum = new THREE.PointLight("#ffcf8a", 0, 4, 1.6); u.lum.position.set(0, 1.2, 1.6); g.add(u.lum);
  u.etat = 0; g.userData = u;
  return g;
}
function etatMobilHome(m, p, t) {
  const u = m.userData;
  u.murMat.color.set("#9c9282").lerp(new THREE.Color("#f4f1ea"), p);
  u.toitMat.color.set("#5c5248").lerp(new THREE.Color("#3e5266"), p);
  u.bandeMat.color.set("#7a6a55").lerp(new THREE.Color("#2e8b57"), p);
  u.fenMat.color.set("#20242c").lerp(new THREE.Color("#ffd98a"), p); u.fenMat.emissive.set("#ffb84d"); u.fenMat.emissiveIntensity = p * 0.7;
  u.porteMat.color.set(p > 0.5 ? "#2e6b52" : "#5b4a38");
  u.toit.rotation.z = lerp(0.07, 0, p); u.toit.position.y = lerp(1.82, 1.88, p);
  u.planches.visible = p < 0.5; u.mousse.visible = p < 0.5; u.terrasse.visible = p > 0.5;
  const bond = p > 0 && p < 1 ? Math.sin(p * Math.PI) * 0.12 : 0; m.scale.set(1 + bond, 1 + bond, 1);
  u.lum.intensity = p * 2.5;
}

for (let x = -40; x < 50; x += 1.6 + alea() * 1.2) arriere.add(sapin(x, -5 - alea() * 4, 0.7 + alea() * 0.5));

/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt);
  const c = plan(t), yc = 1.05 / c.z;
  camera.zoom = c.z; camera.updateProjectionMatrix();
  camera.position.set(c.x, yc + 7, 40); camera.lookAt(c.x, yc, 0);
  fond.position.set(c.x, yc + 10, -90); etoiles.position.set(c.x * 0.9, 0, 0);
  lune.position.set(c.x + 2.6 / c.z, yc + 5.5 / c.z, -80); lune.scale.setScalar(1 / c.z);
  const j = jourDe(t); soleilDisque.position.set(c.x - 2.4 / c.z, yc + lerp(-3, 5.8, ease(j, 0.2, 0.8)) / c.z, -80); soleilDisque.scale.setScalar(1 / c.z); soleilDisque.visible = j > 0.15;
  arriere.position.x = c.x * 0.35;
  luneL.target.position.set(c.x, 0, 0); face.target.position.set(c.x, -2, 0); face.position.set(c.x, 2, 40); luneL.position.set(c.x - 8, 14, 12); soleil.target.position.set(c.x, 0, 0); soleil.position.set(c.x - 10, 14, 10);
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;

window.pret = true;
if (!location.search.includes("rendu")) {
  rendre(0.3);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => { btn.remove(); voix.currentTime = 0; voix.play().catch(() => {}); const d0 = performance.now();
    const boucle = () => { const t = (performance.now() - d0) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); }; requestAnimationFrame(boucle); };
} else document.body.classList.add("rendu");
