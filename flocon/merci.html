<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour ta commande — Flocon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3d2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a3242c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11'/%3E%3C/svg%3E">
</head>
<body>
<div id="top"></div>

<main class="wrap">
  <div class="empty panel" style="margin:50px auto 80px;max-width:640px">
    <h1 class="page-title" style="padding-top:0">Merci pour ta commande</h1>
    <p id="msg">Ton paiement a bien été transmis à PayPal. Tu vas recevoir une confirmation par email.</p>
    <p style="margin-top:10px">Livraison en <span class="days"></span>. Une question ? Réponds simplement à l'email de confirmation.</p>
    <a class="btn btn-green" href="index.html">Retour à la boutique</a>
  </div>
</main>

<div id="foot"></div>

<script src="assets/store.js"></script>
<script>
var ref = new URLSearchParams(location.search).get('ref');
if (ref && /^FL-[0-9A-Z-]+$/.test(ref)) {
  document.getElementById('msg').textContent = 'Commande ' + ref + ' : ton paiement a bien été transmis à PayPal. Tu vas recevoir une confirmation par email.';
}
document.querySelectorAll('.days').forEach(function (e) { e.textContent = CONFIG.deliveryDays; });
writeCart([]);
</script>
</body>
</html>
