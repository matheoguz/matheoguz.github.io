<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Bestiaire · Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0b10; --fg:#f3eee8; --rouge:#f2a93b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; min-height:100vh }
  canvas { width:min(100%, 420px); aspect-ratio:9/16; height:auto; border-radius:14px; box-shadow:0 10px 40px #000a; background:#000 }
  .barre { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; width:min(100%,420px) }
  button, select { background:#1d1922; color:var(--fg); border:1px solid #3a3342; border-radius:10px; padding:10px 14px; font:inherit; font-weight:600 }
  button.go { background:var(--rouge); border-color:var(--rouge) }
  input[type=range] { width:min(100%,420px) }
  small { opacity:.6 }
  body.rendu { padding:0; background:#000 } body.rendu .barre, body.rendu input, body.rendu small, body.rendu h1 { display:none }
  body.rendu canvas { width:1080px; border-radius:0 }
  h1 { font-family:Anton,Impact,sans-serif; font-weight:400; letter-spacing:1px; margin:4px 0 0 }
  h1 span { color:var(--rouge) }
</style>
</head>
<body>
<h1>LE <span>BESTIAIRE</span></h1>
<canvas id="c" width="1080" height="1920"></canvas>
<input id="pos" type="range" min="0" max="1000" value="0">
<div class="barre">
  <button class="go" id="play">▶ Lecture</button>
  <select id="ep"></select>
  <small id="info"></small>
</div>
<small>Aperçu sans son. La vidéo finale (avec son) est rendue par <code>render.mjs</code>.</small>
<script src="monstres-art.js"></script>
<script src="persos.js"></script>
<script src="decors.js"></script>
<script src="decors-skinwalker.js"></script>
<script src="style2.js"></script>
<script src="style2-maison.js"></script>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const EPISODES = ['ep06-skinwalker-maison', 'ep05-skinwalker-camp', 'ep04-skinwalker', 'ep02-hasshaku', 'ep01-wendigo'];
let EP = null, BIBLE = null, TIMELINE = [], DUR = 0;
const FONT = '"Anton", "Inter Display", Impact, sans-serif';

// ---------- utilitaires ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function rnd(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function shade(hex, k) { // k<0 assombrit, k>0 éclaircit
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// ---------- décors ----------
function neige(t, n = 120, seed = 7, alpha = .8) {
  const r = rnd(seed); ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, sp = 60 + r() * 120, sz = 2 + r() * 5, ph = r() * 10;
    const y = ((r() * H + t * sp) % (H + 40)) - 20, x = (x0 + Math.sin(t * .8 + ph) * 30 + W) % W;
    ctx.beginPath(); ctx.arc(x, y, sz, 0, 7); ctx.fill();
  }
}
function sapin(x, y, h, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < 4; i++) {
    const yy = y - h * (i * .22), w = h * (.42 - i * .08);
    ctx.beginPath(); ctx.moveTo(x, yy - h * .38); ctx.lineTo(x - w, yy); ctx.lineTo(x + w, yy); ctx.fill();
  }
  ctx.fillRect(x - h * .03, y, h * .06, h * .08);
}
function ciel(aube) {
  ctx.fillStyle = aube ? vgrad(0, H * .55, ['#3c4a6b', '#8a7f9c', '#e8b59a']) : vgrad(0, H * .55, ['#07080f', '#141a2e', '#27304a']);
  ctx.fillRect(0, 0, W, H);
  if (!aube) { ctx.fillStyle = '#eef0f6'; ctx.shadowColor = '#cfe0ff'; ctx.shadowBlur = 60; ctx.beginPath(); ctx.arc(820, 300, 70, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    const r = rnd(3); ctx.fillStyle = '#ffffff88'; for (let i = 0; i < 70; i++) { ctx.fillRect(r() * W, r() * H * .45, 2, 2); } }
}
function foret(yBase, aube) {
  const r = rnd(11);
  for (let i = 0; i < 16; i++) sapin(r() * W, yBase - 20 + r() * 30, 200 + r() * 160, aube ? '#3b4558' : '#0e1424');
  for (let i = 0; i < 10; i++) sapin(r() * W, yBase + 40 + r() * 40, 300 + r() * 200, aube ? '#2a3244' : '#090d18');
}
function refuge(x, y, s, lumiere, aube) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#4a2f22'; ctx.fillRect(-300, -330, 600, 330);
  ctx.strokeStyle = '#3a2219'; ctx.lineWidth = 6;
  for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(-300, -i * 42); ctx.lineTo(300, -i * 42); ctx.stroke(); }
  ctx.fillStyle = '#e9eef5'; ctx.beginPath(); ctx.moveTo(-370, -320); ctx.lineTo(0, -560); ctx.lineTo(370, -320); ctx.lineTo(340, -290); ctx.lineTo(0, -510); ctx.lineTo(-340, -290); ctx.fill();
  ctx.fillStyle = '#5b3a2b'; ctx.beginPath(); ctx.moveTo(-340, -290); ctx.lineTo(0, -510); ctx.lineTo(340, -290); ctx.lineTo(300, -330); ctx.lineTo(-300, -330); ctx.fill();
  ctx.fillStyle = '#2a1812'; ctx.fillRect(-70, -230, 140, 230);
  const wcol = lumiere ? '#ffcf73' : '#1a2233';
  if (lumiere) { ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 50; }
  ctx.fillStyle = wcol; ctx.fillRect(130, -220, 110, 100); ctx.fillRect(-240, -220, 110, 100); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#2a1812'; ctx.lineWidth = 8; ctx.strokeRect(130, -220, 110, 100); ctx.strokeRect(-240, -220, 110, 100);
  ctx.beginPath(); ctx.moveTo(185, -220); ctx.lineTo(185, -120); ctx.moveTo(-185, -220); ctx.lineTo(-185, -120); ctx.stroke();
  ctx.fillStyle = '#f3f6fa'; rr(-330, -10, 660, 30, 14); ctx.fill();
  ctx.restore();
}
function sol(y, aube) {
  ctx.fillStyle = aube ? vgrad(y, H, ['#d7dbe6', '#a9b0c2']) : vgrad(y, H, ['#55617e', '#2b3247']); ctx.fillRect(0, y, W, H - y);
}
function lac(t, p) {
  ciel(p.aube); foret(1080, p.aube);
  ctx.fillStyle = vgrad(1080, H, ['#4f5c7a', '#3a4560', '#232a3d']); ctx.fillRect(0, 1080, W, H - 1080);
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 3; const r = rnd(5);
  for (let i = 0; i < 14; i++) { ctx.beginPath(); let x = r() * W, y = 1150 + r() * 700; ctx.moveTo(x, y); for (let k = 0; k < 4; k++) { x += 40 + r() * 80; y += (r() - .5) * 50; ctx.lineTo(x, y); } ctx.stroke(); }
  if (p.refuge_loin) refuge(540, 1100, .28, true, false);
  if ((p.props || []).includes('motoneige')) motoneige(560, 1650, 1, t);
}
function motoneige(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#00000055'; ctx.beginPath(); ctx.ellipse(0, 20, 330, 40, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-300, 10); ctx.lineTo(240, 10); ctx.quadraticCurveTo(320, 10, 320, -30); ctx.stroke();
  ctx.fillStyle = '#b8262b'; ctx.beginPath(); ctx.moveTo(-260, -20); ctx.lineTo(200, -20); ctx.quadraticCurveTo(300, -40, 260, -140); ctx.lineTo(80, -170); ctx.lineTo(-200, -110); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#111'; rr(-230, -150, 260, 50, 20); ctx.fill();
  ctx.fillStyle = '#9fd0ff66'; ctx.beginPath(); ctx.moveTo(90, -170); ctx.lineTo(160, -260); ctx.lineTo(210, -150); ctx.fill();
  ctx.fillStyle = '#ffffff10'; for (let i = 0; i < 4; i++) { const k = (t * .7 + i * .25) % 1; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.arc(260 + k * 60, -120 - k * 160, 20 + k * 40, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  ctx.restore();
}
function refugeExt(t, p) {
  ciel(p.aube); foret(1000, p.aube); sol(1250, p.aube);
  refuge(540, 1330, 1.25, !p.aube, p.aube);
  if (p.aube) { // assiette + mot devant la porte
    ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.ellipse(540, 1420, 70, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff8e2'; ctx.fillRect(505, 1395, 70, 40);
    ctx.fillStyle = '#3d4258'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(470 - i * 90 + (i % 2) * 30, 1480 + i * 70, 22, 40, .3, 0, 7); ctx.fill(); }
  }
}
function murs(sombre) {
  ctx.fillStyle = '#3d2519'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) { ctx.fillStyle = i % 2 ? '#4a2e1f' : '#432a1c'; ctx.fillRect(0, i * 52, W, 50); ctx.fillStyle = '#2b1a11'; ctx.fillRect(0, i * 52 + 48, W, 4); }
  ctx.fillStyle = vgrad(1280, H, ['#5a3a25', '#3a2416']); ctx.fillRect(0, 1280, W, H - 1280);
  ctx.strokeStyle = '#2a190f'; ctx.lineWidth = 4; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(540 + (i - 6) * 40, 1280); ctx.lineTo(540 + (i - 6) * 260, H); ctx.stroke(); }
}
function lampe(x, y, on, t) {
  if (on) { const fl = .85 + Math.sin(t * 13) * .05 + Math.sin(t * 7.3) * .05;
    const g = ctx.createRadialGradient(x, y, 10, x, y, 700); g.addColorStop(0, `rgba(255,190,90,${.55 * fl})`); g.addColorStop(1, 'rgba(255,170,60,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(x - 10, y, 20, 60); ctx.fillStyle = on ? '#ffd27a' : '#6b5a3a'; rr(x - 40, y - 70, 80, 75, 14); ctx.fill();
}
function refugeInt(t, p) {
  murs(p.sombre);
  // fenêtre
  ctx.fillStyle = '#0d1426'; ctx.fillRect(700, 420, 280, 330);
  ctx.save(); ctx.beginPath(); ctx.rect(700, 420, 280, 330); ctx.clip(); ctx.translate(0, 0); neige(t, 40, 9, .7); ctx.restore();
  ctx.strokeStyle = '#2a170e'; ctx.lineWidth = 16; ctx.strokeRect(700, 420, 280, 330); ctx.beginPath(); ctx.moveTo(840, 420); ctx.lineTo(840, 750); ctx.moveTo(700, 585); ctx.lineTo(980, 585); ctx.stroke();
  // porte
  ctx.fillStyle = '#2b180e'; ctx.fillRect(110, 640, 260, 640); ctx.fillStyle = '#c9a25a'; ctx.beginPath(); ctx.arc(330, 980, 12, 0, 7); ctx.fill();
  // poêle
  ctx.fillStyle = '#1b1b1f'; rr(0, 1050, 150, 230, 10); ctx.fill();
  if (!p.sombre) { ctx.fillStyle = `rgba(255,120,30,${.7 + Math.sin(t * 9) * .2})`; rr(30, 1110, 90, 70, 8); ctx.fill(); }
  // table
  ctx.fillStyle = '#6b4329'; ctx.fillRect(560, 1180, 420, 40); ctx.fillRect(590, 1220, 24, 160); ctx.fillRect(930, 1220, 24, 160);
  ctx.fillStyle = '#efe3c4'; ctx.save(); ctx.translate(700, 1170); ctx.rotate(-.08); ctx.fillRect(-50, -14, 100, 16); ctx.restore();
  lampe(890, 1110, !p.sombre || true, t);
  if (p.sombre) { ctx.fillStyle = 'rgba(5,8,20,.55)'; ctx.fillRect(0, 0, W, H); lampe(890, 1110, true, t); ctx.fillStyle = 'rgba(5,8,20,.25)'; ctx.fillRect(0, 0, W, H); }
  // la porte bouge quand on gratte
  if (p.son === 'gratte') { const k = Math.sin(t * 40) * (Math.sin(t * 3) > 0 ? 3 : 0); ctx.fillStyle = '#00000066'; ctx.fillRect(110 + k, 1270, 260, 10); }
}
function porte(t, p) {
  ctx.fillStyle = '#20140c'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = i % 2 ? '#3a2416' : '#33200f'; ctx.fillRect(180 + i * 80, 200, 78, 1500); }
  ctx.strokeStyle = '#140b06'; ctx.lineWidth = 30; ctx.strokeRect(180, 200, 720, 1500);
  ctx.fillStyle = '#b89048'; ctx.beginPath(); ctx.arc(820, 1000, 26, 0, 7); ctx.fill();
  // lumière sous la porte + ombres de pieds
  ctx.fillStyle = '#9ab4ff55'; ctx.fillRect(180, 1690, 720, 16);
  const k = clamp((t - .5) / 1.5); ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(420, 1690, 70, 16); ctx.fillRect(560, 1690, 70, 16);
  // griffures
  ctx.strokeStyle = '#d9c39a'; ctx.lineWidth = 5; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(470 + i * 28, 1100); ctx.lineTo(450 + i * 28, 1100 + 260 * clamp(t / 2)); ctx.stroke(); }
  ctx.fillStyle = 'rgba(5,8,20,.35)'; ctx.fillRect(0, 0, W, H);
}
function fenetre(t, p) {
  ctx.fillStyle = '#2d1c12'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0a1020'; ctx.fillRect(140, 380, 800, 1000);
  ctx.save(); ctx.beginPath(); ctx.rect(140, 380, 800, 1000); ctx.clip();
  foret(1500, false);
  const a = clamp((t - (p.monstre?.apparait ?? .5)) / 1.2);
  if (a > 0) { ctx.globalAlpha = a; wendigo(540, 2150 - 380 * easeOut(a), 1.5, t, true); ctx.globalAlpha = 1; }
  neige(t, 60, 4, .8);
  ctx.restore();
  ctx.strokeStyle = '#1c0f08'; ctx.lineWidth = 34; ctx.strokeRect(140, 380, 800, 1000);
  ctx.beginPath(); ctx.moveTo(540, 380); ctx.lineTo(540, 1380); ctx.moveTo(140, 880); ctx.lineTo(940, 880); ctx.stroke();
  ctx.fillStyle = '#ffffff10'; ctx.fillRect(160, 400, 360, 460);
}

// ---------- personnages ----------
function perso(def, o, t) {
  const s = (o.echelle || 1) * 1.15, x = o.x, y = o.y ?? 1700;
  const pas = o.marche ? Math.sin(t * 7) : 0, respire = Math.sin(t * 2.2 + x) * 4;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#00000044'; ctx.beginPath(); ctx.ellipse(0, 6, 120, 22, 0, 0, 7); ctx.fill();
  // jambes
  ctx.fillStyle = '#2b2f3c';
  ctx.save(); ctx.translate(-34, -250); ctx.rotate(pas * .18); rr(-24, 0, 48, 250, 16); ctx.fill(); ctx.fillStyle = '#e8e8ea'; rr(-30, 230, 62, 30, 12); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#2b2f3c';
  ctx.save(); ctx.translate(34, -250); ctx.rotate(-pas * .18); rr(-24, 0, 48, 250, 16); ctx.fill(); ctx.fillStyle = '#e8e8ea'; rr(-32, 230, 62, 30, 12); ctx.fill(); ctx.restore();
  // corps (doudoune)
  ctx.translate(0, respire * .3);
  const v = def.veste;
  ctx.fillStyle = shade(v, -.25); rr(-120, -520, 40, 230, 20); ctx.fill(); rr(80, -520, 40, 230, 20); ctx.fill();
  ctx.fillStyle = v; rr(-92, -560, 184, 330, 50); ctx.fill();
  ctx.strokeStyle = shade(v, -.2); ctx.lineWidth = 5; for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-88, -560 + i * 64); ctx.quadraticCurveTo(0, -548 + i * 64, 88, -560 + i * 64); ctx.stroke(); }
  if (!o.dos) { ctx.beginPath(); ctx.moveTo(0, -540); ctx.lineTo(0, -240); ctx.stroke(); }
  ctx.fillStyle = def.peau; ctx.beginPath(); ctx.arc(-100, -282, 20, 0, 7); ctx.arc(100, -282, 20, 0, 7); ctx.fill();
  if (o.objet === 'chocolat') { ctx.fillStyle = '#5a2e14'; ctx.save(); ctx.translate(100, -300); ctx.rotate(-.3); ctx.fillRect(-14, -50, 28, 70); ctx.fillStyle = '#c62f2f'; ctx.fillRect(-15, -10, 30, 34); ctx.restore(); }
  // cou + tête
  ctx.fillStyle = shade(def.peau, -.1); ctx.fillRect(-22, -590, 44, 40);
  const hy = -690; ctx.fillStyle = def.peau; ctx.beginPath(); ctx.ellipse(0, hy, 92, 104, 0, 0, 7); ctx.fill();
  ctx.fillStyle = def.cheveux;
  if (o.dos) { ctx.beginPath(); ctx.ellipse(0, hy - 10, 96, 108, 0, 0, 7); ctx.fill(); if (def.long) { rr(-96, hy, 192, 150, 40); ctx.fill(); } }
  else {
    if (def.long) { rr(-104, hy - 40, 34, 200, 18); ctx.fill(); rr(70, hy - 40, 34, 200, 18); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0, hy - 60, 98, 62, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-96, hy - 60); ctx.quadraticCurveTo(-40, hy - 10, 10, hy - 50); ctx.quadraticCurveTo(60, hy - 20, 96, hy - 60); ctx.fill();
    visage(def, o.expr || 'neutre', hy, t, x);
  }
  if (def.bonnet) { ctx.fillStyle = def.bonnet; ctx.beginPath(); ctx.ellipse(0, hy - 70, 100, 70, 0, Math.PI, 0); ctx.fill(); rr(-104, hy - 82, 208, 40, 14); ctx.fill(); ctx.fillStyle = shade(def.bonnet, -.2); for (let i = -4; i <= 4; i++) ctx.fillRect(i * 22 - 3, hy - 82, 6, 40); }
  ctx.restore();
}
function visage(def, expr, hy, t, seed) {
  const cligne = ((t + seed * .013) % 3.4) < .12;
  const peur = expr === 'peur', inq = expr === 'inquiet', rire = expr === 'rire';
  const ey = hy - 4, ew = peur ? 26 : 22, eh = cligne ? 3 : (peur ? 30 : 24);
  ctx.fillStyle = '#fff'; [-36, 36].forEach(dx => { ctx.beginPath(); ctx.ellipse(dx, ey, ew, eh, 0, 0, 7); ctx.fill(); });
  if (!cligne && !rire) { ctx.fillStyle = '#1b1410'; const pr = peur ? 7 : 11, jx = peur ? Math.sin(t * 30) * 2 : 0; [-36, 36].forEach(dx => { ctx.beginPath(); ctx.arc(dx + jx, ey + 2, pr, 0, 7); ctx.fill(); }); }
  if (rire) { ctx.strokeStyle = '#1b1410'; ctx.lineWidth = 7; [-36, 36].forEach(dx => { ctx.beginPath(); ctx.arc(dx, ey + 8, 16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }); }
  ctx.strokeStyle = shade(def.cheveux, .1); ctx.lineWidth = 7; ctx.lineCap = 'round';
  [-1, 1].forEach(sg => { ctx.beginPath(); const tilt = (peur || inq) ? 14 : 0; ctx.moveTo(sg * 56, ey - 42 + (peur || inq ? 0 : 4)); ctx.lineTo(sg * 18, ey - 42 - tilt * .2 - (peur || inq ? 10 : 0) + (peur||inq? 0:0)); ctx.stroke(); });
  ctx.fillStyle = '#c8705a'; ctx.strokeStyle = '#7a3a2a'; ctx.lineWidth = 6;
  const my = hy + 52;
  if (peur) { ctx.fillStyle = '#4a1d16'; ctx.beginPath(); ctx.ellipse(0, my, 16, 22 + Math.sin(t * 9) * 2, 0, 0, 7); ctx.fill(); }
  else if (rire) { ctx.fillStyle = '#4a1d16'; ctx.beginPath(); ctx.arc(0, my - 8, 34, 0, Math.PI); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-24, my - 8, 48, 8); }
  else if (inq) { ctx.beginPath(); ctx.moveTo(-22, my + 4); ctx.quadraticCurveTo(0, my - 8, 22, my + 4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-20, my); ctx.quadraticCurveTo(0, my + 8, 20, my); ctx.stroke(); }
  ctx.fillStyle = 'rgba(230,120,110,.25)'; ctx.beginPath(); ctx.arc(-58, hy + 30, 16, 0, 7); ctx.arc(58, hy + 30, 16, 0, 7); ctx.fill();
}

// ---------- monstres (dessinés en code, pieds en (x,y)) ----------
function yeux(x, y, col, r, t) { ctx.shadowColor = col; ctx.shadowBlur = 40; ctx.fillStyle = col; const f = .8 + Math.sin(t * 5) * .2; ctx.beginPath(); ctx.arc(x - r * 2.2, y, r * f, 0, 7); ctx.arc(x + r * 2.2, y, r * f, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
function wendigo(x, y, s, t, sombre) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const b = Math.sin(t * 1.6) * 6, peau = sombre ? '#2d2a2e' : '#8d8a86', os = '#e6dfcf';
  ctx.strokeStyle = peau; ctx.lineCap = 'round';
  ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(-40, -300); ctx.lineTo(-55, 0); ctx.moveTo(40, -300); ctx.lineTo(55, 0); ctx.stroke();
  ctx.fillStyle = peau; rr(-80, -620, 160, 340, 60); ctx.fill();
  ctx.strokeStyle = shade(peau.length > 4 ? '#5f5c59' : peau, -.2); ctx.lineWidth = 6; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-50, -560 + i * 30); ctx.quadraticCurveTo(0, -548 + i * 30, 50, -560 + i * 30); ctx.stroke(); }
  ctx.strokeStyle = peau; ctx.lineWidth = 22;

        const a = clamp((lt - (m.apparait || 0)) / (m.fondu || .6)); if (a > 0) { ctx.save(); if (m.clipBas) { ctx.beginPath(); ctx.rect(0, 0, W, m.clipBas); ctx.clip(); } ctx.globalAlpha = a * (m.alpha ?? 1); ctx.translate(x, m.y); ctx.scale(m.echelle, m.echelle); art.dessin(ctx, lt, m); ctx.restore(); } }
      if (D.avant && D.sousHumains) D.avant(ctx, lt, p);
      (p.humains || []).forEach(o => window.HUMAIN(ctx, EP.persos[o.id], o, lt));
      (p.p2 || []).forEach(o => { const q = clamp((lt - (o.depart || 0)) / (o.duree || d)); const oo = { ...o, x: o.x0 != null ? lerp(o.x0, o.x, ease(q)) : o.x, y: o.y0 != null ? lerp(o.y0, o.y, ease(q)) : o.y };
        const a = clamp((lt - (o.apparait || 0)) / .4); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a * (o.alpha ?? 1); window.PERSO2(ctx, EP.persos[o.id], oo, lt); ctx.restore(); });
      if (D.avant && !D.sousHumains) D.avant(ctx, lt, p);
      if (p.voile) { ctx.fillStyle = `rgba(5,8,20,${p.voile})`; ctx.fillRect(0, 0, W, H); }

        const g = ctx.createRadialGradient(lx, ly, 20, lx, ly, L.r || 330); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.7, `rgba(0,0,0,${(L.noir ?? .96) * .55})`); g.addColorStop(1, `rgba(0,0,0,${L.noir ?? .96})`); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g2 = ctx.createRadialGradient(lx, ly, 10, lx, ly, (L.r || 330) * .8); g2.addColorStop(0, 'rgba(255,240,200,.18)'); g2.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = g2; ctx.fillRect(-200, -200, W + 400, H + 400); ctx.restore(); }
    } else {
    SCENES[p.scene](lt, p);

    if (p.scene !== 'refuge_int' && p.scene !== 'porte' && p.scene !== 'fenetre') neige(lt + t, 90, 21, .85);
    }

  }

  if (lt < .18) { ctx.fillStyle = `rgba(0,0,0,${1 - lt / .18})`; ctx.fillRect(0, 0, W, H); }
  // grain
  const r = rnd(Math.floor(t * 24) + 1); ctx.fillStyle = 'rgba(255,255,255,.035)'; for (let i = 0; i < 400; i++) ctx.fillRect(r() * W, r() * H, 2, 2);
};
// liste des sons pour le rendu (temps en secondes)
window.cues = function () { const c = []; let a = 0; for (const p of TIMELINE) { if (p.type === 'roulette') { const sp = p.spin ?? (p.dur - 2.2); for (let i = 0; i < 26; i++) { const tt = sp * (1 - Math.pow(1 - i / 26, 1 / 3)) ; c.push({ t: a + tt * .98, son: 'tic' }); } c.push({ t: a + sp, son: 'choc' }); }
  if (p.son) c.push({ t: a + .1, son: p.son }); (p.sons || []).forEach(x => c.push({ t: a + x.t, son: x.son, dur: x.dur, vol: x.vol })); if (p.voix && EP.voix) c.push({ t: a + (p.voix[2] ?? .2), son: 'voix', fichier: EP.voix, debut: p.voix[0], fin: p.voix[1], voix: true }); if (p.type === 'regle' || p.type === 'mot') c.push({ t: a + .05, son: 'woosh' }); if (p.type === 'fin') c.push({ t: a, son: 'choc' }); a += p.dur; } return c; };

// ---------- chargement + lecteur ----------
async function charger(id) {
  [EP, BIBLE] = await Promise.all([fetch(`episodes/${id}.json`).then(r => r.json()), BIBLE || fetch('monstres.json').then(r => r.json())]);
  TIMELINE = EP.plans; window.EP_COURANT = EP; DUR = TIMELINE.reduce((s, p) => s + p.dur, 0); window.DUR = DUR;
  document.getElementById('info').textContent = `Ép. ${EP.numero} · ${EP.titre} · ${DUR.toFixed(1)} s`;
  try { await document.fonts.load(`100px Anton`); await document.fonts.load(`700 60px Caveat`); } catch (e) {}
  renderAt(0); window.PRET = true;
}
const sel = document.getElementById('ep'); EPISODES.forEach(e => sel.add(new Option(e, e)));
const q = new URLSearchParams(location.search); if (q.has('rendu')) document.body.classList.add('rendu');
sel.value = q.get('ep') || EPISODES[0]; sel.onchange = () => charger(sel.value);
let joue = false, t0 = 0, tc = 0; const pos = document.getElementById('pos');
document.getElementById('play').onclick = () => { joue = !joue; t0 = performance.now() / 1000 - tc; document.getElementById('play').textContent = joue ? '❚❚ Pause' : '▶ Lecture'; };
pos.oninput = () => { tc = pos.value / 1000 * DUR; t0 = performance.now() / 1000 - tc; renderAt(tc); };
(function boucle() { if (joue && DUR) { tc = (performance.now() / 1000 - t0) % DUR; renderAt(tc); pos.value = tc / DUR * 1000; } requestAnimationFrame(boucle); })();
charger(sel.value);
