<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salle de sport — visite</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#c8746a;--glass:rgba(20,18,17,.55)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0e0d0d}
  body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#0e0d0d}
  #track{position:relative}
  #stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
  #cap{position:absolute;left:clamp(16px,5vw,64px);bottom:clamp(70px,12vh,120px);max-width:min(520px,calc(100vw - 32px));pointer-events:none}
  #cap .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
  #cap .t{font-size:clamp(30px,5.2vw,60px);font-weight:700;letter-spacing:-.02em;line-height:1.02;text-shadow:0 4px 30px rgba(0,0,0,.45)}
  #cap .d{margin-top:10px;font-size:clamp(14px,1.5vw,17px);line-height:1.45;opacity:.9;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  #cap>div{transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1)}
  #cap.out>div{opacity:0;transform:translateY(14px)}
  #top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  #brand{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 14px;border-radius:99px;font-size:13px;font-weight:600}
  #brand span{opacity:.6;font-weight:500}
  #libre{color:#fff;text-decoration:none;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 14px;border-radius:99px;font-size:12px;white-space:nowrap}
  #nav{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
  #nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:12px;padding:4px 0}
  #nav button span{opacity:0;transform:translateX(6px);transition:.25s;background:var(--glass);backdrop-filter:blur(8px);padding:5px 9px;border-radius:7px;white-space:nowrap}
  #nav button i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);transition:.25s;flex:none}
  #nav button:hover span,#nav button.on span{opacity:1;transform:none}
  #nav button.on i{background:#fff;transform:scale(1.4)}
  #bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
  #hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s}
  #hint i{width:22px;height:34px;border:2px solid rgba(255,255,255,.8);border-radius:12px;position:relative}
  #hint i:after{content:"";position:absolute;left:50%;top:6px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:wh 1.6s infinite}
  @keyframes wh{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
  #load{position:fixed;inset:0;z-index:10;background:#0e0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .7s}
  #load b{font-size:15px}
  #load .b{width:220px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
  #load .b i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #load span{font-size:12px;opacity:.6}
  @media (max-width:640px){#nav{display:none}#libre{display:none}}
</style>
</head>
<body>
<div id="load"><b>Salle de sport · 100 % femmes</b><div class="b"><i id="lb"></i></div><span>Préparation de la visite…</span></div>
<div id="track">
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="vign"></div>
    <div id="top"><div id="brand">Salle de sport <span>· visite des espaces</span></div><a id="libre" href="libre.html">Visite libre 3D →</a></div>
    <div id="cap" class="out"><div><div class="k" id="k"></div><div class="t" id="t"></div><div class="d" id="d"></div></div></div>
    <nav id="nav"></nav>
    <div id="hint"><i></i>Faites défiler pour entrer</div>
    <div id="bar"></div>
  </div>
</div>
<script>
const N=170, PX_PER_FRAME=48;
const CH=[
  {f:0,  k:'Bienvenue',        t:'L’entrée',              d:'Une façade vitrée, des portes automatiques : on entre simplement.'},
  {f:13, k:'Accès',            t:'Les portiques',              d:'Badge ou QR code : les portiques s’ouvrent et donnent directement sur la salle.'},
  {f:25, k:'L’équipe',    t:'Le bureau du personnel',     d:'Juste après les portiques, vitré, avec un comptoir d’accueil tourné vers l’entrée.'},
  {f:38, k:'Le cœur',          t:'La salle',                   d:'Un grand plateau libre de 24 × 30 m. Le matériel arrive à l’étape suivante.'},
  {f:58, k:'Les enfants',      t:'La garderie vitrée',         d:'Au fond de la salle : les parents gardent toujours un œil sur leurs enfants.'},
  {f:80, k:'Accès réservé',    t:'La porte QR',                d:'Sur le côté gauche, une porte qui ne s’ouvre qu’avec le QR code des adhérentes.'},
  {f:90, k:'Détente',          t:'L’espace bien-être',    d:'Sauna, jacuzzi, coin salon : on récupère après la séance.'},
  {f:128,k:'Côté droit',       t:'Les vestiaires',             d:'Casiers sur deux niveaux, bancs, coiffeuse avec miroir.'},
  {f:157,k:'Pour finir',       t:'Les douches',                d:'Cabines individuelles vitrées.'},
];
const track=document.getElementById('track'),cv=document.getElementById('c'),g=cv.getContext('2d');
track.style.height=(N*PX_PER_FRAME+innerHeight)+'px';
const imgs=new Array(N),ok=new Array(N).fill(false);
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;draw(true);}
// chargement : d'abord une image sur 4, puis le reste
const order=[];for(let i=0;i<N;i+=4)order.push(i);for(let i=2;i<N;i+=4)order.push(i);for(let i=1;i<N;i+=2)order.push(i);
let loaded=0,started=false;
function load(i){return new Promise(r=>{const im=new Image();im.decoding='async';im.onload=()=>{imgs[i]=im;ok[i]=true;loaded++;document.getElementById('lb').style.width=Math.min(100,loaded/(N/4)*100)+'%';r();};im.onerror=()=>{loaded++;r();};im.src='frames/f'+String(i).padStart(3,'0')+'.webp';});}
(async()=>{let q=order.slice();const first=q.splice(0,Math.ceil(N/4));
  await Promise.all(first.map(load));start();
  const W=6;async function worker(){while(q.length){await load(q.shift());}}await Promise.all(Array.from({length:W},worker));})();
function start(){if(started)return;started=true;const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),800);size();}
function nearest(f){const i=Math.round(f);if(ok[i])return i;for(let d=1;d<N;d++){if(ok[i-d])return i-d;if(ok[i+d])return i+d;}return -1;}
function cover(im,a){const s=Math.max(cv.width/im.width,cv.height/im.height),w=im.width*s,h=im.height*s;g.globalAlpha=a;g.drawImage(im,(cv.width-w)/2,(cv.height-h)/2,w,h);}
let cur=0,target=0,last=-1;
function draw(force){
  const f=Math.max(0,Math.min(N-1,cur)),a=Math.floor(f),b=Math.min(N-1,a+1),t=f-a;
  const key=f.toFixed(3);if(!force&&key===last)return;last=key;
  if(ok[a]&&ok[b]){cover(imgs[a],1);if(t>.01)cover(imgs[b],t);}
  else{const n=nearest(f);if(n>=0)cover(imgs[n],1);}
  g.globalAlpha=1;
}
function scrollFrame(){const max=track.offsetHeight-innerHeight;return Math.max(0,Math.min(1,scrollY/max))*(N-1);}
addEventListener('scroll',()=>{target=scrollFrame();document.getElementById('hint').style.opacity=scrollY>20?0:.85;},{passive:true});
addEventListener('resize',()=>{track.style.height=(N*PX_PER_FRAME+innerHeight)+'px';size();});
// chapitres
const nav=document.getElementById('nav');
CH.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${c.t}</span><i></i>`;b.onclick=()=>{const max=track.offsetHeight-innerHeight;scrollTo({top:c.f/(N-1)*max+2,behavior:'smooth'});};nav.appendChild(b);});
let chap=-1;const capEl=document.getElementById('cap');
function setChap(f){let i=0;for(let j=0;j<CH.length;j++)if(f>=CH[j].f-1)i=j;if(i===chap)return;chap=i;
  [...nav.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  capEl.classList.add('out');clearTimeout(setChap.t);setChap.t=setTimeout(()=>{k.textContent=CH[i].k;t.textContent=CH[i].t;d.textContent=CH[i].d;capEl.classList.remove('out');},280);}
const k=document.getElementById('k'),t=document.getElementById('t'),d=document.getElementById('d'),bar=document.getElementById('bar');
// boucle : lissage (inertie) entre le défilement et l'image affichée
let prev=performance.now();
function loop(now){const dt=Math.min((now-prev)/1000,.05);prev=now;
  cur+= (target-cur)*(1-Math.exp(-dt*7));if(Math.abs(target-cur)<.002)cur=target;
  if(started){draw();setChap(cur);bar.style.width=(cur/(N-1)*100)+'%';}
  requestAnimationFrame(loop);}
target=scrollFrame();cur=target;requestAnimationFrame(loop);
</script>
</body>
</html>
