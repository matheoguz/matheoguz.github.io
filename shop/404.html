<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=/shop/">
<title>Page introuvable - HomeVibe</title>
<style>
:root{--bg:#FFFFFF;--text:#111827;--text2:#4B5563;--accent:#E85D04;--accent-hover:#D35400}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.wrap{max-width:420px}
h1{font-size:5rem;font-weight:800;color:var(--accent);line-height:1}
h2{font-size:1.3rem;font-weight:700;margin:16px 0 8px;color:var(--text)}
p{color:var(--text2);font-size:0.95rem;margin-bottom:24px}
a{display:inline-block;background:var(--accent);color:#fff;font-weight:600;padding:12px 28px;border-radius:12px;text-decoration:none;transition:background 0.3s,transform 0.3s}
a:hover{background:var(--accent-hover);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="wrap">
 <h1>404</h1>
 <h2>Page introuvable</h2>
 <p>Cette page n'existe pas. Vous serez redirige vers la boutique dans quelques secondes.</p>
 <a href="/shop/">Retour a la Boutique</a>
</div>
</body>
</html>
