<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Salle de sport — visite 3D</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d1b1a;--paper:#f6f2ee;--accent:#c8746a;--ok:#3f9d6b;--glass:rgba(22,20,19,.62)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#c{display:block;width:100vw;height:100vh;cursor:grab}
  canvas#c:active{cursor:grabbing}
  .hud{position:fixed;z-index:5}
  #title{top:16px;left:16px;background:var(--glass);backdrop-filter:blur(10px);padding:10px 14px;border-radius:12px;max-width:calc(100vw - 220px)}
  #title b{display:block;font-size:14px;letter-spacing:.02em}
  #title span{font-size:12px;opacity:.75}
  #zone{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;background:var(--accent);padding:3px 9px;border-radius:99px}
  #map{top:16px;right:16px;width:180px;height:200px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);cursor:pointer}
  #zones{top:226px;right:16px;display:flex;flex-direction:column;gap:6px;width:180px}
  #zones button{all:unset;cursor:pointer;font-size:12px;font-weight:500;background:var(--glass);backdrop-filter:blur(10px);padding:7px 10px;border-radius:9px;display:flex;align-items:center;gap:8px}
  #zones button i{width:9px;height:9px;border-radius:3px;display:inline-block}
  #zones button:hover{background:rgba(40,36,34,.85)}
  #help{bottom:16px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(10px);padding:9px 14px;border-radius:99px;font-size:12px;white-space:nowrap}
  #action{bottom:70px;left:50%;transform:translateX(-50%);display:none}
  #action button{all:unset;cursor:pointer;background:#fff;color:var(--ink);font-weight:600;font-size:14px;padding:12px 20px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center}
  #toast{top:90px;left:50%;transform:translateX(-50%);background:var(--ok);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s}
  /* intro */
  #caption{left:0;right:0;bottom:22%;text-align:center;pointer-events:none}
  #caption .k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
  #caption .t{font-size:clamp(28px,5vw,54px);font-weight:700;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
  #caption>div{transition:opacity .5s,transform .5s}
  #caption.hide>div{opacity:0;transform:translateY(12px)}
  #skip{all:unset;bottom:24px;right:16px;position:fixed;z-index:6;cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);padding:9px 14px;border-radius:99px;font-size:12px}
  #bars:before,#bars:after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:4;transition:transform .8s}
  #bars:before{top:0}#bars:after{bottom:0}
  #bars.off:before{transform:translateY(-100%)}#bars.off:after{transform:translateY(100%)}
  #fade{inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .7s;z-index:7}
  .walk-only{display:none}
  body:not(.walk) #zones{display:none}
  body.walk #skip{display:none}
  body.walk .walk-only{display:block}
  body.walk #zones.walk-only{display:flex}
  body.walk .intro-only{display:none}
  /* joystick */
  #joy{left:28px;bottom:70px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:none}
  #joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
  body.touch.walk #joy{display:block}
  /* QR modal */
  #qr{inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:8}
  #qr.on{display:flex}
  #qr .card{background:var(--paper);color:var(--ink);border-radius:20px;padding:24px;width:280px;text-align:center}
  #qr .wrap{position:relative;width:200px;height:200px;margin:14px auto;border-radius:12px;overflow:hidden;background:#fff}
  #qr .scan{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:scan 1.1s ease-in-out infinite alternate}
  @keyframes scan{from{top:4%}to{top:94%}}
  #qr .st{font-weight:600;font-size:15px}
  #qr .ok{color:var(--ok)}
  @media (max-width:640px){
    #map{width:120px;height:134px}
    #zones{display:none!important}
    #title{max-width:calc(100vw - 160px)}
    #help{font-size:11px;white-space:normal;width:calc(100vw - 32px);text-align:center;border-radius:14px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bars"></div>

<div class="hud walk-only" id="title"><b>Salle de sport · Femmes</b><span>Aperçu des espaces — le matériel arrive à l'étape suivante</span><br><span id="zone">Dehors</span></div>
<canvas class="hud walk-only" id="map" width="360" height="400"></canvas>
<div class="hud walk-only" id="zones"></div>
<div class="hud walk-only" id="help">Glisser pour regarder · ZQSD / WASD / flèches pour marcher · Maj pour courir</div>
<div class="hud" id="action"><button id="actBtn">▣ Scanner mon QR code</button></div>
<div class="hud" id="toast"></div>
<div class="hud" id="joy"><i></i></div>

<div class="hud intro-only hide" id="caption"><div><div class="k" id="capK"></div><div class="t" id="capT"></div></div></div>
<button class="intro-only" id="skip">Passer l'intro →</button>
<div class="hud" id="fade"></div>

<div class="hud" id="qr"><div class="card">
  <div class="st" id="qrSt">Présentez votre QR code</div>
  <div class="wrap"><canvas id="qrC" width="200" height="200"></canvas><div class="scan" id="qrScan"></div></div>
  <div style="font-size:12px;opacity:.6">Espace bien-être · réservé aux adhérentes</div>
</div></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------- Scène ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
scene.fog = new THREE.Fog(0xdfe6ec, 40, 120);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 300);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8178, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e4, 1.2); sun.position.set(20, 30, 25); scene.add(sun);
function lamp(x,y,z,color=0xfff1e0,i=18,d=16){const l=new THREE.PointLight(color,i,d,1.6);l.position.set(x,y,z);scene.add(l);}

/* ---------- Matières ---------- */
const M = (c,o={}) => new THREE.MeshStandardMaterial({color:c, roughness:.85, ...o});
function tex(draw, w=256, h=256, rx=1, ry=1){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t;
}
const rubber = tex((g,w,h)=>{g.fillStyle='#3b3a3e';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.05})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;g.strokeRect(0,0,w,h);},256,256,24,30);
const wood = tex((g,w,h)=>{for(let y=0;y<h;y+=32){const v=150+Math.random()*30;g.fillStyle=`rgb(${v+30},${v-10},${v-55})`;g.fillRect(0,y,w,32);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(0,y,w,1.5);const o=Math.random()*w;g.fillRect(o,y,1.5,32);}},256,256,6,8);
const tile = tex((g,w,h)=>{g.fillStyle='#e6eaeb';g.fillRect(0,0,w,h);g.strokeStyle='#c9d0d2';g.lineWidth=4;for(let i=0;i<=w;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}},256,256,5,10);
const stone = tex((g,w,h)=>{g.fillStyle='#d8d1c8';g.fillRect(0,0,w,h);g.strokeStyle='rgba(0,0,0,.08)';g.lineWidth=2;for(let i=0;i<=w;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}},256,256,6,3);

const mWall = M(0xefe9e3), mWallDark = M(0x2d2b2e), mAccent = M(0xc8746a), mWood = M(0xb88a5e,{map:null}), mDark = M(0x232226,{roughness:.5});
const mGlass = new THREE.MeshPhysicalMaterial({color:0xcfe3ea, transparent:true, opacity:.22, roughness:.05, metalness:0, side:THREE.DoubleSide, depthWrite:false});
const mFrame = M(0x3a3a3d,{metalness:.4,roughness:.4});
const mLight = new THREE.MeshBasicMaterial({color:0xfff7ec});
const mGreen = new THREE.MeshBasicMaterial({color:0x3fd38a}), mRed = new THREE.MeshBasicMaterial({color:0xe2574c});

/* ---------- Construction ---------- */
const colliders = [];
const add = m => (scene.add(m), m);
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return add(m);}
function solid(x1,z1,x2,z2){const c={x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),on:true};colliders.push(c);return c;}
function wall(x1,z1,x2,z2,h,mat=mWall,y0=0,collide=true){
  const t=.2, cx=(x1+x2)/2, cz=(z1+z2)/2; let w,d;
  if(z1===z2){w=Math.abs(x2-x1)+t;d=t}else{w=t;d=Math.abs(z2-z1)+t}
  const m=box(w,h,d,mat,cx,y0+h/2,cz);
  if(collide&&y0<1.8) solid(cx-w/2,cz-d/2,cx+w/2,cz+d/2);
  return m;
}
function floor(x1,z1,x2,z2,mat,y=.01){const m=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat);m.rotation.x=-Math.PI/2;m.position.set((x1+x2)/2,y,(z1+z2)/2);return add(m);}
function ceiling(x1,z1,x2,z2,y,mat){const m=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat);m.rotation.x=Math.PI/2;m.position.set((x1+x2)/2,y,(z1+z2)/2);return add(m);}
function sign(text, sub, w, h, opts={}){
  const s=128, cv=document.createElement('canvas');cv.width=w*s;cv.height=h*s;const g=cv.getContext('2d');
  g.fillStyle=opts.bg||'#1f1d1e';g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle=opts.fg||'#fff';g.textAlign='center';g.textBaseline='middle';
  g.font=`700 ${h*s*(sub?.38:.5)}px Inter, sans-serif`;g.fillText(text,cv.width/2,cv.height*(sub?.4:.52));
  if(sub){g.globalAlpha=.75;g.font=`500 ${h*s*.2}px Inter, sans-serif`;g.fillText(sub,cv.width/2,cv.height*.76);}
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  const mat=opts.bg==='transparent'?new THREE.MeshBasicMaterial({map:t,transparent:true}):new THREE.MeshBasicMaterial({map:t});
  if(opts.bg==='transparent'){g.clearRect(0,0,0,0);}
  return add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat));
}
function textOnly(text,w,h,color='#c8746a',weight=700){
  const s=128,cv=document.createElement('canvas');cv.width=w*s;cv.height=h*s;const g=cv.getContext('2d');
  g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.font=`${weight} ${h*s*.62}px Inter, sans-serif`;g.fillText(text,cv.width/2,cv.height/2);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
  return add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true})));
}
function lightStrip(x1,z1,x2,z2,y){const w=Math.abs(x2-x1)||.12,d=Math.abs(z2-z1)||.12;box(w,.04,d,mLight,(x1+x2)/2,y-.03,(z1+z2)/2);}

/* Dimensions (en mètres) */
const H_HALL=5, H_LOB=3.6, H_ROOM=3.3;

/* Dehors */
floor(-60,-60,60,60,M(0x9aa58f),0);
floor(-9,21,9,30,new THREE.MeshStandardMaterial({map:stone,roughness:.9}),.005);
solid(-9,26.4,9,26.6); solid(-8.6,21,-8.4,26.6); solid(8.4,21,8.6,26.6);

/* ACCUEIL (lobby) x -6..6, z 15..21 */
floor(-6,15,6,21,new THREE.MeshStandardMaterial({map:stone,roughness:.6}));
ceiling(-6,15,6,21,H_LOB,M(0xf4efea));
wall(-6,15,-6,21,H_LOB); wall(6,15,6,21,H_LOB);
// façade : murs pleins + vitrages + portes coulissantes
wall(-6,21,-4,21,H_LOB,M(0x2f2d30)); wall(4,21,6,21,H_LOB,M(0x2f2d30));
box(2.8,H_LOB,.06,mGlass,-2.6,H_LOB/2,21); solid(-4,20.95,-1.2,21.05);
box(2.8,H_LOB,.06,mGlass,2.6,H_LOB/2,21); solid(1.2,20.95,4,21.05);
box(2.4,.9,.25,M(0x2f2d30),0,H_LOB-.45,21);
const doorL=box(1.2,2.7,.05,mGlass,-.6,1.35,21.05), doorR=box(1.2,2.7,.05,mGlass,.6,1.35,21.05);
[-1.2,1.2,-4,4].forEach(x=>box(.08,H_LOB,.1,mFrame,x,H_LOB/2,21));
const entryCol = solid(-1.2,20.95,1.2,21.1);
// enseigne extérieure
const ens = sign('SALLE DE SPORT','100 % FEMMES',5,1.1,{bg:'#2f2d30'}); ens.position.set(0,4.35,21.2);
box(14,1.4,.3,M(0x2f2d30),0,4.3,21.05);
// banque d'accueil
box(3.2,1.05,.8,M(0xf7f3ef),-3.6,.53,17.4); box(3.3,.06,.9,mAccent,-3.6,1.08,17.4); solid(-5.2,17,-2,17.8);
const acc = sign('ACCUEIL',null,1.6,.42,{bg:'#c8746a'}); acc.position.set(-3.6,.6,17.82);
// plantes
function plant(x,z,s=1){box(.5*s,.5*s,.5*s,M(0xe8e1d8),x,.25*s,z);const f=new THREE.Mesh(new THREE.SphereGeometry(.55*s,16,12),M(0x5f7d55));f.position.set(x,.95*s,z);f.scale.y=1.3;add(f);solid(x-.3*s,z-.3*s,x+.3*s,z+.3*s);}
plant(5.2,20.2); plant(-5.2,20.2);
// banc d'attente
box(2.2,.45,.5,mWood,4.6,.23,17.2); solid(3.5,16.95,5.7,17.45);
lamp(0,3.3,18,0xfff1e0,14,14); lightStrip(-3,18,3,18,H_LOB);

/* PORTIQUES dans le mur z=15 */
wall(-12,15,-2.5,15,H_HALL,mWall); wall(2.5,15,12,15,H_HALL,mWall);
box(5,H_HALL-3,.2,mWall,0,3+(H_HALL-3)/2,15);
const s1 = sign('ACCÈS SALLE','Badge ou QR code',2.6,.62,{bg:'#2f2d30'}); s1.position.set(0,3.3,15.12);
const gates=[];
[-2.25,-.75,.75,2.25].forEach(x=>{box(.4,1.05,1.3,mDark,x,.525,15);solid(x-.2,14.35,x+.2,15.65);});
[[-2.05,-.95],[-.55,.55],[.95,2.05]].forEach(([a,b])=>{
  const mid=(a+b)/2, half=(b-a)/2;
  const wl=box(half,.75,.03,mGlass,a+half/2,.75,15), wr=box(half,.75,.03,mGlass,b-half/2,.75,15);
  const ledL=box(.06,.03,1.1,mRed,a-.2+.1,1.06,15), ledR=box(.06,.03,1.1,mRed,b+.2-.1,1.06,15);
  gates.push({a,b,half,wl,wr,leds:[ledL,ledR],open:0,col:solid(a,14.95,b,15.05),cx:mid});
});

/* SALLE x -12..12, z -15..15 */
floor(-12,-15,12,15,new THREE.MeshStandardMaterial({map:rubber,roughness:.95}));
ceiling(-12,-15,12,15,H_HALL,M(0x2a292d));
for(let x=-8;x<=8;x+=4) lightStrip(x,-13,x,13,H_HALL);
for(const x of [-6,6]) for(const z of [-9,0,9]) lamp(x,4.4,z,0xfff4ea,26,18);
// bande d'accent et marquage au sol
box(24,.12,.02,mAccent,0,1.2,14.88);
const mLine=new THREE.MeshBasicMaterial({color:0x6b6870});
box(.08,.003,26,mLine,0,.02,0); box(22,.003,.08,mLine,0,.02,0);
const floorTxt=textOnly('ZONE MATÉRIEL — À VENIR',8,1,'rgba(255,255,255,.22)',600); floorTxt.rotation.x=-Math.PI/2; floorTxt.position.set(0,.025,5);
// mur gauche x=-12, porte QR à z -6.8..-5.2
wall(-12,-15,-12,-6.8,H_HALL); wall(-12,-5.2,-12,15,H_HALL); box(.2,H_HALL-2.4,1.6,mWall,-12,2.4+(H_HALL-2.4)/2,-6);
box(.24,.12,1.8,mAccent,-12,2.46,-6); box(.24,2.4,.1,mAccent,-12,1.2,-6.85); box(.24,2.4,.1,mAccent,-12,1.2,-5.15);
const qrDoor=box(.08,2.38,1.58,M(0xb88a5e,{map:wood}),-12,1.19,-6);
const qrCol=solid(-12.1,-6.8,-11.9,-5.2);
const reader=box(.06,.32,.22,mDark,-11.86,1.3,-7.25); const readerScreen=box(.01,.16,.14,mRed,-11.82,1.34,-7.25);
const sQR=sign('ESPACE BIEN-ÊTRE','Accès par QR code',2.4,.6,{bg:'#2f2d30'}); sQR.rotation.y=Math.PI/2; sQR.position.set(-11.88,3.05,-6);
const quote=textOnly('Ici, on se sent bien.',9,1.1,'#c8746a',700); quote.rotation.y=Math.PI/2; quote.position.set(-11.88,3.4,6);
// mur droit x=12, ouverture vestiaires z 2..4
wall(12,-15,12,2,H_HALL); wall(12,4,12,15,H_HALL); box(.2,H_HALL-2.5,2,mWall,12,2.5+(H_HALL-2.5)/2,3);
const sVest=sign('VESTIAIRES · DOUCHES',null,2.6,.42,{bg:'#2f2d30'}); sVest.rotation.y=-Math.PI/2; sVest.position.set(11.88,2.85,3);
// mur du fond z=-15 : vitrage garderie x -7..7, porte x 4.6..6
wall(-12,-15,-7,-15,H_HALL); wall(7,-15,12,-15,H_HALL);
box(14,H_HALL-3.2,.2,mWall,0,3.2+(H_HALL-3.2)/2,-15);
box(11.6,3.2,.05,mGlass,-1.2,1.6,-15); solid(-7,-15.05,4.6,-14.95);
box(1,3.2,.05,mGlass,6.5,1.6,-15); solid(6,-15.05,7,-14.95);
box(1.4,1.0,.05,mGlass,5.3,.5,-15);  // petit portillon (barrière enfant), on passe au-dessus? non : collision
const kidGate=solid(4.6,-15.05,6,-14.95);
for(let x=-7;x<=7;x+=2.32) box(.06,3.2,.08,mFrame,x,1.6,-15);
box(14,.08,.1,mFrame,0,3.2,-15); box(1.4,.06,.08,mAccent,5.3,1.0,-15);
const sGar=sign('GARDERIE','Vos enfants restent sous vos yeux',3.2,.7,{bg:'#c8746a'}); sGar.position.set(0,3.9,-14.88);
// banc parents face à la vitre
box(3,.45,.55,mWood,-1,.23,-12.6); box(3,.5,.08,mWood,-1,.7,-12.36); solid(-2.5,-12.9,.5,-12.3);
box(3,.45,.55,mWood,-1,.23,-12.6);

/* GARDERIE x -7..7, z -24..-15 */
floor(-7,-24,7,-15,M(0xf3dccf));
ceiling(-7,-24,7,-15,H_ROOM,M(0xfaf6f2));
wall(-7,-24,-7,-15,H_ROOM,M(0xf6efe7)); wall(7,-24,7,-15,H_ROOM,M(0xf6efe7)); wall(-7,-24,7,-24,H_ROOM,M(0xf6efe7));
lamp(0,3,-19.5,0xfff3e6,22,14); lightStrip(-4,-19.5,4,-19.5,H_ROOM);
const kidCols=[0xe9a07a,0x86b6a4,0xf0cf6b,0x9bb0d8,0xd98fa6];
for(let i=0;i<5;i++) floor(-6+i*2.4,-23,-4.2+i*2.4,-20.5,M(kidCols[i]),.02);
for(let i=0;i<6;i++){const c=box(.55,.55,.55,M(kidCols[i%5]),-5.5+i*.7,.28,-17.4+(i%2)*.2);c.rotation.y=i*.4;}
solid(-5.9,-17.8,-1.6,-16.9);
box(1.6,.5,.9,M(0xffffff),4,.25,-21.5); solid(3.2,-21.95,4.8,-21.05);
for(const [dx,dz] of [[-1.1,0],[1.1,0],[0,-.8],[0,.8]]){const s=box(.35,.3,.35,M(kidCols[(dx+dz+3|0)%5]),4+dx,.15,-21.5+dz);}
for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.45,18,14),M(kidCols[i+1]));b.scale.y=.6;b.position.set(-5.5+i*1.1,.28,-22.8);add(b);}
box(5,.06,.3,M(0xffffff),2.5,1.6,-23.8); box(5,.06,.3,M(0xffffff),2.5,2.2,-23.8);
const wallArt=textOnly('☀ Petits champions ☀',6,.8,'#e9a07a',700); wallArt.position.set(-1,2.6,-23.88);

/* BIEN-ÊTRE x -22..-12, z -13..1 */
floor(-22,-13,-12,1,new THREE.MeshStandardMaterial({map:wood,roughness:.7}));
ceiling(-22,-13,-12,1,H_ROOM,M(0xf1e8de));
const mWarm=M(0xe7d8c8);
wall(-22,-13,-22,1,H_ROOM,mWarm); wall(-22,1,-12,1,H_ROOM,mWarm); wall(-22,-13,-12,-13,H_ROOM,mWarm);

// sauna

const pool=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,.6,40),M(0xe9e1d6));pool.position.set(-15.5,.3,-10.3);add(pool);
const water=new THREE.Mesh(new THREE.CircleGeometry(1.25,40),new THREE.MeshStandardMaterial({color:0x7fc4cf,roughness:.1,metalness:.1,emissive:0x0d3a44,emissiveIntensity:.4}));water.rotation.x=-Math.PI/2;water.position.set(-15.5,.58,-10.3);add(water);
solid(-16.9,-11.7,-14.1,-8.9);
plant(-12.7,.3,.9); plant(-21.4,.3,.9); plant(-12.7,-12.4,.8);
const sBE=sign('ESPACE BIEN-ÊTRE','Sauna · Jacuzzi · Détente',3,.66,{bg:'#3a2a1e'}); sBE.rotation.y=Math.PI/2; sBE.position.set(-21.88,2.4,-4);

/* VESTIAIRES x 12..21, z -2..8 ; DOUCHES z -10..-2 */
floor(12,-10,21,8,new THREE.MeshStandardMaterial({map:tile,roughness:.5}));
ceiling(12,-10,21,8,H_ROOM,M(0xf7f7f5));
const mTile=M(0xf2f3f1);
wall(21,-10,21,8,H_ROOM,mTile); wall(12,8,21,8,H_ROOM,mTile); wall(12,-10,21,-10,H_ROOM,mTile);
wall(15.2,-2,21,-2,H_ROOM,mTile);
lamp(16.5,2.9,3,0xffffff,18,12); lamp(16.5,2.9,-6,0xffffff,14,12);
lightStrip(16.5,-9,16.5,7,H_ROOM);
// casiers
const mLock=M(0xd9a493), mLock2=M(0xc8746a);
for(let i=0;i<9;i++){const z=-1.4+i*1.0;box(.55,2.1,.96,i%2?mLock:mLock2,20.6,1.05,z);}
solid(20.3,-1.9,21,7.1);
for(let i=0;i<5;i++){box(.96,2.1,.55,i%2?mLock:mLock2,13.6+i*1.0,1.05,7.6);} solid(13,7.3,18.2,8);
// bancs
box(.5,.45,4,mWood,17.6,.23,2.4); solid(17.3,.4,17.9,4.4);
// miroir + lavabos
box(.04,1,2.6,new THREE.MeshStandardMaterial({color:0xbfd3da,metalness:.9,roughness:.08}),12.14,1.7,-.4);
// douches
for(let i=0;i<4;i++){const z=-9.2+i*1.75; box(2.6,2.1,.05,mGlass,19.6,1.05,z+.85); box(.1,.1,.4,M(0xb8bcbf,{metalness:.8,roughness:.2}),20.85,2.2,z); solid(18.3,z+.82,21,z+.88);}
box(.05,2.1,6.6,mGlass,18.3,1.05,-6);
const sDouche=sign('DOUCHES',null,1.6,.36,{bg:'#2f2d30'}); sDouche.position.set(18.1,2.6,-2.12); sDouche.rotation.y=Math.PI;
const sVest2=sign('VESTIAIRES',null,1.8,.36,{bg:'#2f2d30'}); sVest2.position.set(16.5,2.7,7.88); sVest2.rotation.y=Math.PI;

/* ---------- Zones ---------- */
const ZONES=[
  {id:'dehors',name:'Entrée',x1:-9,z1:21,x2:9,z2:27,c:'#a9b39d',spawn:[0,24.5,0]},
  {id:'accueil',name:'Accueil & portiques',x1:-6,z1:15,x2:6,z2:21,c:'#d8cfc4',spawn:[0,18.8,0]},
  {id:'salle',name:'La salle',x1:-12,z1:-15,x2:12,z2:15,c:'#55535a',spawn:[0,12,0]},
  {id:'garderie',name:'Garderie',x1:-7,z1:-24,x2:7,z2:-15,c:'#e9a07a',spawn:[0,-17,0]},
  {id:'bienetre',name:'Espace bien-être',x1:-22,z1:-13,x2:-12,z2:1,c:'#b88a5e',spawn:[-14,-6,Math.PI/2]},
  {id:'vestiaires',name:'Vestiaires',x1:12,z1:-2,x2:21,z2:8,c:'#d9a493',spawn:[14,3,-Math.PI/2]},
  {id:'douches',name:'Douches',x1:12,z1:-10,x2:21,z2:-2,c:'#9fc3cc',spawn:[14,-4.5,-Math.PI/2]},
];
const zoneAt=(x,z)=>ZONES.find(Z=>x>=Z.x1&&x<=Z.x2&&z>=Z.z1&&z<=Z.z2);

/* ---------- Joueur ---------- */
const R=.3, EYE=1.65;
const P={x:0,z:24.5,yaw:0,pitch:0,bob:0};
function hits(x,z){for(const c of colliders){if(!c.on)continue;const nx=Math.max(c.x1,Math.min(x,c.x2)),nz=Math.max(c.z1,Math.min(z,c.z2));if((x-nx)**2+(z-nz)**2<R*R)return true;}return false;}

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyE'&&actionVisible) startScan();});
addEventListener('keyup',e=>keys[e.code]=false);

const isTouch = matchMedia('(pointer:coarse)').matches;
if(isTouch){document.body.classList.add('touch');document.getElementById('help').textContent='Joystick à gauche pour marcher · glisser à droite pour regarder';}
let look=null, joy=null; const joyEl=document.getElementById('joy'), knob=joyEl.firstElementChild; const jv={x:0,y:0};
canvas.addEventListener('pointerdown',e=>{
  if(mode!=='walk')return;
  canvas.setPointerCapture(e.pointerId);
  if(e.pointerType==='touch'&&e.clientX<innerWidth*.45){
    joy={id:e.pointerId}; const r=joyEl.getBoundingClientRect(); joy.cx=r.left+r.width/2; joy.cy=r.top+r.height/2;
    updJoy(e);
  } else look={id:e.pointerId,x:e.clientX,y:e.clientY};
});
function updJoy(e){let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const L=Math.hypot(dx,dy),m=50;if(L>m){dx*=m/L;dy*=m/L;}jv.x=dx/m;jv.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;}
canvas.addEventListener('pointermove',e=>{
  if(joy&&e.pointerId===joy.id) return updJoy(e);
  if(look&&e.pointerId===look.id){const k=e.pointerType==='touch'?.006:.004;P.yaw-=(e.clientX-look.x)*k;P.pitch+=(e.clientY-look.y)*k;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch));look.x=e.clientX;look.y=e.clientY;}
});
const endP=e=>{if(joy&&e.pointerId===joy.id){joy=null;jv.x=jv.y=0;knob.style.transform='';} if(look&&e.pointerId===look.id)look=null;};
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

/* ---------- QR ---------- */
let qrOpen=0, qrTimer=0, actionVisible=false, scanning=false;
const qrEl=document.getElementById('qr'), qrSt=document.getElementById('qrSt'), qrScan=document.getElementById('qrScan');
function drawQR(){const g=document.getElementById('qrC').getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,200,200);const n=25,s=7,o=12;g.fillStyle='#1d1b1a';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(Math.random()<.48)g.fillRect(o+x*s,o+y*s,s,s);}
  for(const [fx,fy] of [[0,0],[n-7,0],[0,n-7]]){g.fillStyle='#fff';g.fillRect(o+fx*s-2,o+fy*s-2,7*s+4,7*s+4);g.fillStyle='#1d1b1a';g.fillRect(o+fx*s,o+fy*s,7*s,7*s);g.fillStyle='#fff';g.fillRect(o+fx*s+s,o+fy*s+s,5*s,5*s);g.fillStyle='#1d1b1a';g.fillRect(o+fx*s+2*s,o+fy*s+2*s,3*s,3*s);}}
function startScan(){
  if(scanning)return; scanning=true; drawQR(); qrSt.textContent='Lecture du QR code…'; qrSt.className='st'; qrScan.style.display='block'; qrEl.classList.add('on');
  setTimeout(()=>{qrSt.textContent='✓ Accès autorisé'; qrSt.className='st ok'; qrScan.style.display='none'; readerScreen.material=mGreen;},1400);
  setTimeout(()=>{qrEl.classList.remove('on'); qrTimer=7; scanning=false; toast('Porte bien-être ouverte');},2300);
}
document.getElementById('actBtn').onclick=startScan;
let toastT; function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,1800);}

/* ---------- Mini-carte ---------- */
const map=document.getElementById('map'), mg=map.getContext('2d');
const MB={x1:-23,x2:22,z1:-25,z2:28};
function toMap(x,z){const W=map.width,Hh=map.height,p=16,s=Math.min((W-2*p)/(MB.x2-MB.x1),(Hh-2*p)/(MB.z2-MB.z1));return [p+(x-MB.x1)*s+((W-2*p)-(MB.x2-MB.x1)*s)/2, p+(z-MB.z1)*s, s];}
function drawMap(){
  mg.clearRect(0,0,map.width,map.height);
  for(const Z of ZONES){const [a,b,s]=toMap(Z.x1,Z.z1);mg.fillStyle=Z.c;mg.globalAlpha=Z.id==='dehors'?.35:.9;mg.fillRect(a,b,(Z.x2-Z.x1)*s,(Z.z2-Z.z1)*s);}
  mg.globalAlpha=1;
  const [px,pz]=toMap(P.x,P.z);
  mg.save();mg.translate(px,pz);mg.rotate(-P.yaw);mg.fillStyle='rgba(255,255,255,.25)';mg.beginPath();mg.moveTo(0,0);mg.arc(0,0,34,-Math.PI/2-.55,-Math.PI/2+.55);mg.fill();mg.restore();
  mg.fillStyle='#fff';mg.beginPath();mg.arc(px,pz,6,0,7);mg.fill();mg.strokeStyle='#c8746a';mg.lineWidth=3;mg.stroke();
  // porte QR
  const [qx,qz]=toMap(-12,-6);mg.fillStyle=qrOpen>.5?'#3fd38a':'#e2574c';mg.fillRect(qx-4,qz-6,8,12);
}
map.addEventListener('click',e=>{const r=map.getBoundingClientRect();const mx=(e.clientX-r.left)*map.width/r.width,my=(e.clientY-r.top)*map.height/r.height;
  for(const Z of ZONES){const [a,b,s]=toMap(Z.x1,Z.z1);if(mx>=a&&mx<=a+(Z.x2-Z.x1)*s&&my>=b&&my<=b+(Z.z2-Z.z1)*s){tp(Z);return;}}});
const zb=document.getElementById('zones');
ZONES.forEach(Z=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${Z.c}"></i>${Z.name}`;b.onclick=()=>tp(Z);zb.appendChild(b);});
function tp(Z){P.x=Z.spawn[0];P.z=Z.spawn[1];P.yaw=Z.spawn[2];P.pitch=0;}

/* ---------- Intro « motion design » ---------- */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const path=new THREE.CatmullRomCurve3([V(0,4.5,36),V(0,2.3,25),V(0,2.0,18.5),V(0,2.5,11),V(0,3.3,0),V(2,2.6,-9.5),V(-4,2.5,-9),V(-8,2.6,-2),V(4,2.5,3.5),V(9.5,2.0,3)],false,'centripetal');
const aim =new THREE.CatmullRomCurve3([V(0,3,15),V(0,2,15),V(0,1.4,13),V(0,2,-2),V(0,1.8,-15),V(0,1.2,-21),V(-12,1.6,-6),V(-12,1.6,-6),V(12,1.8,3),V(17,1.5,3)],false,'centripetal');
const CAPS=[[0,'Bienvenue','Votre future salle'],[.14,'Étape 1','On passe le portique'],[.3,'Étape 2','La salle'],[.45,'Étape 3','Garderie vitrée'],[.6,'Étape 4','Bien-être · porte QR'],[.8,'Étape 5','Vestiaires & douches']];
let mode='intro', t0=null; const DUR=24;
const capEl=document.getElementById('caption'), capK=document.getElementById('capK'), capT=document.getElementById('capT'); let capIdx=-1;
capEl.classList.add('hide');
const ease=t=>t<.5?2*t*t:1-(-2*t+2)**2/2;
function endIntro(){
  if(mode!=='intro')return; mode='fading';
  const f=document.getElementById('fade'); f.style.opacity=1; capEl.classList.add('hide');
  setTimeout(()=>{mode='walk';document.body.classList.add('walk');document.getElementById('bars').classList.add('off');tp(ZONES[0]);qrTimer=0;f.style.opacity=0;toast('À vous : avancez vers l\'entrée');},750);
}
document.getElementById('skip').onclick=endIntro;
setTimeout(()=>document.getElementById('fade').style.opacity=0,200);

/* ---------- Boucle ---------- */
const clock=new THREE.Clock(); const tmp=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.1), now=clock.elapsedTime;
  if(mode==='intro'){
    if(t0===null)t0=now; const u=Math.min((now-t0)/DUR,1), e=ease(u);
    camera.position.copy(path.getPoint(e)); camera.lookAt(aim.getPoint(e));
    let i=CAPS.length-1;while(i>0&&u<CAPS[i][0])i--;
    if(i!==capIdx){capIdx=i;capEl.classList.add('hide');setTimeout(()=>{capK.textContent=CAPS[i][1];capT.textContent=CAPS[i][2];capEl.classList.remove('hide');},350);}
    if(u>=1) endIntro();
    // pendant l'intro : portiques et porte s'ouvrent pour la caméra
    var px=camera.position.x, pz=camera.position.z;
  } else { var px=P.x, pz=P.z; }

  if(mode==='walk'){
    let f=0,s=0;
    if(keys.KeyW||keys.KeyZ||keys.ArrowUp)f+=1; if(keys.KeyS||keys.ArrowDown)f-=1;
    if(keys.KeyD||keys.ArrowRight)s+=1; if(keys.KeyA||keys.KeyQ||keys.ArrowLeft)s-=1;
    f-=jv.y; s+=jv.x;
    const L=Math.hypot(f,s); if(L>1){f/=L;s/=L;}
    const sp=(keys.ShiftLeft||keys.ShiftRight||Math.hypot(jv.x,jv.y)>.95?4.2:2.4)*dt;
    const sy=Math.sin(P.yaw), cy=Math.cos(P.yaw);
    const dx=(-sy*f+cy*s)*sp, dz=(-cy*f-sy*s)*sp;
    if(!hits(P.x+dx,P.z))P.x+=dx; if(!hits(P.x,P.z+dz))P.z+=dz;
    if(L>.05)P.bob+=dt*(sp/dt)*2.6;
    camera.position.set(P.x,EYE+Math.sin(P.bob)*.03,P.z); camera.rotation.set(-P.pitch,P.yaw,0);
    const Z=zoneAt(P.x,P.z); document.getElementById('zone').textContent=Z?Z.name:'Dehors';
    drawMap();
    // bouton QR
    const near=Math.hypot(P.x+12,P.z+6)<2.6 && P.x>-12 && qrOpen<.1 && qrTimer<=0;
    if(near!==actionVisible){actionVisible=near;document.getElementById('action').style.display=near?'block':'none';}
    // sortie du bien-être : ouverture automatique depuis l'intérieur
    if(P.x<-12&&Math.hypot(P.x+12,P.z+6)<2.2) qrTimer=Math.max(qrTimer,2);
  }
  // Porte d'entrée automatique
  const nearEntry=Math.abs(px)<3&&Math.abs(pz-21)<3.2;
  const eo=THREE.MathUtils.damp(doorL.userData.o||0,nearEntry?1:0,6,dt); doorL.userData.o=eo;
  doorL.position.x=-.6-eo*1.15; doorR.position.x=.6+eo*1.15; entryCol.on=eo<.8;
  // Portiques
  for(const g of gates){
    const want=Math.abs(px-g.cx)<1.2&&Math.abs(pz-15)<2.4 ? 1:0;
    g.open=THREE.MathUtils.damp(g.open,want,7,dt);
    const k=1-g.open*.92; g.wl.scale.x=k; g.wr.scale.x=k;
    g.wl.position.x=g.a+g.half*k/2; g.wr.position.x=g.b-g.half*k/2;
    g.col.on=g.open<.75; const m=g.open>.5?mGreen:mRed; g.leds.forEach(l=>l.material=m);
  }
  // Porte QR
  if(mode==='intro'){const u=t0===null?0:(now-t0)/DUR; qrTimer=(u>.55&&u<.78)?1:0; readerScreen.material=qrTimer?mGreen:mRed;}
  else if(qrTimer>0){ qrTimer-=dt; const inDoor=P.x>-12.6&&P.x<-11.4&&P.z>-7&&P.z<-5; if(inDoor) qrTimer=Math.max(qrTimer,.5); if(qrTimer<=0) readerScreen.material=mRed; }
  qrOpen=THREE.MathUtils.damp(qrOpen,qrTimer>0?1:0,5,dt);
  qrDoor.position.z=-6-qrOpen*1.55; qrCol.on=qrOpen<.85;
  water.material.emissiveIntensity=.35+Math.sin(now*2)*.08;

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__P=P; window.__tp=tp; window.__end=endIntro; window.__ZONES=ZONES;
</script>
