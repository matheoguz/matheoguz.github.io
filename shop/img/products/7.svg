<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="moonGlow7" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFE0B2"/>
      <stop offset="80%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </radialGradient>
    <radialGradient id="moonGlowOuter7" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="80%" stop-color="#FFE0B2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="30%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#795548"/>
      <stop offset="70%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <linearGradient id="woodTop7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <filter id="sh7">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="moonGlowFilter">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="#F3E5F5"/>
  <!-- Ambient glow around moon -->
  <circle cx="200" cy="175" r="120" fill="#FFE0B2" opacity="0.12"/>
  <circle cx="200" cy="175" r="100" fill="#FFF8E1" opacity="0.1"/>
  <!-- Ground shadow -->
  <ellipse cx="200" cy="355" rx="65" ry="10" fill="rgba(0,0,0,0.08)"/>
  <!-- Wooden stand base -->
  <ellipse cx="200" cy="340" rx="50" ry="12" fill="url(#wood7)" filter="url(#sh7)"/>
  <ellipse cx="200" cy="337" rx="48" ry="10" fill="url(#woodTop7)"/>
  <!-- Wood grain texture on base -->
  <ellipse cx="190" cy="337" rx="30" ry="6" fill="none" stroke="#795548" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="210" cy="337" rx="20" ry="4" fill="none" stroke="#795548" stroke-width="0.5" opacity="0.3"/>
  <!-- Stand post -->
  <rect x="193" y="290" width="14" height="50" rx="3" fill="url(#wood7)"/>
  <rect x="193" y="290" width="5" height="50" rx="2" fill="#A1887F" opacity="0.3"/>
  <!-- Moon sphere -->
  <circle cx="200" cy="175" r="90" fill="url(#moonGlow7)" filter="url(#sh7)"/>
  <!-- Moon outer glow -->
  <circle cx="200" cy="175" r="92" fill="url(#moonGlowOuter7)"/>
  <!-- Crater details - large craters -->
  <ellipse cx="170" cy="145" rx="18" ry="16" fill="#F5D89A" opacity="0.35" transform="rotate(-10,170,145)"/>
  <ellipse cx="170" cy="145" rx="14" ry="12" fill="#EED388" opacity="0.2" transform="rotate(-10,170,145)"/>
  <ellipse cx="225" cy="195" rx="22" ry="20" fill="#F5D89A" opacity="0.3"/>
  <ellipse cx="225" cy="195" rx="17" ry="15" fill="#EED388" opacity="0.2"/>
  <ellipse cx="185" cy="220" rx="15" ry="13" fill="#F5D89A" opacity="0.3" transform="rotate(15,185,220)"/>
  <ellipse cx="185" cy="220" rx="11" ry="9" fill="#EED388" opacity="0.2" transform="rotate(15,185,220)"/>
  <!-- Medium craters -->
  <ellipse cx="235" cy="148" rx="10" ry="9" fill="#F5D89A" opacity="0.3"/>
  <ellipse cx="235" cy="148" rx="7" ry="6" fill="#EED388" opacity="0.2"/>
  <ellipse cx="160" cy="190" rx="9" ry="8" fill="#F5D89A" opacity="0.25"/>
  <ellipse cx="160" cy="190" rx="6" ry="5" fill="#EED388" opacity="0.15"/>
  <ellipse cx="210" cy="240" rx="11" ry="9" fill="#F5D89A" opacity="0.25"/>
  <ellipse cx="210" cy="240" rx="7" ry="6" fill="#EED388" opacity="0.15"/>
  <ellipse cx="248" cy="170" rx="8" ry="7" fill="#F5D89A" opacity="0.25"/>
  <!-- Small craters -->
  <circle cx="195" cy="125" r="5" fill="#F5D89A" opacity="0.25"/>
  <circle cx="145" cy="165" r="4" fill="#F5D89A" opacity="0.2"/>
  <circle cx="175" cy="250" r="4" fill="#F5D89A" opacity="0.2"/>
  <circle cx="240" cy="215" r="5" fill="#F5D89A" opacity="0.2"/>
  <circle cx="220" cy="130" r="3.5" fill="#F5D89A" opacity="0.2"/>
  <circle cx="155" cy="210" r="3" fill="#F5D89A" opacity="0.2"/>
  <circle cx="250" cy="190" r="3.5" fill="#F5D89A" opacity="0.2"/>
  <circle cx="200" cy="260" r="4" fill="#F5D89A" opacity="0.2"/>
  <circle cx="168" cy="170" r="2.5" fill="#F5D89A" opacity="0.15"/>
  <circle cx="230" cy="165" r="3" fill="#F5D89A" opacity="0.15"/>
  <!-- Moon surface highlight (left side - light source) -->
  <circle cx="200" cy="175" r="88" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
  <path d="M155,110 A90,90 0 0,0 135,175" fill="none" stroke="white" stroke-width="3" opacity="0.08" stroke-linecap="round"/>
  <!-- Subtle terminator shadow on right edge -->
  <path d="M268,115 A90,90 0 0,1 268,235" fill="rgba(180,150,100,0.08)"/>
  <!-- USB charging port on stand -->
  <rect x="195" y="345" width="10" height="4" rx="1.5" fill="#5D4037"/>
</svg>