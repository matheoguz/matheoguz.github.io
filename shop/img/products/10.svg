<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="steel10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="30%" stop-color="#BDBDBD"/>
      <stop offset="50%" stop-color="#D5D5D5"/>
      <stop offset="70%" stop-color="#AEAEAE"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
    <linearGradient id="blade10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="40%" stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </linearGradient>
    <linearGradient id="handle10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="50%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="wall10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <filter id="knifeShad10">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="barShad10">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="#ECEFF1"/>

  <!-- Wall texture -->
  <rect x="30" y="40" width="340" height="320" rx="4" fill="url(#wall10)"/>
  <line x1="30" y1="100" x2="370" y2="100" stroke="#E0E0E0" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="160" x2="370" y2="160" stroke="#E0E0E0" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="220" x2="370" y2="220" stroke="#E0E0E0" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="280" x2="370" y2="280" stroke="#E0E0E0" stroke-width="0.5" opacity="0.5"/>

  <!-- Magnetic bar -->
  <rect x="50" y="178" width="300" height="24" rx="4" fill="url(#steel10)" filter="url(#barShad10)"/>
  <!-- Brushed steel texture -->
  <line x1="55" y1="185" x2="345" y2="185" stroke="#C8C8C8" stroke-width="0.5" opacity="0.6"/>
  <line x1="55" y1="188" x2="345" y2="188" stroke="#C0C0C0" stroke-width="0.5" opacity="0.4"/>
  <line x1="55" y1="191" x2="345" y2="191" stroke="#C8C8C8" stroke-width="0.5" opacity="0.5"/>
  <line x1="55" y1="194" x2="345" y2="194" stroke="#C0C0C0" stroke-width="0.5" opacity="0.3"/>
  <line x1="55" y1="197" x2="345" y2="197" stroke="#C8C8C8" stroke-width="0.5" opacity="0.5"/>
  <!-- Mounting screws -->
  <circle cx="70" cy="190" r="4" fill="#A0A0A0" stroke="#888" stroke-width="1"/>
  <line x1="67" y1="190" x2="73" y2="190" stroke="#888" stroke-width="1"/>
  <circle cx="330" cy="190" r="4" fill="#A0A0A0" stroke="#888" stroke-width="1"/>
  <line x1="327" y1="190" x2="333" y2="190" stroke="#888" stroke-width="1"/>

  <!-- Knife 1: Chef's knife (large) -->
  <g filter="url(#knifeShad10)">
    <path d="M95 178 L95 105 Q95 95 100 95 L105 95 Q115 100 115 110 L115 145 Q118 160 122 170 L122 178" fill="url(#blade10)"/>
    <line x1="97" y1="110" x2="97" y2="175" stroke="#F0F0F0" stroke-width="0.8" opacity="0.6"/>
    <rect x="92" y="196" width="24" height="65" rx="5" fill="url(#handle10)"/>
    <rect x="90" y="196" width="28" height="10" rx="2" fill="#9E9E9E"/>
    <circle cx="104" cy="220" r="2" fill="#777"/>
    <circle cx="104" cy="240" r="2" fill="#777"/>
    <circle cx="104" cy="255" r="2" fill="#777"/>
  </g>

  <!-- Knife 2: Santoku -->
  <g filter="url(#knifeShad10)">
    <path d="M162 178 L162 120 Q162 110 167 108 L177 108 Q182 110 182 120 L182 178" fill="url(#blade10)"/>
    <line x1="164" y1="125" x2="164" y2="175" stroke="#F0F0F0" stroke-width="0.8" opacity="0.6"/>
    <circle cx="170" cy="130" r="2" fill="#C8C8C8" opacity="0.5"/>
    <circle cx="170" cy="142" r="2" fill="#C8C8C8" opacity="0.5"/>
    <circle cx="170" cy="154" r="2" fill="#C8C8C8" opacity="0.5"/>
    <rect x="159" y="196" width="26" height="10" rx="2" fill="#9E9E9E"/>
    <rect x="161" y="202" width="22" height="58" rx="4" fill="url(#handle10)"/>
    <circle cx="172" cy="218" r="2" fill="#777"/>
    <circle cx="172" cy="235" r="2" fill="#777"/>
    <circle cx="172" cy="250" r="2" fill="#777"/>
  </g>

  <!-- Knife 3: Bread knife (serrated) -->
  <g filter="url(#knifeShad10)">
    <rect x="224" y="98" width="16" height="80" rx="2" fill="url(#blade10)"/>
    <path d="M224 103 Q221 106 224 109 Q221 112 224 115 Q221 118 224 121 Q221 124 224 127 Q221 130 224 133 Q221 136 224 139 Q221 142 224 145 Q221 148 224 151 Q221 154 224 157 Q221 160 224 163 Q221 166 224 169 Q221 172 224 175" fill="none" stroke="#B0B0B0" stroke-width="1.2"/>
    <line x1="238" y1="103" x2="238" y2="175" stroke="#F0F0F0" stroke-width="0.8" opacity="0.6"/>
    <rect x="222" y="196" width="22" height="10" rx="2" fill="#9E9E9E"/>
    <rect x="224" y="202" width="18" height="52" rx="4" fill="#5D4037"/>
    <circle cx="233" cy="218" r="2" fill="#8D6E63"/>
    <circle cx="233" cy="235" r="2" fill="#8D6E63"/>
  </g>

  <!-- Knife 4: Paring knife (small) -->
  <g filter="url(#knifeShad10)">
    <path d="M280 178 L280 142 Q280 132 284 130 L290 130 Q294 132 294 142 L294 178" fill="url(#blade10)"/>
    <line x1="282" y1="148" x2="282" y2="175" stroke="#F0F0F0" stroke-width="0.8" opacity="0.6"/>
    <rect x="278" y="196" width="20" height="10" rx="2" fill="#9E9E9E"/>
    <rect x="280" y="202" width="16" height="45" rx="3" fill="url(#handle10)"/>
    <circle cx="288" cy="215" r="1.5" fill="#777"/>
    <circle cx="288" cy="230" r="1.5" fill="#777"/>
  </g>

  <!-- Knife 5: Cleaver -->
  <g filter="url(#knifeShad10)">
    <rect x="318" y="102" width="28" height="76" rx="3" fill="url(#blade10)"/>
    <line x1="344" y1="107" x2="344" y2="175" stroke="#F0F0F0" stroke-width="0.8" opacity="0.6"/>
    <circle cx="334" cy="118" r="5" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1"/>
    <rect x="323" y="196" width="22" height="10" rx="2" fill="#9E9E9E"/>
    <rect x="325" y="202" width="18" height="50" rx="4" fill="#5D4037"/>
    <circle cx="334" cy="216" r="2" fill="#8D6E63"/>
    <circle cx="334" cy="233" r="2" fill="#8D6E63"/>
  </g>

  <!-- Magnetic glow indicators -->
  <circle cx="104" cy="190" r="2" fill="#90CAF9" opacity="0.4"/>
  <circle cx="172" cy="190" r="2" fill="#90CAF9" opacity="0.4"/>
  <circle cx="233" cy="190" r="2" fill="#90CAF9" opacity="0.4"/>
  <circle cx="288" cy="190" r="2" fill="#90CAF9" opacity="0.4"/>
  <circle cx="334" cy="190" r="2" fill="#90CAF9" opacity="0.4"/>
</svg>