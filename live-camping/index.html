<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Camping du Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --fond: #0d1b2a; --jaune: #ffd166; --vert: #4ade80; --rose: #ff4d6d; --bleu: #4fa3ff; --texte: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--fond); overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  /* format vertical 9:16, centré */
  .cadre { position: absolute; left: 50%; top: 50%; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); transform: translate(-50%, -50%); font-size: min(1vw, 0.5625vh); }
  .titre { position: absolute; top: 4%; left: 0; right: 0; text-align: center; color: var(--texte); font-weight: 900; font-size: 5.6em; letter-spacing: .02em; text-shadow: 0 .08em 0 #0b1020, 0 0 .4em rgba(0,0,0,.5); }
  .titre small { display: block; font-size: .42em; color: var(--jaune); letter-spacing: .2em; }
  .compteurs { position: absolute; top: 12.5%; left: 0; right: 0; display: flex; justify-content: center; gap: 2em; }
  .boite { background: rgba(11,16,32,.85); border: .35em solid var(--c); border-radius: 1.4em; padding: .8em 2em; text-align: center; min-width: 16em; }
  .boite b { display: block; color: #b9c0d0; font-size: 1.9em; letter-spacing: .2em; }
  .boite span { display: block; color: var(--c); font-size: 4em; font-weight: 900; }
  .notifs { position: absolute; top: 21%; left: 4%; right: 4%; display: flex; flex-direction: column; align-items: center; gap: 1.2em; }
  .notif { background: rgba(11,16,32,.9); border: .3em solid var(--c); border-radius: 3em; padding: .9em 2.4em; color: #fff; font-weight: 900; font-size: 3.4em; text-align: center; animation: entree .35s ease-out, sortie .5s ease-in forwards; animation-delay: 0s, var(--duree); box-shadow: 0 .3em 1em rgba(0,0,0,.4); max-width: 26em; }
  .notif em { font-style: normal; color: var(--c); }
  @keyframes entree { from { transform: translateY(-1em) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sortie { to { transform: translateY(-.6em) scale(.9); opacity: 0; } }
  .bas { position: absolute; bottom: 4%; left: 5%; right: 5%; }
  .jauge { background: rgba(11,16,32,.88); border-radius: 2em; padding: 1.2em 1.8em; border: .3em solid var(--rose); }
  .jauge .ligne { display: flex; justify-content: space-between; color: #fff; font-weight: 900; font-size: 2.8em; }
  .jauge .ligne i { font-style: normal; color: var(--rose); }
  .barre { height: 2.2em; margin-top: .8em; border-radius: 1.1em; background: #2a3148; overflow: hidden; }
  .barre div { height: 100%; width: 0; background: linear-gradient(90deg, #ff4d6d, #ffd166); transition: width .4s; }
  .regles { margin-top: 1.6em; display: flex; gap: 1.2em; justify-content: center; }
  .regle { background: rgba(11,16,32,.88); border-radius: 1.4em; padding: .8em 1.4em; color: #fff; font-weight: 800; font-size: 2.3em; text-align: center; flex: 1; border: .25em solid var(--c); }
  .regle b { display: block; color: var(--c); font-size: 1.15em; }
  .etat { position: absolute; top: 1.5%; right: 3%; font-size: 1.8em; color: #9fb3cf; font-weight: 800; }
  .etat.ok { color: var(--vert); }
  #test { position: fixed; left: 10px; bottom: 10px; display: none; gap: 6px; flex-wrap: wrap; pointer-events: auto; z-index: 5; max-width: 420px; }
  #test button { font: 800 13px Inter, sans-serif; padding: 8px 10px; border-radius: 8px; border: 0; cursor: pointer; }
</style>
<script>
  const local = location.search.includes("local");
  const base = local ? "/_three/" : "https://cdn.jsdelivr.net/npm/three@0.170.0/";
  const im = document.createElement("script"); im.type = "importmap";
  im.textContent = JSON.stringify({ imports: { "three": base + "build/three.module.js" } });
  document.currentScript.after(im);
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui"><div class="cadre">
  <div class="etat" id="etat">hors ligne</div>
  <div class="titre"><small>EN DIRECT</small>LE CAMPING DU LIVE</div>
  <div class="compteurs">
    <div class="boite" style="--c: var(--vert)"><b>CAMPEURS</b><span id="nCampeurs">0</span></div>
    <div class="boite" style="--c: var(--jaune)"><b>PLACES</b><span id="nPlaces">0</span></div>
  </div>
  <div class="notifs" id="notifs"></div>
  <div class="bas">
    <div class="jauge"><div class="ligne"><span>❤ <span id="nLikes">0</span> / <span id="objLikes">1 000</span></span><i id="prochain">FEU DE CAMP</i></div><div class="barre"><div id="barre"></div></div></div>
    <div class="regles">
      <div class="regle" style="--c: var(--vert)"><b>ABONNE-TOI</b>tu entres au camping</div>
      <div class="regle" style="--c: var(--jaune)"><b>CADEAU</b>ta place à ton nom</div>
    </div>
  </div>
</div></div>
<div id="test">
  <button onclick="window.simuler('follow')">+ abonné</button>
  <button onclick="window.simuler('gift', 1)">cadeau 1 💎</button>
  <button onclick="window.simuler('gift', 30)">cadeau 30 💎</button>
  <button onclick="window.simuler('gift', 200)">cadeau 200 💎</button>
  <button onclick="window.simuler('like', 150)">+150 likes</button>
  <button onclick="if(confirm('Effacer toutes les places ?')){localStorage.removeItem('campingLive');location.reload()}">tout effacer</button>
</div>
<script type="module">
import * as THREE from "three";

/* ================= Réglages (modifiables dans l'adresse) =================
   ?ws=ws://localhost:21213/   adresse de TikFinity (par défaut)
   ?test                       affiche les boutons de test
   ?tente=1&caravane=30&chalet=200   diamants nécessaires pour chaque place
   ?likes=1000                 likes pour le premier palier                  */
const Q = new URLSearchParams(location.search);
const SEUILS = { tente: +(Q.get("tente") || 1), caravane: +(Q.get("caravane") || 30), chalet: +(Q.get("chalet") || 200) };
const PALIER = +(Q.get("likes") || 1000);
const PALIERS = ["FEU DE CAMP", "LAMPIONS", "FEU D'ARTIFICE"];

/* ================= Rendu 3D ================= */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#1b2f4a");
scene.fog = new THREE.Fog("#1b2f4a", 95, 170);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
const CENTRE = new THREE.Vector3(0, 0, 2);
camera.position.set(34, 38, 40); camera.lookAt(CENTRE);
function cadrer() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const l = Math.max(42, 52 * w / h);
  const hh = l * h / w;
  camera.left = -l / 2; camera.right = l / 2; camera.top = hh / 2; camera.bottom = -hh / 2; camera.updateProjectionMatrix();
}
addEventListener("resize", cadrer); cadrer();

const hemi = new THREE.HemisphereLight("#b9d0ff", "#2c4a2a", 1.6); scene.add(hemi);
const lune = new THREE.DirectionalLight("#cfe0ff", 1.4); lune.position.set(-20, 40, 20); lune.castShadow = true;
lune.shadow.mapSize.set(2048, 2048); Object.assign(lune.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 }); scene.add(lune);

const mat = (c, e = 0) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9, emissive: e ? c : 0, emissiveIntensity: e });
const boite = (w, h, d, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.castShadow = m.receiveShadow = true; return m; };
const place = (o, x, y, z) => { o.position.set(x, y, z); return o; };
let graine = 7; const alea = () => (graine = (graine * 16807) % 2147483647) / 2147483647;

// sol
const sol = new THREE.Mesh(new THREE.BoxGeometry(44, 1, 44), mat("#3f7a3a")); sol.position.y = -0.5; sol.receiveShadow = true; scene.add(sol);
for (let i = 0; i < 260; i++) { const t = place(new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.35, 3), mat(alea() > .5 ? "#4f8f45" : "#367034")), -21 + alea() * 42, 0.15, -21 + alea() * 42); scene.add(t); }
// allées
const allee = mat("#b59a6a");
scene.add(place(boite(3, 0.06, 36, "#b59a6a"), 0, 0.03, 2)); scene.add(place(boite(32, 0.06, 3, "#b59a6a"), 0, 0.03, 0));
// clôture et portail (en bas, côté caméra)
for (let x = -20; x <= 20; x += 2) { if (Math.abs(x) < 3) continue; scene.add(place(boite(0.2, 1.1, 0.2, "#7a5a3a"), x, 0.55, 20)); }
scene.add(place(boite(40, 0.15, 0.12, "#8a6a42"), 0, 0.9, 20));
for (const s of [-1, 1]) scene.add(place(boite(0.6, 3.2, 0.6, "#6b4a2f"), s * 2.6, 1.6, 20));
const arche = place(boite(6, 0.9, 0.3, "#8a6a42"), 0, 3.4, 20); scene.add(arche);
// arbres autour
function arbre(x, z, h = 1) { const g = new THREE.Group(); g.add(place(boite(0.4, 1.2, 0.4, "#5a3a22"), 0, 0.6, 0));
  for (let i = 0; i < 3; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(1.4 - i * 0.35, 1.6, 6), mat(i % 2 ? "#1f5a38" : "#276b42")); c.castShadow = true; c.position.y = 1.6 + i * 0.85; g.add(c); }
  g.position.set(x, 0, z); g.scale.setScalar(h); scene.add(g); }
for (let i = 0; i < 40; i++) { const a = alea() * Math.PI * 2, r = 19 + alea() * 4; const x = Math.cos(a) * r, z = Math.sin(a) * r; if (z > 17 && Math.abs(x) < 6) continue; arbre(x, z, 0.8 + alea() * 0.6); }
// feu de camp au centre
const feu = new THREE.Group(); feu.position.set(0, 0, 0); scene.add(feu);
for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; feu.add(place(boite(0.5, 0.35, 0.5, "#7d7d85"), Math.cos(a) * 1.1, 0.17, Math.sin(a) * 1.1)); }
for (let i = 0; i < 3; i++) { const b = boite(1.6, 0.25, 0.25, "#5a3a22"); b.rotation.y = i * 1.05; b.position.y = 0.2; feu.add(b); }
const flammeMat = new THREE.MeshStandardMaterial({ color: "#ffb347", emissive: "#ff7a00", emissiveIntensity: 2, transparent: true, opacity: 0.95 });
const flamme = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.4, 6), flammeMat); flamme.position.y = 1.0; feu.add(flamme);
const lumFeu = new THREE.PointLight("#ff9a3c", 0, 14, 1.4); lumFeu.position.y = 1.6; feu.add(lumFeu);
// lampions le long de l'allée
const lampions = [];
for (let z = -14; z <= 16; z += 4) for (const s of [-1, 1]) { const g = new THREE.Group(); g.add(place(boite(0.12, 1.8, 0.12, "#3b3b44"), 0, 0.9, 0));
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), new THREE.MeshStandardMaterial({ color: "#ffe4a0", emissive: "#ffcf6a", emissiveIntensity: 0 })); l.position.y = 1.9; g.add(l);
  g.position.set(s * 2.2, 0, z); scene.add(g); lampions.push(l); }

/* ================= Étiquettes de pseudo ================= */
function etiquette(texte, couleur = "#ffffff", fond = "rgba(11,16,32,.85)") {
  const c = document.createElement("canvas"); const x = c.getContext("2d"); const t = texte.slice(0, 18);
  x.font = "900 56px Inter, sans-serif"; const w = Math.ceil(x.measureText(t).width) + 48; c.width = w; c.height = 84;
  x.fillStyle = fond; x.beginPath(); x.roundRect(0, 0, w, 84, 26); x.fill();
  x.font = "900 56px Inter, sans-serif"; x.fillStyle = couleur; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(t, w / 2, 45);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false })); s.scale.set(w / 84 * 1.3, 1.3, 1); s.renderOrder = 10; return s;
}

/* ================= Les places (offertes par cadeau) ================= */
const EMPLACEMENTS = [];
for (const z of [-14, -9, -4, 5, 10, 15]) for (const x of [-16, -11, -6, 6, 11, 16]) EMPLACEMENTS.push([x, z]);
EMPLACEMENTS.sort((a, b) => Math.hypot(a[0], a[1]) - Math.hypot(b[0], b[1]));
const COULEURS = ["#e63946", "#f4a261", "#2a9d8f", "#4361ee", "#9b5de5", "#f15bb5", "#00bbf9", "#fee440", "#06d6a0", "#ef476f"];
function couleurDe(nom) { let h = 0; for (const c of nom) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COULEURS[h % COULEURS.length]; }
function construire(type, couleur) {
  const g = new THREE.Group();
  if (type === "tente") {
    const t = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.8, 4), mat(couleur)); t.rotation.y = Math.PI / 4; t.position.y = 0.9; t.castShadow = true; g.add(t);
    g.add(place(boite(0.5, 0.9, 0.05, "#1b1b22"), 0, 0.45, 1.06));
  } else if (type === "caravane") {
    g.add(place(boite(3.2, 1.6, 1.8, "#f2efe6"), 0, 1.15, 0), place(boite(3.25, 0.4, 1.85, couleur), 0, 0.75, 0));
    g.add(place(boite(0.8, 0.5, 0.05, "#7cc4ff"), -0.7, 1.4, 0.92), place(boite(0.5, 1.0, 0.05, couleur), 0.8, 0.9, 0.92));
    for (const x of [-0.9, 0.9]) { const r = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 10), mat("#1b1b1b")); r.rotation.x = Math.PI / 2; r.position.set(x, 0.32, 0.95); g.add(r); }
  } else {
    g.add(place(boite(3.4, 2.0, 2.6, "#a8774a"), 0, 1.0, 0));
    for (const s of [-1, 1]) { const toit = boite(2.2, 0.15, 3.0, couleur); toit.rotation.z = s * -0.6; toit.position.set(s * 0.9, 2.55, 0); g.add(toit); }
    g.add(place(boite(0.7, 1.3, 0.05, "#5a3a22"), 0.7, 0.65, 1.31), place(boite(0.8, 0.6, 0.05, "#ffe4a0"), -0.8, 1.2, 1.31));
    g.add(place(boite(3.6, 0.15, 1.2, "#8a6a42"), 0, 0.08, 1.9));
  }
  g.add(place(boite(0.1, 0.8, 0.1, "#5a3a22"), 1.9, 0.4, 1.4));
  return g;
}
const places = []; // { nom, type, groupe, x, z }
function poserPlace(nom, type, anime = true) {
  const deja = places.find((p) => p.nom === nom);
  const rang = { tente: 0, caravane: 1, chalet: 2 };
  if (deja) { if (rang[type] <= rang[deja.type]) return deja; scene.remove(deja.groupe); deja.type = type; }
  const ici = deja || places.length < EMPLACEMENTS.length && { nom, type, x: EMPLACEMENTS[places.length][0], z: EMPLACEMENTS[places.length][1] };
  if (!ici) return null;
  const g = construire(type, couleurDe(nom));
  const e = etiquette(nom, type === "chalet" ? "#ffd166" : "#ffffff"); e.position.set(0, type === "tente" ? 2.6 : 3.6, 0); g.add(e);
  g.position.set(ici.x, 0, ici.z); g.rotation.y = ici.x > 0 ? -0.25 : 0.25; scene.add(g);
  ici.groupe = g; ici.nait = anime ? performance.now() : 0;
  if (!deja) places.push(ici);
  sauver(); compter();
  return ici;
}
function sauver() { try { localStorage.setItem("campingLive", JSON.stringify(places.map(({ nom, type }) => ({ nom, type })))); } catch {} }
try { for (const p of JSON.parse(localStorage.getItem("campingLive") || "[]")) poserPlace(p.nom, p.type, false); } catch {}

/* ================= Les campeurs (abonnés du live) ================= */
const campeurs = [];
function creerCampeur(nom) {
  const g = new THREE.Group(), c = couleurDe(nom);
  const corps = place(boite(0.7, 0.8, 0.45, c), 0, 1.05, 0); g.add(corps);
  const tete = place(boite(0.55, 0.55, 0.5, "#e9b48e"), 0, 1.75, 0); g.add(tete);
  g.add(place(boite(0.6, 0.18, 0.55, ["#3a2a1c", "#6b3b1f", "#1d1d1d", "#c9a25a"][nom.length % 4]), 0, 2.08, 0));
  const jambes = [-1, 1].map((s) => { const j = place(boite(0.25, 0.65, 0.3, "#2b3550"), s * 0.18, 0.33, 0); g.add(j); return j; });
  const e = etiquette(nom); e.position.y = 2.9; e.scale.multiplyScalar(0.8); g.add(e);
  g.position.set((alea() - 0.5) * 2, 0, 22);
  scene.add(g);
  const a = alea() * Math.PI * 2, r = 2.6 + alea() * 1.6;
  const cible = new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
  const k = { nom, g, jambes, cible, arrive: false, ne: performance.now() };
  campeurs.push(k);
  if (campeurs.length > 30) { const vieux = campeurs.shift(); scene.remove(vieux.g); }
  compter();
  return k;
}

/* ================= Interface ================= */
const $ = (id) => document.getElementById(id);
const vus = new Set();
let totalCampeurs = 0, likes = 0;
function compter() { $("nCampeurs").textContent = totalCampeurs; $("nPlaces").textContent = places.length; }
function notifier(html, couleur = "var(--vert)", duree = 4) {
  const n = document.createElement("div"); n.className = "notif"; n.style.setProperty("--c", couleur); n.style.setProperty("--duree", duree + "s");
  n.innerHTML = html; $("notifs").prepend(n);
  while ($("notifs").children.length > 4) $("notifs").lastChild.remove();
  setTimeout(() => n.remove(), (duree + 0.6) * 1000);
}
const echapper = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function majLikes() {
  const n = Math.min(Math.floor(likes / PALIER), PALIERS.length);
  const objectif = PALIER * (n + 1);
  $("nLikes").textContent = likes.toLocaleString("fr-FR");
  $("objLikes").textContent = n < PALIERS.length ? objectif.toLocaleString("fr-FR") : "∞";
  $("prochain").textContent = n < PALIERS.length ? PALIERS[n] : "TOUT EST DÉBLOQUÉ";
  $("barre").style.width = (n < PALIERS.length ? ((likes % PALIER) / PALIER) * 100 : 100) + "%";
  return n;
}
let niveau = 0;

/* ================= Événements ================= */
function surAbonne(nom) {
  if (!nom || vus.has(nom)) return; vus.add(nom); totalCampeurs++;
  creerCampeur(nom);
  notifier(`<em>${echapper(nom)}</em> a rejoint le camping !`, "var(--vert)");
}
function surCadeau(nom, diamants) {
  if (!nom) return;
  const type = diamants >= SEUILS.chalet ? "chalet" : diamants >= SEUILS.caravane ? "caravane" : diamants >= SEUILS.tente ? "tente" : null;
  if (!type) return;
  if (!vus.has(nom)) surAbonne(nom);
  const p = poserPlace(nom, type);
  const mots = { tente: "une tente", caravane: "une caravane", chalet: "un chalet" };
  if (p) { notifier(`🎁 <em>${echapper(nom)}</em> a ${mots[type]} à son nom !`, "var(--jaune)", 5); if (type === "chalet") feuArtifice(); }
  else notifier(`🎁 Merci <em>${echapper(nom)}</em> ! Le camping est complet`, "var(--jaune)", 5);
}
function surLikes(n) {
  likes += n; const nouv = majLikes();
  while (niveau < nouv) { notifier(`❤ Palier débloqué : <em>${PALIERS[niveau]}</em>`, "var(--rose)", 5); niveau++; if (niveau >= 3) feuArtifice(); }
}
majLikes(); compter();

// TikFinity (logiciel gratuit sur l'ordinateur du live) envoie les événements TikTok sur ce WebSocket
const ADRESSE = Q.get("ws") || "ws://localhost:21213/";
let ws;
function connecter() {
  try { ws = new WebSocket(ADRESSE); } catch { setTimeout(connecter, 3000); return; }
  ws.onopen = () => { $("etat").textContent = "● en direct"; $("etat").classList.add("ok"); };
  ws.onclose = () => { $("etat").textContent = "hors ligne"; $("etat").classList.remove("ok"); setTimeout(connecter, 3000); };
  ws.onmessage = (m) => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    const d = e.data || {}, nom = d.nickname || d.uniqueId;
    if (e.event === "follow") surAbonne(nom);
    else if (e.event === "gift") { if (d.giftType === 1 && !d.repeatEnd) return; surCadeau(nom, (d.diamondCount || 0) * (d.repeatCount || 1)); }
    else if (e.event === "like") surLikes(d.likeCount || 1);
  };
}
connecter();

// boutons de test (?test)
const PSEUDOS = ["lea.camp", "Tom_du_93", "SaraBzh", "Nino", "julie.r", "Mehdi_06", "PtitLouis", "Camille", "Yanis.off", "Emma_lol"];
window.simuler = (type, n) => {
  const nom = PSEUDOS[Math.floor(Math.random() * PSEUDOS.length)] + (Math.random() > .5 ? Math.floor(Math.random() * 99) : "");
  if (type === "follow") surAbonne(nom); else if (type === "gift") surCadeau(nom, n); else surLikes(n);
};
if (Q.has("test")) $("test").style.display = "flex";
window.surAbonne = surAbonne; window.surCadeau = surCadeau; window.surLikes = surLikes;

/* ================= Feu d'artifice ================= */
const etincelles = [];
function feuArtifice() {
  for (let b = 0; b < 4; b++) {
    const centre = new THREE.Vector3((Math.random() - 0.5) * 20, 12 + Math.random() * 6, (Math.random() - 0.5) * 16), couleur = new THREE.Color(COULEURS[Math.floor(Math.random() * COULEURS.length)]);
    for (let i = 0; i < 40; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 4, 3), new THREE.MeshBasicMaterial({ color: couleur, transparent: true }));
      m.position.copy(centre); scene.add(m);
      const v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(6 + Math.random() * 4);
      etincelles.push({ m, v, vie: 1.6 + b * 0.4, retard: b * 0.4 });
    }
  }
}

/* ================= Animation ================= */
let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - avant) / 1000), t = maintenant / 1000; avant = maintenant;
  // feu de camp et lampions selon les paliers
  const feuOn = niveau >= 1 ? 1 : 0.25;
  flamme.scale.set(1 + Math.sin(t * 9) * 0.08, (0.6 + 0.5 * feuOn) * (1 + Math.sin(t * 13) * 0.12), 1);
  lumFeu.intensity = (8 + Math.sin(t * 17) * 1.5) * feuOn;
  lampions.forEach((l, i) => (l.material.emissiveIntensity = niveau >= 2 ? 1.6 + Math.sin(t * 2 + i) * 0.3 : 0));
  // apparition des places
  for (const p of places) if (p.nait) { const k = Math.min(1, (maintenant - p.nait) / 500); p.groupe.scale.setScalar(k < 1 ? 0.2 + 0.8 * k + Math.sin(k * Math.PI) * 0.25 : 1); if (k >= 1) p.nait = 0; }
  // les campeurs marchent jusqu'au feu
  for (const k of campeurs) {
    const d = k.cible.clone().sub(k.g.position); d.y = 0; const dist = d.length();
    if (dist > 0.1) { d.normalize(); k.g.position.addScaledVector(d, Math.min(dist, dt * 3.2)); k.g.rotation.y = Math.atan2(d.x, d.z); const m = Math.sin(t * 10) * 0.5; k.jambes[0].rotation.x = m; k.jambes[1].rotation.x = -m; }
    else { k.jambes.forEach((j) => (j.rotation.x = 0)); k.g.rotation.y += (Math.atan2(-k.g.position.x, -k.g.position.z) - k.g.rotation.y) * 0.1; }
    const age = (maintenant - k.ne) / 1000; k.g.scale.setScalar(Math.min(1, age * 3));
  }
  // étincelles
  for (let i = etincelles.length - 1; i >= 0; i--) {
    const e = etincelles[i];
    if (e.retard > 0) { e.retard -= dt; e.m.visible = false; continue; }
    e.m.visible = true; e.m.position.addScaledVector(e.v, dt); e.v.y -= 4 * dt; e.v.multiplyScalar(0.98); e.vie -= dt; e.m.material.opacity = Math.max(0, e.vie);
    if (e.vie <= 0) { scene.remove(e.m); etincelles.splice(i, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
window.pret = true;
</script>
