<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Flocon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16291f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316291f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23d8c29a'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="top"></div>

<main class="wrap">
  <div class="empty-state" style="padding:110px 0 130px;max-width:620px;margin:0 auto">
    <span class="caps" style="color:var(--gold)">Commande confirmée</span>
    <h1 class="title" style="margin:14px 0 22px">Merci.</h1>
    <p id="msg" style="font-family:var(--sans);font-size:1rem;color:var(--ink-2);margin-bottom:12px">Votre paiement a bien été transmis à PayPal. Une confirmation vous est envoyée par email.</p>
    <p style="font-family:var(--sans);font-size:1rem;color:var(--muted)">Livraison en <span class="days"></span>. Pour toute question, répondez simplement à l'email de confirmation.</p>
    <a class="btn btn-dark" href="index.html">Retour à la boutique</a>
  </div>
</main>

<div id="foot"></div>

<script src="assets/store.js"></script>
<script>
var ref = new URLSearchParams(location.search).get('ref');
if (ref && /^FL-[0-9A-Z-]+$/.test(ref)) {
  document.getElementById('msg').textContent = 'Commande ' + ref + ' : votre paiement a bien été transmis à PayPal. Une confirmation vous est envoyée par email.';
}
document.querySelectorAll('.days').forEach(function (e) { e.textContent = CONFIG.deliveryDays; });
writeCart([]);
</script>
</body>
</html>
