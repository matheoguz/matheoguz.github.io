const MESURE = document.createElement("canvas").getContext("2d");
function largeur(txt, taille) { MESURE.font = `900 ${taille}px Inter`; return MESURE.measureText(txt).width; }
function sousTitres(t) {
  const c = CHUNKS.find((k) => t >= k.t0 && t < k.t1);
  if (!c || t > FIN_VOIX + 0.3) return "";
  const COUL = { w: "#ffffff", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#5fb0ff" };
  const PASTILLE = { w: "#ffd23f", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#5fb0ff" };
  let taille = 72;
  const mots = c.map((w) => w.txt.toUpperCase());
  const ecart = 22;
  let total = mots.reduce((s, m) => s + largeur(m, taille), 0) + ecart * (mots.length - 1);
  if (total > 960) { taille = taille * 960 / total; total = 960; }
  const pop = 0.9 + 0.1 * easeIO(clamp((t - c.t0) / 0.12));
  let cur = -1;
  c.forEach((w, i) => { if (t >= w.t) cur = i; });
  let x = 540 - total / 2, s = `<g transform="translate(540,1395) scale(${pop}) translate(-540,-1395)">`;
  c.forEach((w, i) => {
    const m = mots[i].replace(/&/g, "&amp;"), lw = largeur(mots[i], taille);
    if (i === cur) {
      const k = 1 + 0.08 * (1 - easeIO(clamp((t - w.t) / 0.15)));
      s += `<g transform="translate(${x + lw / 2},1372) scale(${k}) translate(${-(x + lw / 2)},-1372)">
        <rect x="${x - 14}" y="${1395 - taille * 0.86}" width="${lw + 28}" height="${taille * 1.12}" rx="16" fill="${TRAIT}" transform="translate(5,6)"/>
        <rect x="${x - 14}" y="${1395 - taille * 0.86}" width="${lw + 28}" height="${taille * 1.12}" rx="16" fill="${PASTILLE[w.c]}" stroke="${TRAIT}" stroke-width="5"/>
        <text x="${x}" y="1395" font-family="Inter" font-weight="900" font-size="${taille}" fill="${TRAIT}">${m}</text></g>`;
    } else {
      const dit = t >= w.t;
      s += `<text x="${x}" y="1395" font-family="Inter" font-weight="900" font-size="${taille}" fill="${dit ? COUL[w.c] : "#ffffff"}" opacity="${dit ? 1 : 0.5}" stroke="${TRAIT}" stroke-width="12" paint-order="stroke" stroke-linejoin="round">${m}</text>`;
    }
    x += lw + ecart;
  });
  return s + `</g>`;
}

}
// Trajets [temps, x, z, durée]
const TRAJ_MALO = [
  [0, -10, 1.3, 0.01], [P("pan", 0.3), -5.5, 1.6, FP("pan") - P("pan")], [P("presque", 0.2), 7.6, 2.0, P("roger") - P("presque") + 0.6],
  [P("p1"), -9.6, 1.6, 1.0], [P("p2"), -3, 1.7, 1.0], [P("p3"), 4.2, 1.6, 1.0], [P("verif"), 6.9, 1.2, 0.9],
  [P("bilan", 0.4), 1.6, 1.4, 1.6], [FIN_VOIX + 0.2, 3.4, 1.3, 0.8],
];
const TRAJ_ROGER = [
  [0, 9.2, 2.3, 0.01], [P("liste", 0.3), 8.9, 1.9, 0.8], [P("p1"), -8.6, 1.9, 1.2], [P("p2"), -2, 2.0, 1.1],
  [P("p3"), 5.4, 1.9, 1.1], [P("verif"), 8.4, 1.5, 1.0], [P("bilan", 0.6), 2.9, 1.6, 1.7], [FIN_VOIX + 0.2, 4.5, 1.6, 0.8],
];
function trajet(cles, t) {
  let x = cles[0][1], z = cles[0][2], v = 0, dir = 0;
  for (const [kt, kx, kz, kd] of cles) {
    if (t < kt) break;
    const p = ease(t, kt, kd);
    if (p > 0 && p < 1 && Math.abs(kx - x) > 0.05) { v = 1; dir = Math.sign(kx - x); }
    x = lerp(x, kx, p); z = lerp(z, kz, p);
  }
  return { x, z, v, dir };
}
function humeur(t) {
  const H = [[0, "content"], [P("hudFam"), "inquiet"], [P("pan", 1.2), "choque"], [P("presque"), "surpris"],
    [P("roger", 1.0), "content"], [P("p1", 1.2), "grimace"], [FP("calc1"), "content"], [P("p2", 0.6), "grimace"], [FP("calc2"), "content"],
    [P("p3", 1.0), "inquiet"], [P("verif"), "concentre"], [P("ok"), "joie"], [P("bilan", 0.5), "content"], [P("bilan2"), "inquiet"],
    [P("choix0"), "reflechit"], [P("comment"), "joie"]];
  let h = "content"; for (const [ht, v] of H) if (t >= ht) h = v; return h;
}
const EXPR = { // sourcil (rotation, hauteur), bouche (coins, ouverture, largeur), yeux (hauteur)
  content: { sr: 0, sy: 0, coin: 0.45, ouv: 1, lar: 1, oy: 1 },
  joie: { sr: 0, sy: 0.03, coin: 0.7, ouv: 3.2, lar: 1.3, oy: 0.35 },
  inquiet: { sr: 0.35, sy: 0.02, coin: -0.4, ouv: 1, lar: 0.8, oy: 1 },
  grimace: { sr: -0.38, sy: -0.02, coin: -0.25, ouv: 2.2, lar: 1.5, oy: 0.8 },
  concentre: { sr: -0.2, sy: -0.01, coin: 0, ouv: 0.8, lar: 0.7, oy: 0.85 },
  choque: { sr: 0.15, sy: 0.06, coin: -0.2, ouv: 4, lar: 0.9, oy: 1.2 },
  surpris: { sr: 0.1, sy: 0.05, coin: 0, ouv: 2.4, lar: 0.6, oy: 1.15 },
  reflechit: { sr: 0.25, sy: 0.03, coin: 0.15, ouv: 1, lar: 0.8, oy: 0.95 },
};
let exprCour = { ...EXPR.content };

function animerMalo(t, dt) {
  const u = malo.userData, tr = trajet(TRAJ_MALO, t), h = humeur(t);
  malo.position.set(tr.x, 0, tr.z);
  const marche = tr.v ? t * 9 : 0;
  const cibleRot = tr.v ? tr.dir * Math.PI / 2 : (h === "reflechit" ? 0.1 : 0.25);
  malo.rotation.y = lerp(malo.rotation.y, cibleRot, clamp(dt * 8));
  u.corps.position.y = tr.v ? Math.abs(Math.sin(marche)) * 0.08 : Math.sin(t * 2.2) * 0.012;
  u.jambes[0].rotation.x = tr.v ? Math.sin(marche) * 0.6 : 0; u.jambes[1].rotation.x = -u.jambes[0].rotation.x;
  // bras : balancement / gestes
  let b0 = [tr.v ? -Math.sin(marche) * 0.5 : -0.25, 0.09], b1 = [tr.v ? Math.sin(marche) * 0.5 : 0.05, -0.09];
  u.pouce.visible = false;
  if (h === "joie" && t >= P("ok") && t < P("bilan")) { b1 = [-2.1, 0.25]; u.pouce.visible = true; }
  if (h === "reflechit") b1 = [-2.5, 0.55];
  if (t >= P("comment")) b1 = [0, -2.6 + Math.sin(t * 9) * 0.35];
  if (h === "choque") { b0 = [-0.6, 0.5]; b1 = [-0.6, -0.5]; }
  u.bras[0].rotation.set(b0[0], 0, b0[1]); u.bras[1].rotation.set(b1[0], 0, b1[1]);
  // tête
  u.tete.rotation.y = tr.v ? 0 : Math.sin(t * 0.8) * 0.12; u.tete.rotation.x = h === "reflechit" ? -0.12 : h === "inquiet" ? 0.06 : 0;
  u.tete.rotation.z = h === "reflechit" ? 0.12 : 0;
  // expression (transition douce)
  const e = EXPR[h]; for (const k in e) exprCour[k] = lerp(exprCour[k], e[k], clamp(dt * 10));
  const E = exprCour;
  u.sourcils.forEach((s, i) => { const sg = i ? 1 : -1; s.rotation.z = sg * -E.sr + (h === "reflechit" && i ? 0.3 : 0); s.position.y = 0.15 + E.sy + (h === "reflechit" && i ? 0.04 : 0); });
  const cligne = h !== "joie" && (t % 3.4) < 0.12;
  u.yeux.forEach((o) => { o.scale.y = cligne ? 0.1 : E.oy; });
  u.centre.scale.set(E.lar, E.ouv, 1);
  u.coins.forEach((c, i) => { const sg = i ? 1 : -1; c.position.x = sg * 0.05 * E.lar; c.rotation.z = sg * E.coin; });
  // lanterne : allumée la nuit
  const nuit = 1 - jourDe(t);
  u.lanterne.visible = nuit > 0.05; u.flamme.intensity = 10 * nuit * (0.92 + Math.sin(t * 13) * 0.05 + Math.sin(t * 7.3) * 0.03);
}
function animerRoger(t, dt) {
  const u = roger.userData, tr = trajet(TRAJ_ROGER, t);
  roger.position.set(tr.x, 0, tr.z);
  const cible = tr.v ? (tr.dir > 0 ? 0 : Math.PI) : -0.9;
  roger.rotation.y = lerp(roger.rotation.y, cible, clamp(dt * 7));
  const vis = clamp((t - P("roger") - 0.3) / 0.4); roger.visible = t > P("roger") + 0.2;
  roger.scale.setScalar(0.6 + 0.4 * easeIO(vis));
  const m = t * 12;
  u.pattes.forEach((p, i) => { p.rotation.z = tr.v ? Math.sin(m + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * 0.6 : 0; });
  u.corps.position.y = tr.v ? Math.abs(Math.sin(m)) * 0.05 : 0;
  u.queue.rotation.x = Math.sin(t * (tr.v || t > P("ok", 0.5) && t < P("bilan") ? 18 : 7)) * 0.6;
  u.tete.rotation.z = !tr.v && t > P("wouf") && t < P("liste") ? Math.abs(Math.sin(t * 6)) * 0.15 : 0;
}
function jourDe(t) { return ease(t, P("p3"), P("verif") - P("p3") + 0.6); }
function ambiance(t) {
  const j = jourDe(t);
  const ciels = [new THREE.Color("#1a2650"), new THREE.Color("#4a4a7e"), new THREE.Color("#7db8e8")];
  const c = j < 0.5 ? ciels[0].clone().lerp(ciels[1], j * 2) : ciels[1].clone().lerp(ciels[2], (j - 0.5) * 2);
  scene.background = c; scene.fog.color.copy(c);
  ciel.material.opacity = clamp(1 - j * 2.2);
  lune.visible = j < 0.5;
  astre.position.y = lerp(-5, 26, ease(j, 0.2, 0.8));
  hemi.intensity = lerp(1.35, 1.6, j); hemi.color.set(j > 0.5 ? "#cfe3ff" : "#5a70b0"); hemi.groundColor.set(j > 0.5 ? "#4a5a2c" : "#24321c");
  luneL.intensity = lerp(1.9, 0, j);
  soleil.intensity = lerp(0, 2.6, ease(j, 0.3, 0.7)); soleil.castShadow = j > 0.5;
  luneL.castShadow = j <= 0.5;
  lumCar.intensity = 6 * (1 - j);
  renderer.toneMappingExposure = lerp(1.3, 0.98, j);
}
function decor(t) {
  const neuf = ease(t, FP("calc1", -0.3), 0.8);
  portail.forEach(({ v, s, barres }) => {
    v.rotation.y = lerp(s * 0.35, 0, neuf); v.rotation.z = lerp(-s * 0.08, 0, neuf);
    barres.forEach((b, i) => { b.material.color.set(neuf > 0.5 ? "#2e6b52" : "#7a4a2a"); b.scale.y = neuf > 0.5 || (i % 3) ? 1 : 0.6; b.position.y = neuf > 0.5 || (i % 3) ? 1.15 : 0.95; });
    v.children.slice(0, 2).forEach((c) => c.material.color.set(neuf > 0.5 ? "#2e6b52" : "#7a4a2a"));
  });
  // panneau : par terre → monte sur ses poteaux
  panneau.position.set(lerp(1.4, 0, neuf), lerp(0.12, 3.1, neuf), lerp(1.6, -0.1, neuf));

  poteaux.forEach((p) => { p.scale.y = Math.max(0.001, neuf); p.position.y = 2.6 * neuf + 0.5 * (1 - neuf) * 0; p.visible = neuf > 0.02; });
  // ronces : disparaissent de gauche à droite
  const deblai = ease(t, P("calc2", 0.3), FP("calc2") - P("calc2") + 0.4);
  ronces.forEach((r, i) => { const k = clamp(deblai * 10 - i * 0.9); r.scale.setScalar(Math.max(0.001, 1 - easeIO(k))); r.visible = k < 0.999; });
  poussiere.forEach((m, i) => {
    const actif = deblai > 0 && deblai < 1;
    m.material.opacity = actif ? 0.45 * (1 - ((t * 0.8 + i * 0.13) % 1)) : 0;
    m.position.set(-6.6 + deblai * 10 + (i % 5) * 0.3 - 0.6, 0.3 + ((t * 0.8 + i * 0.13) % 1) * 1.6, 0.4 + (i % 3) * 0.3);
  });

  carMat.color.set("#7d7464").lerp(new THREE.Color("#3aa0d8"), rep);
  toitMat.color.set("#5c5248").lerp(new THREE.Color("#35506e"), rep);
  porte.material.color.set(rep > 0.5 ? "#2e6b52" : "#6b5a45");
  fenetreMat.color.set("#2a2f38").lerp(new THREE.Color("#ffd98a"), rep); fenetreMat.emissive.set("#ffb84d"); fenetreMat.emissiveIntensity = rep * 0.8;
  lumDouche.intensity = rep * 4 * (1 - jourDe(t) * 0.6);
  fissures.visible = rep < 0.5;
  tuyau.scale.x = Math.max(0.001, ease(t, FP("calc3"), 1.2) * 4.2); tuyau.position.x = 5.6 + tuyau.scale.x / 2 - 0.5;

  const vap = ease(t, P("ok") - 0.2, 0.6);

}

/* ---------- Temps forts : flashs + bruitages ---------- */
const FIN_DEBLAI = P("calc2", 0.3) + (FP("calc2") - P("calc2") + 0.4);
const FLASHS = [FP("calc1", 0.1), FIN_DEBLAI, FP("calc3", 0.1), P("ok")];
const EVENEMENTS = [];
const ev = (t, type, d = 0) => { if (t >= 0) EVENEMENTS.push({ t: +t.toFixed(3), type, d }); };
PLANS.forEach(([kt, , , kd], i) => { if (i > 1 && kd <= 1.2) ev(kt, "whoosh"); });
ev(0.02, "whoosh");
[P("hudFam"), P("hudAll"), P("p1"), P("p2"), P("p3"), P("calc1"), P("calc2"), P("calc3"), P("liste"), P("bilan"), P("choix"), P("choix", 1.0), P("comment")].forEach((t) => ev(t, "pop"));
[0.4, P("presque") - 2.4, P("p1", 1.2), P("ok"), P("roger", 1.0)].forEach((t) => ev(t, "bulle"));
[P("wouf", 1.4), P("ok", 1.3)].forEach((t) => ev(t, "wouf"));
[FP("calc1"), FP("calc2"), FP("calc3")].forEach((t) => ev(t, "kaching"));
FLASHS.forEach((t) => ev(t, "ding"));
[0, 1, 2].forEach((i) => ev(P("bilan", 0.6 + i * 0.4), "coche"));
ev(P("verif"), "tampon"); ev(P("verif", 1.0), "eau", P("bilan") - P("verif", 1.0));
ev(P("calc2", 0.3), "moteur", FIN_DEBLAI - P("calc2", 0.3));
ev(DUREE - 2.6, "fin");
window.EVENEMENTS = EVENEMENTS;

/* ---------- Interface par-dessus la 3D ---------- */
const v3 = new THREE.Vector3();
function ecran(obj, dy) { obj.updateMatrixWorld(); v3.set(0, dy, 0).applyMatrix4(obj.matrixWorld).project(camera); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H, v3.z < 1]; }
function bulles(t) {
  let s = "";
  const [mx, my] = ecran(malo, 3.05), [rx, ry] = ecran(roger, 1.55);
  const B1 = (x, y, txt, c, o) => bulle(clamp(x, 200, 880), clamp(y, 330, 1250), txt, c, TRAIT, o);
  s += B1(mx, my, "C'EST TOI", "#ffc93c", vis(t, 0.4, 2.6, 0.2));
  s += B1(mx, my, "AÏE…", "#fff6e3", vis(t, P("presque") - 2.4, P("presque") - 0.3, 0.2));
  s += B1(mx, my, "SÉRIEUX ?!", "#fff6e3", vis(t, P("p1", 1.2), P("calc1") - 0.1, 0.2));
  s += B1(mx, my, "ELLE EST CHAUDE !", "#fff6e3", vis(t, P("ok"), P("ok", 1.5), 0.2));
  if (roger.visible) {
    s += B1(rx, ry, "ROGER", "#4ade80", vis(t, P("roger", 1.0), P("wouf"), 0.2));
    s += B1(rx, ry, "WOUF.", "#fff6e3", vis(t, P("wouf", 1.4), FP("wouf") + 0.3, 0.2));
    s += B1(rx, ry, "WOUF ! ✔", "#4ade80", vis(t, P("ok", 1.3), P("bilan"), 0.2));
  }

}
function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35);
  if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c" opacity=".55"/>
    <text x="540" y="470" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#4ade80" letter-spacing="6" stroke="${TRAIT}" stroke-width="8" paint-order="stroke">LES PINS PERDUS</text>
    <text x="540" y="575" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="#fff6e3" stroke="${TRAIT}" stroke-width="14" paint-order="stroke">ÉPISODE 2</text>
    <text x="540" y="675" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="#ffc93c" stroke="${TRAIT}" stroke-width="14" paint-order="stroke">BIENTÔT</text>
    <g transform="translate(540,1560)"><rect x="-340" y="-44" width="680" height="88" rx="44" fill="${TRAIT}" transform="translate(5,7)"/><rect x="-340" y="-44" width="680" height="88" rx="44" fill="#ff3b5c" stroke="#fff6e3" stroke-width="4"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#fff">+ ABONNE-TOI POUR LA SUITE</text></g></g>`;
}
function interface_(t) {
  let s = `<defs><linearGradient id="bas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity="0"/><stop offset="1" stop-color="#05070f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="haut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity=".45"/><stop offset="1" stop-color="#05070f" stop-opacity="0"/></linearGradient></defs>
    <rect x="0" y="1180" width="1080" height="740" fill="url(#bas)"/><rect x="0" y="0" width="1080" height="320" fill="url(#haut)"/>`;
  s += bulles(t) + hud(t) + puce(t);
  s += carteCalcul(t, P("calc1"), P("p2", 0.2), [["PORTAIL NEUF", "2 500 €"], ["PANNEAU REPEINT", "1 500 €"]], "4 000 €", 1);
  s += carteCalcul(t, P("calc2"), P("p3", 0.2), [["DÉBROUSSAILLEUSE", "300 €"], ["BENNE × 2", "900 €"], ["3 JOURS DE BOULOT", "1 300 €"]], "2 500 €", 2);
  s += carteCalcul(t, P("calc3"), P("verif", 0.2), [["PLOMBERIE", "14 000 €"], ["CARRELAGE", "12 000 €"], ["CHAUFFE-EAU", "8 000 €"]], "34 000 €", 3);
  s += liste(t) + choix(t) + sousTitres(t);
  s += `<text x="1040" y="1868" text-anchor="end" font-family="Inter" font-weight="800" font-size="24" fill="#ffffff" opacity=".55" letter-spacing="2">LES PINS PERDUS · ÉP. 1</text>`;
  for (const ft of FLASHS) { const o = 0.6 * clamp(1 - (t - ft) / 0.3); if (t >= ft && o > 0) s += `<rect width="1080" height="1920" fill="#fff6e3" opacity="${o.toFixed(3)}"/>`; }
  s += carteFin(t);
  document.getElementById("ui").innerHTML = s;
}

/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt);
  const { pos, cib, fov } = plan(t); camera.position.copy(pos); camera.lookAt(cib); if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;
await document.fonts.ready;
window.pret = true;
if (!document.body.classList.contains("rendu") && !location.search.includes("rendu")) {
  rendre(0.5);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => {
    btn.remove(); voix.currentTime = 0; voix.play().catch(() => {});
    const debut = performance.now();
    const boucle = () => { const t = (performance.now() - debut) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); };
    requestAnimationFrame(boucle);
  };
} else document.body.classList.add("rendu");
