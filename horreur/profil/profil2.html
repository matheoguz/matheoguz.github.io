<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1080"></canvas>
<script src="../monstres-art.js"></script><script src="../style2.js"></script>
<script>
const cv=document.getElementById('c'),c=cv.getContext('2d'),T=Math.PI*2,L='#141526';
const ell=(x,y,rx,ry,r=0)=>{c.beginPath();c.ellipse(x,y,rx,ry,r,0,T)};
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r)};
const rem=(col,lw=8)=>{c.fillStyle=col;c.fill();c.strokeStyle=L;c.lineWidth=lw;c.lineJoin='round';c.stroke()};
const toi={peau:"#f0c9a4",cheveux:"#3a2618",coiffure:"court",sweat:"#3a7a5a",pantalon:"#2b2f45",logo:"#f2f2f2"};
function dessiner(v){
 // chambre la nuit
 c.fillStyle='#1c2146';c.fillRect(0,0,1080,1080);
 for(let i=0;i<14;i++){c.fillStyle=i%2?'#1f2550':'#1a1f44';c.fillRect(i*80,0,80,760);}
 // porte entrouverte avec les yeux
 rr(90,190,250,560,6);rem('#0d0f22');c.fillStyle='#04040a';c.beginPath();c.moveTo(90,190);c.lineTo(200,215);c.lineTo(200,735);c.lineTo(90,750);c.fill();
 rr(200,190,140,560,4);rem('#3a3560',7);
 c.save();c.shadowColor='#8dff70';c.shadowBlur=26;c.fillStyle='#c4ff9e';ell(132,420,11,6,-.1);c.fill();ell(168,414,11,6,.1);c.fill();c.restore();
 c.fillStyle='#000';c.fillRect(130,414,3,12);c.fillRect(166,408,3,12);
 // fenêtre et lune
 rr(700,150,280,300,8);rem('#0d1434');c.fillStyle='#fff4d6';ell(900,230,26,26);c.fill();
 c.strokeStyle=L;c.lineWidth=10;c.beginPath();c.moveTo(840,150);c.lineTo(840,450);c.moveTo(700,300);c.lineTo(980,300);c.stroke();
 let lg=c.createLinearGradient(0,0,0,1080);c.globalCompositeOperation='lighter';
 c.fillStyle='rgba(120,150,255,.07)';c.beginPath();c.moveTo(700,450);c.lineTo(980,450);c.lineTo(700,1080);c.lineTo(250,1080);c.fill();c.globalCompositeOperation='source-over';
 c.fillStyle='#262040';c.fillRect(0,760,1080,320);
 // le personnage (caché derrière le lit)
 window.PERSO2(c,toi,{x:560,y:1480,echelle:1.3,expr:'peur',regard:-1,pose:'normal'},1.3);
 // le lit au premier plan
 rr(-40,700,1160,420,30);rem('#5a3a5a');
 c.beginPath();c.moveTo(-40,700);c.quadraticCurveTo(540,640,1120,700);c.lineTo(1120,800);c.quadraticCurveTo(540,760,-40,800);c.closePath();rem('#5a8ac0');
 c.fillStyle='#7aa4d4';for(let i=0;i<8;i++){ell(70+i*135,760,16,16);c.fill();}
 // mains agrippées au bord du lit
 [[390,708],[730,708]].forEach(([x,y])=>{ell(x,y,34,28);rem(toi.peau,7);c.strokeStyle=L;c.lineWidth=5;for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(x+k*14,y+4);c.lineTo(x+k*14,y+24);c.stroke();}});
 // lueur de bougie + vignette
 let g=c.createRadialGradient(560,560,60,560,560,700);g.addColorStop(0,'rgba(242,169,59,.16)');g.addColorStop(1,'rgba(242,169,59,0)');c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(0,0,1080,1080);c.globalCompositeOperation='source-over';
 let vg=c.createRadialGradient(540,540,380,540,540,580);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=vg;c.fillRect(0,0,1080,1080);
}
window.dessiner=dessiner;window.PRET=true;
</script></body></html>
