<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bamboo9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#C4915E"/>
      <stop offset="100%" stop-color="#B8844E"/>
    </linearGradient>
    <linearGradient id="bambooLight9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CBA8"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="bambooWall9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4915E"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <filter id="shadow9">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="#E0F2F1"/>

  <!-- Shadow under organizer -->
  <ellipse cx="200" cy="340" rx="140" ry="12" fill="#000" opacity="0.08"/>

  <!-- Outer drawer frame -->
  <rect x="55" y="70" width="290" height="260" rx="6" fill="url(#bamboo9)" filter="url(#shadow9)"/>
  <!-- Inner drawer base -->
  <rect x="62" y="77" width="276" height="246" rx="4" fill="#F5E6D0"/>

  <!-- Bamboo dividers - horizontal -->
  <rect x="62" y="77" width="276" height="6" rx="1" fill="url(#bambooLight9)"/>
  <rect x="62" y="157" width="276" height="6" rx="1" fill="url(#bambooLight9)"/>
  <rect x="62" y="237" width="276" height="6" rx="1" fill="url(#bambooLight9)"/>
  <rect x="62" y="317" width="276" height="6" rx="1" fill="url(#bambooLight9)"/>

  <!-- Bamboo dividers - vertical -->
  <rect x="62" y="77" width="6" height="246" rx="1" fill="url(#bambooWall9)"/>
  <rect x="155" y="77" width="6" height="166" rx="1" fill="url(#bambooWall9)"/>
  <rect x="245" y="77" width="6" height="166" rx="1" fill="url(#bambooWall9)"/>
  <rect x="332" y="77" width="6" height="246" rx="1" fill="url(#bambooWall9)"/>
  <!-- Bottom row dividers -->
  <rect x="140" y="237" width="6" height="86" rx="1" fill="url(#bambooWall9)"/>
  <rect x="220" y="237" width="6" height="86" rx="1" fill="url(#bambooWall9)"/>

  <!-- Items in compartments -->
  <!-- Top-left: spoons/forks -->
  <rect x="80" y="95" width="6" height="52" rx="2" fill="#888" transform="rotate(-5 83 121)"/>
  <rect x="95" y="93" width="6" height="54" rx="2" fill="#999" transform="rotate(2 98 120)"/>
  <rect x="110" y="94" width="6" height="53" rx="2" fill="#888" transform="rotate(-3 113 120)"/>
  <rect x="125" y="92" width="6" height="55" rx="2" fill="#777"/>
  <!-- Fork tines -->
  <line x1="80" y1="90" x2="78" y2="85" stroke="#888" stroke-width="1.5" transform="rotate(-5 83 121)"/>
  <line x1="83" y1="90" x2="83" y2="84" stroke="#888" stroke-width="1.5" transform="rotate(-5 83 121)"/>
  <line x1="86" y1="90" x2="88" y2="85" stroke="#888" stroke-width="1.5" transform="rotate(-5 83 121)"/>

  <!-- Top-middle: pens/pencils -->
  <rect x="170" y="92" width="5" height="56" rx="2" fill="#2196F3"/>
  <rect x="182" y="90" width="5" height="58" rx="2" fill="#F44336"/>
  <rect x="194" y="93" width="5" height="55" rx="2" fill="#333"/>
  <rect x="206" y="91" width="5" height="57" rx="2" fill="#4CAF50"/>
  <rect x="218" y="94" width="5" height="54" rx="2" fill="#FF9800"/>
  <!-- Pen caps -->
  <rect x="170" y="88" width="5" height="6" rx="1" fill="#1565C0"/>
  <rect x="182" y="86" width="5" height="6" rx="1" fill="#C62828"/>
  <rect x="194" y="89" width="5" height="6" rx="1" fill="#111"/>

  <!-- Top-right: paper clips and pins -->
  <ellipse cx="275" cy="105" rx="8" ry="4" fill="#FFD700" transform="rotate(20 275 105)"/>
  <ellipse cx="290" cy="110" rx="8" ry="4" fill="#C0C0C0" transform="rotate(-15 290 110)"/>
  <ellipse cx="305" cy="100" rx="8" ry="4" fill="#FFD700" transform="rotate(30 305 100)"/>
  <circle cx="270" cy="125" r="4" fill="#F44336"/>
  <circle cx="282" cy="130" r="4" fill="#2196F3"/>
  <circle cx="295" cy="128" r="4" fill="#4CAF50"/>
  <circle cx="310" cy="122" r="4" fill="#FF9800"/>
  <circle cx="280" cy="142" r="4" fill="#9C27B0"/>

  <!-- Middle-left: scissors & tape -->
  <ellipse cx="95" cy="185" rx="12" ry="6" fill="#666"/>
  <ellipse cx="120" cy="185" rx="12" ry="6" fill="#666"/>
  <rect x="100" y="182" width="15" height="6" rx="1" fill="#555"/>
  <circle cx="105" cy="210" r="14" fill="#DCEDC8" stroke="#AED581" stroke-width="2"/>
  <circle cx="105" cy="210" r="6" fill="#F5E6D0"/>

  <!-- Middle-middle: rubber bands & erasers -->
  <rect x="175" y="175" width="22" height="14" rx="3" fill="#FFB6C1"/>
  <rect x="200" y="180" width="18" height="12" rx="2" fill="#FFF"/>
  <ellipse cx="185" cy="210" rx="12" ry="8" fill="none" stroke="#D4A017" stroke-width="2"/>
  <ellipse cx="210" cy="215" rx="10" ry="7" fill="none" stroke="#D4A017" stroke-width="2"/>
  <ellipse cx="195" cy="220" rx="11" ry="7" fill="none" stroke="#C0392B" stroke-width="2"/>

  <!-- Middle-right: batteries/USB sticks -->
  <rect x="262" y="175" width="14" height="28" rx="3" fill="#333"/>
  <rect x="264" y="177" width="10" height="4" rx="1" fill="#C0C0C0"/>
  <rect x="264" y="183" width="10" height="6" rx="0" fill="#FFD700"/>
  <rect x="285" y="178" width="12" height="24" rx="3" fill="#2196F3"/>
  <rect x="289" y="172" width="4" height="8" rx="1" fill="#C0C0C0"/>
  <rect x="308" y="176" width="14" height="28" rx="3" fill="#333"/>
  <rect x="310" y="178" width="10" height="4" rx="1" fill="#C0C0C0"/>
  <rect x="310" y="184" width="10" height="6" rx="0" fill="#FFD700"/>

  <!-- Bottom-left: coins and keys -->
  <circle cx="88" cy="270" r="10" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <circle cx="88" cy="270" r="5" fill="#DAA520" opacity="0.3"/>
  <circle cx="108" cy="275" r="10" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="1"/>
  <circle cx="108" cy="275" r="5" fill="#A0A0A0" opacity="0.3"/>
  <circle cx="120" cy="260" r="8" fill="#CD7F32" stroke="#A0522D" stroke-width="1"/>
  <rect x="80" y="292" width="35" height="5" rx="2" fill="#C0C0C0"/>
  <circle cx="78" cy="295" r="6" fill="none" stroke="#C0C0C0" stroke-width="2"/>

  <!-- Bottom-middle: sticky notes -->
  <rect x="152" y="252" width="30" height="30" rx="1" fill="#FFEB3B" transform="rotate(-3 167 267)"/>
  <rect x="168" y="258" width="30" height="30" rx="1" fill="#81D4FA" transform="rotate(5 183 273)"/>
  <rect x="185" y="255" width="30" height="30" rx="1" fill="#F8BBD0" transform="rotate(-2 200 270)"/>
  <line x1="157" y1="262" x2="175" y2="262" stroke="#E6D435" stroke-width="1"/>
  <line x1="157" y1="267" x2="172" y2="267" stroke="#E6D435" stroke-width="1"/>

  <!-- Bottom-right: binder clips -->
  <rect x="235" y="260" width="20" height="14" rx="2" fill="#333"/>
  <path d="M240 260 L237 252 L243 252 Z" fill="#333"/>
  <path d="M250 260 L247 252 L253 252 Z" fill="#333"/>
  <rect x="270" y="265" width="20" height="14" rx="2" fill="#333"/>
  <path d="M275 265 L272 257 L278 257 Z" fill="#333"/>
  <path d="M285 265 L282 257 L288 257 Z" fill="#333"/>
  <rect x="300" y="258" width="20" height="14" rx="2" fill="#666"/>
  <path d="M305 258 L302 250 L308 250 Z" fill="#666"/>
  <path d="M315 258 L312 250 L318 250 Z" fill="#666"/>

  <!-- Bamboo grain texture lines -->
  <line x1="62" y1="82" x2="62" y2="320" stroke="#B8844E" stroke-width="0.5" opacity="0.3"/>
  <line x1="338" y1="82" x2="338" y2="320" stroke="#B8844E" stroke-width="0.5" opacity="0.3"/>

  <!-- Label -->
  <rect x="145" y="350" width="110" height="20" rx="10" fill="#B8844E" opacity="0.2"/>
  <text x="200" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7D5A3C" font-weight="600">BAMBOO ORGANIZER</text>
</svg>