<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rebond : la seconde main sans frais cachés. 0 % de commission vendeur.">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>Rebond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar + category rail, dense photo grid of "price-tag" cards; sheets slide up for detail, sell, chat, checkout; bottom tab bar on phones. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE8; --ink:#13201B; --muted:#5B6961; --line:#D9E0DA;
  --accent:#0B8A5F; --accent-ink:#FFFFFF; --accent-soft:#D6EFE4;
  --tag:#FFD447; --tag-ink:#231D02; --danger:#B93C28; --warn:#9A6400; --shadow:rgba(19,32,27,.14);
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2A24; --ink:#E6EEE9; --muted:#93A39A; --line:#2A3831;
  --accent:#34C28E; --accent-ink:#03140D; --accent-soft:#173A2C;
  --tag:#F4C935; --tag-ink:#231D02; --danger:#F0806B; --warn:#E3B04F; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2A24; --ink:#E6EEE9; --muted:#93A39A; --line:#2A3831;
  --accent:#34C28E; --accent-ink:#03140D; --accent-soft:#173A2C;
  --tag:#F4C935; --tag-ink:#231D02; --danger:#F0806B; --warn:#E3B04F; --shadow:rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.03em;background:none;border:0;padding:0;display:flex;align-items:center;gap:6px}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateY(-6px);font-style:normal}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{flex:none;color:var(--muted)}
.navlinks{display:flex;gap:4px}
.navlinks button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;position:relative}
.navlinks button[aria-current="true"]{color:var(--ink);background:var(--surface-2)}
.dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{padding:7px 13px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch;padding-block:22px 8px}
.hero-main{background:var(--ink);color:var(--bg);border-radius:22px;padding:28px 28px 26px;position:relative;overflow:hidden;min-width:0}
.hero-main h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.035em;max-width:14ch}
.hero-main h1 em{font-style:normal;color:var(--tag)}
.hero-main p{max-width:44ch;opacity:.82;margin:12px 0 18px}
.hero-main .btn.primary{background:var(--tag);color:var(--tag-ink)}
.hero-main .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-deal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero-deal h2{font-size:1.15rem}
.fee-row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding:6px 0;border-bottom:1px dashed var(--line)}
.fee-row b{font-family:var(--f-mono);font-weight:500}
.fee-row.total{border-bottom:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.grey{background:var(--surface-2);color:var(--muted)}
.pill.sold{background:var(--ink);color:var(--bg)}

/* filters */
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:14px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:6px 14px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;max-width:100%}
.filters input{width:120px}
.count{margin-left:auto;font-size:.88rem}

/* grid & card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 14px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--surface-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .ph img{transform:scale(1.035)}
.tag{position:absolute;left:10px;bottom:10px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-size:.95rem;padding:4px 10px 4px 20px;border-radius:4px 8px 8px 4px;transform:rotate(-3deg);box-shadow:0 2px 6px var(--shadow)}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;color:var(--ink)}
.fav[aria-pressed="true"]{color:var(--danger)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.badge-demo{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:var(--muted);padding:2px 7px;border-radius:5px}
.soldout{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase}
.card h3{font-family:var(--f-body);font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{border:2px dashed var(--line);border-radius:20px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:1.4rem}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:22px 12px}
.section-h h2{font-size:1.6rem;letter-spacing:-.02em}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
.sheet{background:var(--bg);width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .22s ease-out;display:flex;flex-direction:column}
.sheet.narrow{width:min(560px,100%)}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.sheet-b{padding:18px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.gallery{display:flex;flex-direction:column;gap:8px;min-width:0}
.gallery .main{aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.gallery .main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:80px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.price-big{font-family:var(--f-mono);font-size:2rem;letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.92rem}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:600}
.seller{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.av{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:#fff}
.stars{color:var(--warn);letter-spacing:1px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.protect{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--accent-soft);font-size:.88rem}
.protect svg{flex:none;color:var(--accent);margin-top:2px}

/* forms */
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:400;width:100%}
label.f textarea{min-height:96px;resize:vertical}
.hint{font-weight:400;font-size:.82rem;color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative;width:86px;height:108px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.photos .add{width:86px;height:108px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer;background:var(--surface)}
.photos .add:focus-within{outline:2px solid var(--accent)}
.photos .add input{position:absolute;width:1px;height:1px;opacity:0}
.earn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.earn b{font-family:var(--f-mono);font-size:1.2rem;font-weight:500;color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt input{accent-color:var(--accent)}
.opt .grow{flex:1;min-width:0}
.opt b{font-family:var(--f-mono);font-weight:500}

/* chat */
.threads{display:flex;flex-direction:column;gap:8px}
.thread{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;width:100%}
.thread img{width:52px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.thread .grow{flex:1;min-width:0}
.thread .last{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg time{display:block;font-size:.72rem;opacity:.7;margin-top:2px}
.offer{align-self:center;width:min(360px,100%);padding:14px;border-radius:16px;background:var(--surface);border:1px dashed var(--ink);text-align:center;display:grid;gap:8px}
.offer b{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 18px;background:var(--bg);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px}
.chat-head{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.chat-head img{width:44px;height:55px;object-fit:cover;border-radius:8px}

/* me */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tabs button{flex:none;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.olist{display:flex;flex-direction:column;gap:10px}
.order{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;flex-wrap:wrap}
.order img{width:56px;height:70px;border-radius:8px;object-fit:cover;flex:none}
.order .grow{flex:1;min-width:160px}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:1.6rem;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--warn)}

.banner{margin-block:12px 0;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px var(--shadow);width:max-content;max-width:calc(100% - 32px);text-align:center}

/* bottom nav (phones) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar{grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar .sell{color:var(--accent-ink)}
.tabbar .sell span.c{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 12px var(--shadow)}
.tabbar .dot{top:0;right:calc(50% - 22px)}

footer{padding-block:40px 20px;color:var(--muted);font-size:.84rem}

@media (max-width:820px){
  .navlinks,.top .btn.sellbtn{display:none}
  .tabbar{display:grid}
  .hero{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr}
  .scrim{padding:0;align-items:flex-end}
  .sheet,.sheet.narrow{width:100%;max-height:94%;border-radius:22px 22px 0 0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
  .row2{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
}
</style>

<header class="top">
  <div class="wrap">
    <button class="logo" id="logo" aria-label="Rebond, accueil">rebond<i></i></button>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher une marque, un article…" autocomplete="off">
    </label>
    <nav class="navlinks" aria-label="Navigation">
      <button data-go="home">Explorer</button>
      <button data-go="favs">Favoris</button>
      <button data-go="inbox">Messages</button>
      <button data-go="me">Mon espace</button>
    </nav>
    <button class="btn primary sellbtn" data-action="sell">+ Vendre</button>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>

<footer class="wrap">
  <p><b>Rebond</b> · la seconde main sans frais cachés. <span id="modeNote"></span></p>
</footer>

<nav class="tabbar" aria-label="Navigation mobile">
  <button data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9H3z"/></svg>Explorer</button>
  <button data-go="favs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favoris</button>
  <button class="sell" data-action="sell"><span class="c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span><span style="color:var(--accent)">Vendre</span></button>
  <button data-go="inbox"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>Messages</button>
  <button data-go="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Moi</button>
</nav>

<div id="sheets"></div>
<div id="toastHost"></div>

<script>
(() => {
"use strict";

/* ---------- Business rules (one place to tweak) ---------- */
const FEES = { buyerRate: 0.03, buyerCap: 5, sellerRate: 0 };            // protection acheteur 3 % plafonnée à 5 €, 0 % vendeur
const SHIPPING = [
  { id: "relay", label: "Point relais", sub: "3 à 5 jours · suivi inclus", price: 3.49 },
  { id: "home",  label: "À domicile",  sub: "2 à 3 jours · suivi inclus", price: 5.99 },
  { id: "hand",  label: "Remise en main propre", sub: "Vous fixez le rendez-vous par message", price: 0 },

  messages.push({ kind: "msg", from: S.me, at: Date.now(), text: ok ? `Offre acceptée à ${eur(t.messages[i].amount)}. Tu peux acheter à ce prix.` : "Désolé, je ne peux pas descendre à ce prix." });
  const patch = { messages, updatedAt: Date.now() }; if (ok) patch.acceptedPrice = t.messages[i].amount;
  try { await Store.update("threads", t.id, patch); } catch (e) { writeFailed(e); }
}

/* Checkout */
function openCheckout(listingId, negotiated) {
  if (!needWrite()) return;
  const l = listingById(listingId); if (!l || l.status === "sold") { toast("Cet article n’est plus disponible."); return; }
  if (!negotiated) { const t = S.threads.find(x => x.id === threadId(l.id, S.me || "")); negotiated = t?.acceptedPrice; }
  const price = negotiated || l.price;
  sheetState = { type: "checkout", id: listingId };
  let ship = "relay";
  const sumBox = h("div");
  const paintSum = () => {
    const s = SHIPPING.find(x => x.id === ship);
    sumBox.replaceChildren(
      h("div", { class: "fee-row" }, h("span", null, negotiated ? "Article (prix négocié)" : "Article"), h("b", null, eur(price))),
      h("div", { class: "fee-row" }, h("span", null, "Protection acheteur (3 %, max 5 €)"), h("b", null, eur(fee(price)))),
      h("div", { class: "fee-row" }, h("span", null, s.label), h("b", null, eur(s.price))),
      h("div", { class: "fee-row total" }, h("span", null, "Total"), h("b", null, eur(price + fee(price) + s.price))));
  };
  paintSum();
  const opts = h("div", { class: "form", role: "radiogroup", "aria-label": "Livraison" }, SHIPPING.map(s =>
    h("label", { class: "opt" }, h("input", { type: "radio", name: "ship", value: s.id, checked: s.id === ship, onchange: () => { ship = s.id; paintSum(); } }),
      h("span", { class: "grow" }, h("b", { style: "font-family:var(--f-body);font-weight:700" }, s.label), h("br"), h("span", { class: "small muted" }, s.sub)),
      h("b", null, s.price ? eur(s.price) : "Gratuit"))));
  const pay = h("button", { class: "btn primary block", onclick: async () => {
    if (!needWrite()) return;
    const fresh = listingById(listingId); if (!fresh || fresh.status === "sold") { toast("Quelqu’un vient de l’acheter. Désolé !"); closeSheet(); return; }
    pay.disabled = true; pay.textContent = "Paiement…";
    const s = SHIPPING.find(x => x.id === ship);
    const oid = Store.newId("orders");
    const order = { listingId, title: l.title, thumb: l.thumb || imgOf(l), sellerId: l.sellerId, buyerId: S.me, price, fee: fee(price), shipping: s.id, shipLabel: s.label, shipPrice: s.price, total: Math.round((price + fee(price) + s.price) * 100) / 100, status: "paid", createdAt: Date.now() };
    if (order.thumb.length > 60000) order.thumb = "";
    try {
      await Store.set("orders", oid, order);
      await Store.update("listings", listingId, { status: "sold", buyerId: S.me });
      closeSheet(); S.view = "me"; S.meTab = "buys"; render(); window.scrollTo({ top: 0 }); toast("Commande payée ! Le vendeur a 5 jours pour expédier.");
    } catch (e) { pay.disabled = false; pay.textContent = "Payer"; writeFailed(e); }
  } }, "Payer");
  const body = h("div", { class: "sheet-b form" },
    h("div", { class: "chat-head" }, h("img", { src: imgOf(l), alt: "" }), h("div", null, h("b", null, l.title), h("div", { class: "small muted" }, `${l.size} · ${l.condition}`))),
    h("h3", { style: "font-size:1.05rem" }, "Livraison"), opts,
    h("h3", { style: "font-size:1.05rem" }, "Récapitulatif"), sumBox,
    h("div", { class: "protect", html: ICON.shield }, h("div", null, "Le vendeur est payé seulement quand tu confirmes la réception.")),
    pay,
    h("p", { class: "small muted", style: "margin:0;text-align:center" }, "Paiement de démonstration : aucune carte n’est débitée."));
  openSheet("Paiement sécurisé", body, { narrow: true });
}

/* Review */
function openReview(o) {
  let stars = 5;
  const pick = h("div", { class: "starpick", role: "radiogroup", "aria-label": "Note" });
  const paint = () => pick.replaceChildren(...[1, 2, 3, 4, 5].map(i => h("button", { type: "button", class: i <= stars ? "on" : "", role: "radio", "aria-checked": String(i === stars), "aria-label": `${i} étoile${i > 1 ? "s" : ""}`, onclick: () => { stars = i; paint(); } }, "★")));
  paint();
  const txt = h("textarea", { id: "rvTxt", maxlength: "400", placeholder: "Envoi rapide, article conforme…" });
  const body = h("form", { class: "sheet-b form", onsubmit: async e => {
    e.preventDefault(); if (!needWrite()) return;
    try { await Store.set("reviews", o.id, { sellerId: o.sellerId, buyerId: S.me, stars, text: txt.value.trim(), at: Date.now() }); closeSheet(); toast("Merci pour ton avis !"); } catch (err) { writeFailed(err); }
  } }, h("p", { style: "margin:0" }, `Comment s’est passée ta commande « ${o.title} » avec ${nameOf(o.sellerId)} ?`), pick,
    h("label", { class: "f", for: "rvTxt" }, "Commentaire (facultatif)", txt), h("button", { class: "btn primary block", type: "submit" }, "Publier l’avis"));
  sheetState = { type: "review" };
  openSheet("Noter la vente", body, { narrow: true });
}

/* ---------- Wiring ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const a = e.target.closest('[data-action="sell"]'); if (a) openSell();
});
$("#logo").addEventListener("click", () => { S.f = { q: "", cat: "all", size: "", cond: "", max: "", sort: "recent" }; $("#q").value = ""; go("home"); });
let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.f.q = e.target.value; if (S.view !== "home" && S.view !== "favs") S.view = "home"; render(); }, 160); });

boot();
})();
