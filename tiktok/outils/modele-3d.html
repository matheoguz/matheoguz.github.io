<body>

<script type="module">
import * as THREE from "three";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

/* =========================================================
   LES PINS PERDUS — Épisode 1 en 3D low poly
   Minutage calé sur la voix off (tiktok/outils/aligner.py)
   ========================================================= */
/*@@SCRIPT@@*/
const MINUTAGE = /*@@MINUTAGE@@*/null;
const WORDS = MINUTAGE.words, SENT = MINUTAGE.sent, B = {};
SCRIPT.forEach(([, beat], i) => { if (beat) B[beat] = SENT[i].t0; });
const FIN_VOIX = MINUTAGE.duree_voix;
const DUREE = MINUTAGE.duree_fichier + 2.6;
/*@@CHUNKS@@*/
/*@@OUTILS@@*/
const TRAIT = "#1d1a2b";
let ZOOM = 1;
/*@@UI@@*/

/* ---------- Moteur 3D ---------- */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.getElementById("cadre").prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 150);

let graine = 3;
const alea = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
const mat = (c, e = 0) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85, metalness: 0, emissive: e ? c : 0x000000, emissiveIntensity: e });
function facettes(geo, force = 0.04, sphere = 0) {
  geo.deleteAttribute("normal"); geo.deleteAttribute("uv");
  geo = mergeVertices(geo);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    if (sphere) { const l = v.length(); const n = v.clone().normalize().multiplyScalar(Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z))); v.lerp(n.setLength(Math.max(l * 0.9, n.length())), sphere); }
    v.x += (alea() - 0.5) * force; v.y += (alea() - 0.5) * force; v.z += (alea() - 0.5) * force;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}
const ombre = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
const bloc = (w, h, d, c, f = 0.03, seg = 1) => ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(w, h, d, seg, seg, seg), f), mat(c)));
const pose = (m, x, y, z, rx = 0, ry = 0, rz = 0) => { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; };
const groupe = (x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); return g; };
function texteTexture(lignes, fond, encre, w = 512, h = 160) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = fond; x.fillRect(0, 0, w, h);
  x.fillStyle = encre; x.textAlign = "center"; x.textBaseline = "middle";
  lignes.forEach(([txt, taille, y]) => { x.font = `900 ${taille}px Inter, sans-serif`; x.fillText(txt, w / 2, y); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------- Malo ---------- */
const PEAU = "#e9b48e", CHEV = "#6b3b1f", VESTE = "#2f6b4f", TSHIRT = "#efe8d8", JEAN = "#33476e", BASKET = "#d8432f";
function creerMalo() {
  const g = new THREE.Group(), corps = groupe(); g.add(corps);
  const jambes = [];
  for (const s of [-1, 1]) {
    const j = groupe(s * 0.17, 1.05, 0);
    j.add(pose(bloc(0.26, 0.85, 0.28, JEAN, 0.02), 0, -0.43, 0));
    j.add(pose(bloc(0.3, 0.16, 0.44, BASKET, 0.02), 0, -0.95, 0.06));
    j.add(pose(bloc(0.31, 0.05, 0.45, "#f2f2f2", 0), 0, -1.03, 0.06));
    corps.add(j); jambes.push(j);
  }
  corps.add(pose(bloc(0.62, 0.78, 0.36, TSHIRT, 0.03, 2), 0, 1.42, 0));
  for (const s of [-1, 1]) corps.add(pose(bloc(0.24, 0.82, 0.4, VESTE, 0.03, 2), s * 0.24, 1.43, 0));
  corps.add(pose(bloc(0.7, 0.14, 0.42, VESTE, 0.02), 0, 1.05, 0));
  for (const s of [-1, 1]) corps.add(pose(bloc(0.16, 0.18, 0.06, "#24543e", 0.01), s * 0.14, 1.78, 0.19, 0.2, 0, s * 0.35));
  corps.add(pose(new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.13, 4), mat("#2e8b57")), 0, 1.5, 0.19, 0, Math.PI / 4));
  const bras = [];
  for (const s of [-1, 1]) {
    const b = groupe(s * 0.43, 1.74, 0);
    b.add(pose(bloc(0.2, 0.5, 0.22, VESTE, 0.02), 0, -0.24, 0));
    b.add(pose(bloc(0.16, 0.4, 0.17, PEAU, 0.02), 0, -0.64, 0));
    b.add(pose(bloc(0.19, 0.18, 0.2, PEAU, 0.03), 0, -0.9, 0.01));
    corps.add(b); bras.push(b);
  }
  // pouce (visible seulement pour le geste « pouce levé »)
  const pouce = pose(bloc(0.07, 0.16, 0.07, PEAU, 0.01), 0, -1.04, 0.02); bras[1].add(pouce); pouce.visible = false;
  corps.add(pose(new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.2, 6), mat(PEAU)), 0, 1.88, 0));
  const tete = groupe(0, 2.25, 0);
  const gc = facettes(new THREE.BoxGeometry(0.68, 0.76, 0.66, 3, 3, 3), 0.03, 0.45);
  { const p = gc.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); const k = y < 0 ? 1 + y * 0.75 : 1 - y * 0.12; p.setX(i, p.getX(i) * k); if (y < -0.1) p.setZ(i, p.getZ(i) * (1 + y * 0.35) + 0.03); } gc.computeVertexNormals(); }
  tete.add(ombre(new THREE.Mesh(gc, mat(PEAU))));
  tete.add(pose(bloc(0.26, 0.1, 0.3, PEAU, 0.02), 0, -0.37, 0.06));
  for (const s of [-1, 1]) tete.add(pose(bloc(0.08, 0.17, 0.12, "#dda27c", 0.02), s * 0.36, -0.02, -0.02));
  const yeux = [], sourcils = [];
  for (const s of [-1, 1]) {
    const oeil = groupe(s * 0.14, 0.03, 0.335);
    oeil.add(pose(bloc(0.15, 0.17, 0.03, "#fbf6ee", 0), 0, 0, 0));
    oeil.add(pose(bloc(0.09, 0.12, 0.03, "#3b2a1e", 0), s * -0.005, -0.005, 0.012));
    oeil.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.02), mat("#ffffff", 1)), 0.02, 0.025, 0.03));
    tete.add(oeil); yeux.push(oeil);
    const sc = groupe(s * 0.14, 0.15, 0.345); sc.add(bloc(0.17, 0.045, 0.04, "#4a2814", 0)); tete.add(sc); sourcils.push(sc);
  }
  tete.add(pose(new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 4), mat("#e0a07a")), 0, -0.08, 0.36, Math.PI / 2, Math.PI / 4, 0));
  // bouche : barre centrale + deux coins orientables (sourire / moue)
  const bouche = groupe(0, -0.21, 0.335);
  const centre = bloc(0.1, 0.035, 0.03, "#6e2a24", 0); bouche.add(centre);
  const coins = [-1, 1].map((s) => { const c = groupe(s * 0.05, 0, 0); c.add(pose(bloc(0.05, 0.035, 0.03, "#6e2a24", 0), s * 0.022, 0, 0)); bouche.add(c); return c; });
  tete.add(bouche);
  for (const [x, y] of [[-0.2, -0.08], [-0.16, -0.1], [-0.22, -0.11], [0.2, -0.08], [0.16, -0.1], [0.22, -0.11]])
    tete.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.018, 0.01), mat("#b8714f")), x, y, 0.335));
  const calotte = ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(0.76, 0.34, 0.74, 3, 1, 3), 0.05, 0.3), mat(CHEV)));
  calotte.position.set(0, 0.29, -0.02); tete.add(calotte);
  tete.add(pose(bloc(0.74, 0.42, 0.18, CHEV, 0.05, 2), 0, 0.06, -0.3));
  for (const s of [-1, 1]) tete.add(pose(bloc(0.1, 0.32, 0.5, CHEV, 0.04), s * 0.36, 0.12, -0.08));
  const meches = [[-0.25, 0.42, 0.2, -0.5, 0.4], [-0.05, 0.5, 0.25, -0.7, 0.1], [0.18, 0.46, 0.22, -0.6, -0.3], [0.3, 0.38, 0.05, -0.2, -0.6],
    [-0.3, 0.4, -0.15, 0.3, 0.6], [0.0, 0.52, -0.1, 0.2, 0], [0.22, 0.45, -0.25, 0.4, -0.4], [-0.12, 0.48, 0.05, -0.2, 0.3], [0.1, 0.5, 0.0, 0, -0.2],
    [-0.2, 0.28, 0.33, -1.2, 0.2], [0.08, 0.3, 0.35, -1.25, -0.15], [0.26, 0.26, 0.3, -1.1, -0.4]];
  for (const [x, y, z, rx, rz] of meches) tete.add(pose(ombre(new THREE.Mesh(facettes(new THREE.ConeGeometry(0.15, 0.42, 4, 1), 0.02), mat(alea() > 0.5 ? CHEV : "#7a4626"))), x, y, z, rx, alea(), rz));
  corps.add(tete);
  // lanterne tenue dans la main gauche
  const lanterne = groupe(0, -1.12, 0.05);
  const verre = pose(bloc(0.2, 0.26, 0.2, "#ffcf7a", 0.01), 0, -0.1, 0); verre.material = mat("#ffcf7a", 1.6); verre.castShadow = false;
  lanterne.add(verre, pose(bloc(0.26, 0.05, 0.26, "#2b2b2b", 0), 0, 0.05, 0), pose(bloc(0.03, 0.12, 0.03, "#2b2b2b", 0), 0, 0.12, 0));
  const flamme = new THREE.PointLight("#ffb257", 10, 9, 1.4); flamme.position.set(0, -0.05, 0.25); lanterne.add(flamme);
  bras[0].add(lanterne);
  g.userData = { corps, tete, bras, jambes, yeux, sourcils, bouche, centre, coins, pouce, lanterne, verre, flamme };
  return g;
}

/* ---------- Roger ---------- */
function creerRoger() {
  const g = new THREE.Group(), ROUX = "#c27a3a", CREME = "#f0dcc0";
  const corps = groupe(); g.add(corps);
  corps.add(pose(bloc(0.8, 0.42, 0.44, ROUX, 0.04, 2), 0, 0.55, 0));
  corps.add(pose(bloc(0.5, 0.2, 0.4, CREME, 0.03), 0.05, 0.4, 0));
  const pattes = [];
  for (const [x, z] of [[-0.28, -0.14], [-0.28, 0.14], [0.28, -0.14], [0.28, 0.14]]) { const p = groupe(x, 0.4, z); p.add(pose(bloc(0.13, 0.4, 0.13, "#a8662f", 0.02), 0, -0.2, 0)); corps.add(p); pattes.push(p); }
  const tete = groupe(0.5, 0.92, 0);
  tete.add(ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(0.44, 0.42, 0.42, 2, 2, 2), 0.04, 0.35), mat(ROUX))));
  tete.add(pose(bloc(0.26, 0.2, 0.26, CREME, 0.03), 0.27, -0.08, 0));
  tete.add(pose(bloc(0.09, 0.08, 0.1, "#1b1410", 0.01), 0.42, -0.02, 0));
  const oreilles = [];
  for (const s of [-1, 1]) {
    tete.add(pose(bloc(0.07, 0.09, 0.03, "#1b1410", 0), 0.14, 0.07, s * 0.2));
    const o = groupe(-0.04, 0.17, s * 0.24); o.add(pose(bloc(0.14, 0.3, 0.07, "#6e3d1c", 0.03), 0, -0.15, 0)); o.rotation.x = s * 0.2; tete.add(o); oreilles.push(o);
  }
  corps.add(tete);
  corps.add(pose(new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.22, 3), mat("#c8342b")), 0.42, 0.64, 0, 0, 0, Math.PI));
  const queue = groupe(-0.4, 0.68, 0); queue.add(pose(bloc(0.08, 0.36, 0.08, ROUX, 0.02), 0, 0.16, 0)); queue.rotation.z = 0.7; corps.add(queue);
  g.userData = { corps, tete, pattes, queue, oreilles };
  return ombre(g);
}

/* ---------- Décor du camping (axe x : entrée -10 → caravane +11) ---------- */
const sol = new THREE.Mesh(facettes(new THREE.PlaneGeometry(80, 50, 50, 30), 0.15), mat("#2f4d2c"));
sol.rotation.x = -Math.PI / 2; sol.receiveShadow = true; scene.add(sol);
const chemin = new THREE.Mesh(facettes(new THREE.PlaneGeometry(30, 1.8, 30, 2), 0.05), mat("#6b5338"));
chemin.rotation.x = -Math.PI / 2; chemin.position.set(0.5, 0.02, 1.3); chemin.receiveShadow = true; scene.add(chemin);

function sapin(x, z, h) {
  const g = groupe(x, 0, z);
  g.add(pose(bloc(0.18, 0.6, 0.18, "#4a2f1c", 0.02), 0, 0.3, 0));
  for (let i = 0; i < 3; i++) g.add(pose(ombre(new THREE.Mesh(facettes(new THREE.ConeGeometry(0.9 - i * 0.22, 1.1, 6, 1), 0.08), mat(i % 2 ? "#1f4a32" : "#245a3a"))), 0, 0.9 + i * 0.6, 0));
  g.scale.setScalar(h); g.rotation.y = alea() * 3; return g;
}
[[-13, -3, 2], [-7.5, -4, 2.3], [-3, -6, 2.6], [1, -4.5, 2], [3.5, -7, 2.8], [8, -4.5, 2.2], [13.5, -3, 2.4], [-16, -8, 3], [16, -8, 3], [-10, -10, 3.2], [6, -11, 3.4], [-1, -12, 3.5], [11, -12, 3], [-14, 4, 1.6], [15, 4, 1.8]]
  .forEach(([x, z, h]) => scene.add(sapin(x, z, h)));

// Entrée : piliers, portail (rouillé → neuf), panneau (par terre → en haut)
const entree = groupe(-10, 0, 0); scene.add(entree);
for (const x of [-1.7, 1.7]) { entree.add(pose(bloc(0.6, 2.4, 0.6, "#8f8a80", 0.06, 2), x, 1.2, 0)); entree.add(pose(bloc(0.75, 0.2, 0.75, "#a29d93", 0.04), x, 2.5, 0)); }
const portail = [];
for (const s of [-1, 1]) {
  const v = groupe(s * 1.4, 0, 0); entree.add(v);
  const barres = [];
  v.add(pose(bloc(1.4, 0.1, 0.08, "#7a4a2a", 0.01), -s * 0.7, 1.75, 0), pose(bloc(1.4, 0.1, 0.08, "#7a4a2a", 0.01), -s * 0.7, 0.45, 0));
  for (let i = 0; i < 6; i++) { const b = pose(bloc(0.07, 1.6, 0.07, "#7a4a2a", 0.01), -s * (0.12 + i * 0.23), 1.15, 0); v.add(b); barres.push(b); }
  portail.push({ v, s, barres });
}
const texPanneauVieux = texteTexture([["CAMPING", 40, 50], ["LES PINS PERDUS", 56, 110]], "#8a7a62", "#4a3c2b");
const texPanneauNeuf = texteTexture([["CAMPING", 40, 50], ["LES PINS PERDUS", 56, 110]], "#f6ecd2", "#1f4d3a");
const panneau = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.95, 0.1), [mat("#5b4c38"), mat("#5b4c38"), mat("#5b4c38"), mat("#5b4c38"), new THREE.MeshStandardMaterial({ map: texPanneauVieux, roughness: 0.9 }), mat("#5b4c38")]);
panneau.castShadow = true; entree.add(panneau);
const poteaux = [-1.2, 1.2].map((x) => { const p = pose(bloc(0.12, 1, 0.12, "#6b4a2f", 0.01), x, 2.6, -0.1); entree.add(p); return p; });

// Emplacements : piquets numérotés + ronces
const ronces = [];
for (let i = 0; i < 5; i++) {
  const x = -6 + i * 1.9;
  scene.add(pose(bloc(0.1, 0.7, 0.1, "#7a5636", 0.01), x, 0.35, 2.4));
  const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.26, 0.05), [mat("#ddd"), mat("#ddd"), mat("#ddd"), mat("#ddd"), new THREE.MeshStandardMaterial({ map: texteTexture([[String(i * 6 + 1).padStart(2, "0"), 110, 80]], "#f6ecd2", "#1d1a2b", 200, 140) }), mat("#ddd")]);
  plaque.position.set(x, 0.75, 2.43); scene.add(plaque);
}
for (let i = 0; i < 10; i++) {
  const g = groupe(-6.6 + i * 1.0 + alea() * 0.4, 0, -0.3 + alea() * 1.6);
  for (let k = 0; k < 4; k++) {
    const r = 0.45 + alea() * 0.4;
    g.add(pose(ombre(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(r, 0), 0.12), mat(k % 2 ? "#2d3b22" : "#3a4a28"))), (alea() - 0.5) * 0.9, r * 0.8, (alea() - 0.5) * 0.7));
  }
  for (let k = 0; k < 3; k++) g.add(pose(new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), mat("#6b2a7b")), (alea() - 0.5) * 0.8, 0.5 + alea() * 0.6, 0.45));
  scene.add(g); ronces.push(g);
}
// poussière du débroussaillage
const poussiere = [];
for (let i = 0; i < 14; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), new THREE.MeshStandardMaterial({ color: "#c9b48e", transparent: true, opacity: 0, flatShading: true })); scene.add(m); poussiere.push(m); }

// Bloc douches
const douches = groupe(5, 0, -0.5); scene.add(douches);
const murMat = mat("#a39880"), carMat = mat("#7d7464"), toitMat = mat("#5c5248");
const mur = ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(4.4, 2.6, 2.8, 4, 2, 2), 0.05), murMat)); mur.position.y = 1.3; douches.add(mur);
const carrelage = pose(new THREE.Mesh(new THREE.BoxGeometry(4.45, 0.6, 2.85), carMat), 0, 0.3, 0); douches.add(carrelage);
douches.add(pose(ombre(new THREE.Mesh(facettes(new THREE.BoxGeometry(4.9, 0.25, 3.3, 3, 1, 2), 0.05), toitMat)), 0, 2.72, 0));
const porte = pose(bloc(0.8, 1.7, 0.08, "#6b5a45", 0.01), -1.2, 0.85, 1.42); douches.add(porte);
const fenetreMat = mat("#2a2f38"); const fenetre = pose(new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 0.06), fenetreMat), 0.8, 1.7, 1.42); douches.add(fenetre);
const lumDouche = new THREE.PointLight("#ffd59a", 0, 6, 1.5); lumDouche.position.set(0.8, 1.7, 2.2); douches.add(lumDouche);
const enseigne = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 0.06), [mat("#555"), mat("#555"), mat("#555"), mat("#555"), new THREE.MeshStandardMaterial({ map: texteTexture([["DOUCHES", 90, 80]], "#1f6fae", "#ffffff", 512, 150) }), mat("#555")]);
enseigne.position.set(0.3, 2.3, 1.45); douches.add(enseigne);
const fissures = groupe(); douches.add(fissures);
for (const [x, y, rz, l] of [[-0.3, 1.9, 0.4, 0.6], [-0.15, 1.45, -0.5, 0.5], [-0.3, 1.05, 0.3, 0.5], [1.7, 0.9, -0.6, 0.5], [1.85, 0.5, 0.4, 0.4]]) fissures.add(pose(new THREE.Mesh(new THREE.BoxGeometry(0.05, l, 0.03), mat("#2a231c")), x, y, 1.43, 0, 0, rz));
for (const [x, z] of [[-1.9, 1.3], [1.6, 1.35]]) fissures.add(pose(new THREE.Mesh(facettes(new THREE.IcosahedronGeometry(0.35, 0), 0.08), mat("#3f5a2c")), x, 0.15, z));

  const B1 = (x, y, txt, c, o) => bulle(clamp(x, 200, 880), clamp(y, 330, 1250), txt, c, TRAIT, o);
  s += B1(mx, my, "C'EST TOI", "#ffc93c", vis(t, 0.4, 2.6, 0.2));
  s += B1(mx, my, "AÏE…", "#fff6e3", vis(t, P("presque") - 2.4, P("presque") - 0.3, 0.2));
  s += B1(mx, my, "SÉRIEUX ?!", "#fff6e3", vis(t, P("p1", 1.2), P("calc1") - 0.1, 0.2));
  s += B1(mx, my, "ELLE EST CHAUDE !", "#fff6e3", vis(t, P("ok"), P("ok", 1.5), 0.2));
  if (roger.visible) {
    s += B1(rx, ry, "ROGER", "#4ade80", vis(t, P("roger", 1.0), P("wouf"), 0.2));
    s += B1(rx, ry, "WOUF.", "#fff6e3", vis(t, P("wouf", 1.4), FP("wouf") + 0.3, 0.2));
    s += B1(rx, ry, "WOUF ! ✔", "#4ade80", vis(t, P("ok", 1.3), P("bilan"), 0.2));
  }
  return s;
}
function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35);
  if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c" opacity=".55"/>
    <text x="540" y="470" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#4ade80" letter-spacing="6" stroke="${TRAIT}" stroke-width="8" paint-order="stroke">LES PINS PERDUS</text>
    <text x="540" y="575" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="#fff6e3" stroke="${TRAIT}" stroke-width="14" paint-order="stroke">ÉPISODE 2</text>
    <text x="540" y="675" text-anchor="middle" font-family="Inter" font-weight="900" font-size="96" fill="#ffc93c" stroke="${TRAIT}" stroke-width="14" paint-order="stroke">BIENTÔT</text>
    <g transform="translate(540,1560)"><rect x="-340" y="-44" width="680" height="88" rx="44" fill="${TRAIT}" transform="translate(5,7)"/><rect x="-340" y="-44" width="680" height="88" rx="44" fill="#ff3b5c" stroke="#fff6e3" stroke-width="4"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#fff">+ ABONNE-TOI POUR LA SUITE</text></g></g>`;
}
function interface_(t) {
  let s = `<defs><linearGradient id="bas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity="0"/><stop offset="1" stop-color="#05070f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="haut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity=".45"/><stop offset="1" stop-color="#05070f" stop-opacity="0"/></linearGradient></defs>
    <rect x="0" y="1180" width="1080" height="740" fill="url(#bas)"/><rect x="0" y="0" width="1080" height="320" fill="url(#haut)"/>`;
  s += bulles(t) + hud(t) + puce(t);
  s += carteCalcul(t, P("calc1"), P("p2", 0.2), [["PORTAIL NEUF", "2 500 €"], ["PANNEAU REPEINT", "1 500 €"]], "4 000 €", 1);
  s += carteCalcul(t, P("calc2"), P("p3", 0.2), [["DÉBROUSSAILLEUSE", "300 €"], ["BENNE × 2", "900 €"], ["3 JOURS DE BOULOT", "1 300 €"]], "2 500 €", 2);
  s += carteCalcul(t, P("calc3"), P("verif", 0.2), [["PLOMBERIE", "14 000 €"], ["CARRELAGE", "12 000 €"], ["CHAUFFE-EAU", "8 000 €"]], "34 000 €", 3);
  s += liste(t) + choix(t) + sousTitres(t);
  s += `<text x="1040" y="1868" text-anchor="end" font-family="Inter" font-weight="800" font-size="24" fill="#ffffff" opacity=".55" letter-spacing="2">LES PINS PERDUS · ÉP. 1</text>`;
  for (const ft of FLASHS) { const o = 0.6 * clamp(1 - (t - ft) / 0.3); if (t >= ft && o > 0) s += `<rect width="1080" height="1920" fill="#fff6e3" opacity="${o.toFixed(3)}"/>`; }
  s += carteFin(t);
  document.getElementById("ui").innerHTML = s;
}

/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt);
  const { pos, cib, fov } = plan(t); camera.position.copy(pos); camera.lookAt(cib); if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;
await document.fonts.ready;
window.pret = true;
if (!document.body.classList.contains("rendu") && !location.search.includes("rendu")) {
  rendre(0.5);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => {
    btn.remove(); voix.currentTime = 0; voix.play().catch(() => {});
    const debut = performance.now();
    const boucle = () => { const t = (performance.now() - debut) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); };
    requestAnimationFrame(boucle);
  };
} else document.body.classList.add("rendu");
</script>
