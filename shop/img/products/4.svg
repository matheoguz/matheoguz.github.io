<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- Jar body -->
  <rect x="140" y="180" width="120" height="130" rx="10" fill="#a29bfe" opacity="0.5"/>
  <rect x="145" y="185" width="110" height="120" rx="8" fill="#1a1a24" opacity="0.4"/>
  <!-- Jar lid area -->
  <rect x="148" y="170" width="104" height="18" rx="4" fill="#a29bfe" opacity="0.7"/>
  <!-- Electric opener device on top -->
  <rect x="155" y="110" width="90" height="65" rx="20" fill="#6C5CE7"/>
  <rect x="165" y="118" width="70" height="48" rx="14" fill="#a29bfe" opacity="0.4"/>
  <!-- Button on device -->
  <circle cx="200" cy="140" r="10" fill="#00CEC9" filter="url(#glow4)"/>
  <circle cx="200" cy="140" r="6" fill="#81ecec"/>
  <!-- Power indicator -->
  <rect x="190" y="155" width="20" height="3" rx="1.5" fill="#00CEC9" opacity="0.8"/>
  <!-- Grip lines on jar -->
  <line x1="155" y1="220" x2="245" y2="220" stroke="#a29bfe" stroke-width="1" opacity="0.3"/>
  <line x1="155" y1="240" x2="245" y2="240" stroke="#a29bfe" stroke-width="1" opacity="0.3"/>
  <line x1="155" y1="260" x2="245" y2="260" stroke="#a29bfe" stroke-width="1" opacity="0.3"/>
  <!-- Bottom shadow -->
  <ellipse cx="200" cy="315" rx="65" ry="8" fill="#6C5CE7" opacity="0.15" filter="url(#glow4)"/>
</svg>