  if (oR > 0) s += `<g opacity="${oR}" transform="translate(540,452)"><rect x="-170" y="-18" width="340" height="36" rx="18" fill="#121828" stroke="#ff3b5c" stroke-width="3"/><text x="0" y="7" text-anchor="middle" font-family="Inter" font-weight="900" font-size="19" fill="#ffffff">❤ 1 LIKE / 1 ABONNÉ = +1 €</text></g>`;
  return s;
}
function titre(t) {
  const o = vis(t, 0.05, 1.9, 0.2); if (o <= 0) return "";
  const k = 0.85 + 0.15 * easeIO(clamp(t / 0.25));
  return `<g opacity="${o}" transform="translate(540,560) scale(${k})" font-family="Inter" font-weight="900" text-anchor="middle" stroke="#0b1020" stroke-width="12" paint-order="stroke" stroke-linejoin="round">
    <text x="0" y="0" font-size="56" fill="#ffc93c">ÉPISODE 2</text><text x="0" y="100" font-size="96" fill="#ffffff">LA PISCINE</text></g>`;
}
function sondage(t) {
  const o = vis(t, 1.95, P("regle", -0.1), 0.25); if (o <= 0) return "";
  return `<g opacity="${o}" transform="translate(540,${720 + (1 - o) * 30})"><rect x="-386" y="-155" width="772" height="310" rx="26" fill="#000" opacity=".35" transform="translate(6,8)"/>
    <clipPath id="clipS"><rect x="-386" y="-155" width="772" height="310" rx="26"/></clipPath><image href="${SONDAGE}" x="-386" y="-155" width="772" height="303" clip-path="url(#clipS)" preserveAspectRatio="xMidYMid slice"/></g>`;
}
function carteRegle(t) {
  const o = vis(t, P("regle"), P("budget", 0.6), 0.25); if (o <= 0) return "";
  const og = clamp((t - P("chiffres")) / 0.3);
  return `<g opacity="${o}" transform="translate(540,${640 + (1 - o) * -30}) scale(${0.85 + 0.15 * o})">
    <rect x="-300" y="-120" width="600" height="${og > 0 ? 300 : 230}" rx="24" fill="#121828" stroke="#ffc93c" stroke-width="7"/>
    <text x="0" y="-62" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#ffc93c" letter-spacing="2">NOUVELLE RÈGLE</text>
    <text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#ffffff"><tspan fill="#ff3b5c">❤</tspan> 1 LIKE = +1 €</text>
    <text x="0" y="60" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#ffffff"><tspan fill="#4ade80">+</tspan> 1 ABONNÉ = +1 €</text>
    ${og > 0 ? `<g opacity="${og}"><line x1="-240" y1="96" x2="240" y2="96" stroke="#3a4258" stroke-width="3"/><text x="0" y="148" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#4ade80">67 + 118 = +185 €</text></g>` : ""}</g>`;
}
function puce(t) {
  let s = "";

  if (o > 0) s += `<g opacity="${o}" transform="translate(540,505) scale(${0.85 + 0.15 * o})"><rect x="-140" y="-26" width="280" height="50" rx="12" fill="#ffffff"/><text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="900" font-size="28" fill="#1b1b1b"><tspan fill="#ff5a5f">1.</tspan> LA PISCINE</text></g>`;

  return s;
}
const ETIQUETTES = [["FISSURÉE", "degats", 0.3, "travaux1", 640], ["TUYAUX MORTS", "degats", 1.6, "travaux1", 730], ["???", "boite", 0.2, "calc1", 640], ["12 MOBIL-HOMES…", "douze", 0.6, "budget2", 640]];
function etiquettes(t) {
  let s = "";
  for (const [txt, a, d, b, y] of ETIQUETTES) {
    const o = vis(t, P(a, d), P(b), 0.15); if (o <= 0) continue;
    const w = txt.length * 26 + 50, k = 1 + 0.4 * (1 - easeIO(clamp((t - P(a, d)) / 0.18)));

function cahier(t, a, b, titre, lignes, total, rot = -2.5) {
  const o = vis(t, a, b, 0.25); if (o <= 0) return "";
  const h = 120 + lignes.length * 56 + (total ? 70 : 0);

    <rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#000" opacity=".25" transform="translate(8,10)"/>
    <rect x="-300" y="0" width="600" height="${h}" rx="6" fill="#fbf7ec"/>`;
  for (let y = 70; y < h; y += 56) s += `<line x1="-300" y1="${y}" x2="300" y2="${y}" stroke="#cdd9ee" stroke-width="2"/>`;
  s += `<line x1="-240" y1="0" x2="-240" y2="${h}" stroke="#ef9a9a" stroke-width="3"/><text x="0" y="52" text-anchor="middle" font-family="Inter" font-weight="900" font-size="32" fill="#1b1b1b" letter-spacing="2">${titre}</text>`;
  lignes.forEach(([lab, val, coche], i) => {
    const oi = clamp((t - a - 0.3 - i * 0.4) / 0.2), y = 116 + i * 56;
    s += `<g opacity="${oi}"><text x="-222" y="${y}" font-family="Inter" font-weight="800" font-size="27" fill="#2b2b2b">${lab}</text><text x="272" y="${y}" text-anchor="end" font-family="Inter" font-weight="900" font-size="28" fill="#2b2b2b">${val}</text>
      ${coche ? `<path d="M210 ${y - 14} l 14 16 l 30 -34" stroke="#22a55a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${clamp((t - coche) / 0.2)}"/>` : ""}</g>`;
  });
  if (total) { const ot = clamp((t - a - 0.3 - lignes.length * 0.4) / 0.2), yt = 116 + lignes.length * 56 + 6;
    s += `<g opacity="${ot}"><line x1="-222" y1="${yt - 36}" x2="272" y2="${yt - 36}" stroke="#1b1b1b" stroke-width="3"/><text x="-222" y="${yt + 4}" font-family="Inter" font-weight="900" font-size="28" fill="#e23b3b">TOTAL</text><text x="272" y="${yt + 4}" text-anchor="end" font-family="Inter" font-weight="900" font-size="32" fill="#e23b3b">${total}</text></g>`; }
  return s + `</g>`;
}

function carteMot(t) {
  const o = vis(t, P("mot", -0.2), P("budget2", 0.2), 0.3); if (o <= 0) return "";
  return `<g opacity="${o}" transform="translate(540,${650 + (1 - o) * -30}) rotate(-3) scale(${0.85 + 0.15 * o})">
    <rect x="-280" y="-130" width="560" height="260" rx="8" fill="#000" opacity=".3" transform="translate(8,10)"/>

    <text x="230" y="95" text-anchor="end" font-family="Liberation Serif, serif" font-style="italic" font-size="30" fill="#6b5236">— ton grand-oncle</text></g>`;
}
function choix(t) {
  const a = P("choix"), b = DUREE - 2.6; let s = "";
  const carte = (cx, titre, sous, col, ic, o) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},640) scale(${0.8 + 0.2 * o})"><rect x="-200" y="-120" width="400" height="240" rx="24" fill="#121828" stroke="${col}" stroke-width="7"/>${ic}
    <text x="0" y="58" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="${col}">${titre}</text><text x="0" y="96" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#b9c0d0" letter-spacing="2">${sous}</text></g>`;
  const panneau = `<g transform="translate(0,-42)"><rect x="-80" y="-34" width="160" height="62" rx="10" fill="#2e8b57"/><text x="0" y="8" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff">OUVERT</text></g>`;
  const mystere = `<g transform="translate(0,-42)"><rect x="-80" y="-34" width="160" height="62" rx="10" fill="#3a2a18"/><text x="0" y="12" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="#ffc93c">13 ?</text></g>`;
  s += carte(285, "OUVRIR", "4 MOBIL-HOMES", "#4ade80", panneau, vis(t, a, b, 0.25));
  s += carte(795, "BUNGALOW 13", "LE MYSTÈRE", "#ffc93c", mystere, vis(t, P("choix2"), b, 0.25));
  const oo = vis(t, P("choix2", -0.3), b, 0.2); if (oo > 0) s += `<g opacity="${oo}"><circle cx="540" cy="640" r="44" fill="#ffffff"/><text x="540" y="654" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#1b1b1b">OU</text></g>`;
  const oc = vis(t, P("comment"), b, 0.25); if (oc > 0) s += `<g opacity="${oc}" transform="translate(540,860) scale(${0.85 + 0.15 * oc})"><rect x="-380" y="-38" width="760" height="76" rx="38" fill="#ff3b5c"/><text x="0" y="13" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff">ÉCRIS « OUVRIR » OU « BUNGALOW »</text></g>`;
  return s;
}
function sousTitres(t) {
  const c = CHUNKS.find((k) => t >= k.t0 && t < k.t1);
  if (!c || t > FIN_VOIX + 0.3) return "";
  const pop = 0.92 + 0.08 * easeIO(clamp((t - c.t0) / 0.1));
  const COUL = { w: "#ffffff", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#4fa3ff" };
  const sp = c.map((w) => `<tspan fill="${t >= w.t ? COUL[w.c] : "#9a9089"}">${w.txt.toUpperCase()}</tspan>`).join(" ");
  const MES = sousTitres.c || (sousTitres.c = document.createElement("canvas").getContext("2d")); MES.font = "900 64px Inter";
  const larg = MES.measureText(c.map((w) => w.txt.toUpperCase()).join(" ")).width + 20;
  const k = Math.min(1, 1000 / larg);
  return `<g transform="translate(540,1330) scale(${pop * k})"><text x="3" y="4" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" fill="#000" opacity=".35" letter-spacing="1">${c.map((w) => w.txt.toUpperCase()).join(" ")}</text><text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" font-size="64" letter-spacing="1">${sp}</text></g>`;
}

function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35); if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#0b0f1c" opacity=".88"/>
    <text x="540" y="760" text-anchor="middle" font-family="Inter" font-weight="900" font-size="38" fill="#4ade80" letter-spacing="6">LES PINS PERDUS · SAISON 1</text>
    <text x="540" y="860" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffffff">ÉPISODE 3</text>
    <text x="540" y="950" text-anchor="middle" font-family="Inter" font-weight="900" font-size="88" fill="#ffc93c">BIENTÔT</text>
    <g transform="translate(540,1120)"><rect x="-360" y="-44" width="720" height="88" rx="44" fill="#ff3b5c"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#fff">+ ABONNE-TOI = +1 € POUR LE CAMPING</text></g></g>`;
}
const FLASHS = [FP("calc1"), P("plein"), P("billets", 0.2)];
function interface_(t) {
  let s = "";
  const [mx, my] = ecran(malo, 3.6), [rx, ry] = ecran(roger, 1.6);
  const Bb = (x, y, txt, c, o) => bulle(clamp(x, 200, 860), clamp(y, 560, 1000), txt, c, o);
  s += Bb(rx, ry, "WOUF ! WOUF !", "#ffffff", vis(t, P("creuse", 0.4), P("boite"), 0.2));
  s += Bb(mx, my, "?!", "#ffffff", vis(t, P("boite", 0.2), P("calc1", -0.3), 0.2));
  s += Bb(mx, my, "ZÉRO FUITE !", "#4ade80", vis(t, P("plein", 0.2), P("refus"), 0.2));

}

/* ---------- Bruitages ---------- */
const EVENEMENTS = [];
const ev = (t, type, d = 0) => { if (t >= 0) EVENEMENTS.push({ t: +t.toFixed(3), type, d }); };
[1.95, P("regle"), P("calc1"), P("mot"), P("choix"), P("comment")].forEach((t) => ev(t, "pop"));
ev(P("creuse", 0.4), "wouf"); ev(P("refus", 0.4), "wouf");
SAUTS.forEach(([t]) => ev(t, "kaching"));
ev(P("verif", 0.6), "eau", 2.5); ev(P("vide"), "eau", 1.5);
ev(P("plein"), "ding"); ev(P("serrure", 0.5), "tampon");
ev(P("travaux2"), "moteur", 2.5);
ev(DUREE - 2.6, "fin");
window.EVENEMENTS = EVENEMENTS;

/* ---------- Rendu ---------- */
let tPrec = 0;
function rendre(t) {
  const dt = Math.max(0, Math.min(0.1, t - tPrec)) || 1 / 30; tPrec = t;
  ambiance(t); decor(t); animerMalo(t, dt); animerRoger(t, dt);
  const c = plan(t), yc = 1.05 / c.z;
  camera.zoom = c.z; camera.updateProjectionMatrix();
  camera.position.set(c.x, yc + 7, 40); camera.lookAt(c.x, yc, 0);
  fond.position.set(c.x, yc + 10, -90); etoiles.position.set(c.x * 0.9, 0, 0);
  lune.position.set(c.x + 2.6 / c.z, yc + 5.5 / c.z, -80); lune.scale.setScalar(1 / c.z);
  const j = jourDe(t); soleilDisque.position.set(c.x - 2.4 / c.z, yc + lerp(-3, 5.8, ease(j, 0.2, 0.8)) / c.z, -80); soleilDisque.scale.setScalar(1 / c.z); soleilDisque.visible = j > 0.75;
  arriere.position.x = c.x * 0.35;
  luneL.target.position.set(c.x, 0, 0); face.target.position.set(c.x, -2, 0); face.position.set(c.x, 2, 40); luneL.position.set(c.x - 8, 14, 12); soleil.target.position.set(c.x, 0, 0); soleil.position.set(c.x - 10, 14, 10);
  renderer.render(scene, camera);
  interface_(t);
}
window.rendre = rendre; window.DUREE = DUREE;
await document.fonts.ready;
window.pret = true;
if (!location.search.includes("rendu")) {
  rendre(0.3);
  const voix = document.getElementById("voix"), btn = document.getElementById("lecture");
  btn.onclick = () => { btn.remove(); voix.currentTime = 0; voix.play().catch(() => {}); const d0 = performance.now();
    const boucle = () => { const t = (performance.now() - d0) / 1000; rendre(Math.min(t, DUREE)); if (t < DUREE) requestAnimationFrame(boucle); }; requestAnimationFrame(boucle); };
} else document.body.classList.add("rendu");
</script>
