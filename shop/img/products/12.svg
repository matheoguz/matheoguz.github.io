<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="wall12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#EEEEEE"/>
    </linearGradient>
    <linearGradient id="holder12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="sneaker12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="heel12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="dress12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <filter id="shoeShad12">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="#E3F2FD"/>

  <!-- Wall -->
  <rect x="40" y="30" width="320" height="340" rx="4" fill="url(#wall12)"/>

  <!-- Row 1: Sneakers -->
  <!-- Left holder -->
  <g filter="url(#shoeShad12)">
    <rect x="70" y="88" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 130 92)"/>
    <rect x="68" y="80" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Left sneaker -->
  <g filter="url(#shoeShad12)" transform="translate(85, 50) rotate(-12)">
    <path d="M0 30 Q0 10 15 5 L55 0 Q70 0 75 10 L80 20 Q82 28 75 30 L0 30 Z" fill="url(#sneaker12)"/>
    <path d="M0 30 L80 30 Q82 38 75 40 L-2 40 Q-5 38 0 30 Z" fill="#F5F5F5"/>
    <circle cx="60" cy="15" r="3" fill="#FFF" opacity="0.5"/>
    <circle cx="50" cy="12" r="3" fill="#FFF" opacity="0.5"/>
    <line x1="10" y1="28" x2="70" y2="28" stroke="#0D47A1" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Right holder -->
  <g filter="url(#shoeShad12)">
    <rect x="210" y="88" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 270 92)"/>
    <rect x="208" y="80" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Right sneaker -->
  <g filter="url(#shoeShad12)" transform="translate(225, 50) rotate(-12)">
    <path d="M0 30 Q0 10 15 5 L55 0 Q70 0 75 10 L80 20 Q82 28 75 30 L0 30 Z" fill="url(#sneaker12)"/>
    <path d="M0 30 L80 30 Q82 38 75 40 L-2 40 Q-5 38 0 30 Z" fill="#F5F5F5"/>
    <circle cx="60" cy="15" r="3" fill="#FFF" opacity="0.5"/>
    <circle cx="50" cy="12" r="3" fill="#FFF" opacity="0.5"/>
    <line x1="10" y1="28" x2="70" y2="28" stroke="#0D47A1" stroke-width="1" opacity="0.3"/>
    <!-- Nike-like swoosh -->
    <path d="M15 22 Q35 15 65 8" fill="none" stroke="#FFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Row 2: Red heels -->
  <!-- Left holder -->
  <g filter="url(#shoeShad12)">
    <rect x="70" y="198" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 130 202)"/>
    <rect x="68" y="190" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Left heel -->
  <g filter="url(#shoeShad12)" transform="translate(90, 155) rotate(-12)">
    <path d="M0 35 Q2 15 20 8 L50 0 Q60 0 65 8 L68 20 Q68 28 60 35 L0 35 Z" fill="url(#heel12)"/>
    <!-- Heel spike -->
    <path d="M5 35 L0 55 L8 55 L12 35" fill="#C62828"/>
    <path d="M30 2 Q35 -5 40 2" fill="none" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Right holder -->
  <g filter="url(#shoeShad12)">
    <rect x="210" y="198" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 270 202)"/>
    <rect x="208" y="190" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Right heel -->
  <g filter="url(#shoeShad12)" transform="translate(230, 155) rotate(-12)">
    <path d="M0 35 Q2 15 20 8 L50 0 Q60 0 65 8 L68 20 Q68 28 60 35 L0 35 Z" fill="url(#heel12)"/>
    <path d="M5 35 L0 55 L8 55 L12 35" fill="#C62828"/>
    <path d="M30 2 Q35 -5 40 2" fill="none" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Row 3: Dress shoes -->
  <!-- Left holder -->
  <g filter="url(#shoeShad12)">
    <rect x="70" y="308" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 130 312)"/>
    <rect x="68" y="300" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Left dress shoe -->
  <g filter="url(#shoeShad12)" transform="translate(85, 268) rotate(-12)">
    <path d="M0 28 Q0 8 20 3 L60 0 Q80 2 85 12 L88 22 Q88 30 80 32 L0 32 Z" fill="url(#dress12)"/>
    <path d="M0 32 L88 32 Q88 36 85 38 L-2 38 Q-2 36 0 32 Z" fill="#1B1B1B"/>
    <!-- Stitching -->
    <path d="M15 15 Q45 8 75 10" fill="none" stroke="#5D4037" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="10" y1="30" x2="78" y2="28" stroke="#2E1A10" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Right holder -->
  <g filter="url(#shoeShad12)">
    <rect x="210" y="308" width="120" height="8" rx="2" fill="url(#holder12)" transform="rotate(-12 270 312)"/>
    <rect x="208" y="300" width="8" height="18" rx="2" fill="#E0E0E0"/>
  </g>
  <!-- Right dress shoe -->
  <g filter="url(#shoeShad12)" transform="translate(225, 268) rotate(-12)">
    <path d="M0 28 Q0 8 20 3 L60 0 Q80 2 85 12 L88 22 Q88 30 80 32 L0 32 Z" fill="url(#dress12)"/>
    <path d="M0 32 L88 32 Q88 36 85 38 L-2 38 Q-2 36 0 32 Z" fill="#1B1B1B"/>
    <path d="M15 15 Q45 8 75 10" fill="none" stroke="#5D4037" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="10" y1="30" x2="78" y2="28" stroke="#2E1A10" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>