<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Pins Perdus · Épisode 1</title>
<meta name="robots" content="noindex">
<style>
  :root { --fond: #0b0f1c; }
  html, body { margin: 0; height: 100%; background: var(--fond); }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Inter Display", system-ui, sans-serif; }
  #cadre { height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; position: relative; }
  #scene { width: 100%; height: 100%; display: block; }
  body.rendu #cadre { height: 1920px; width: 1080px; }
</style>
</head>
<body>
<div id="cadre"><svg id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
/* =========================================================
   LES PINS PERDUS — Épisode 1
   Série originale : tu hérites d'un camping abandonné.
   Marquage des mots : *jaune  !rouge  +vert  ~bleu
   ========================================================= */
const SCRIPT = [
  ["Ton grand-oncle t'a laissé un +camping.", "intro"],
  ["Abandonné depuis !12 !ans.", ""],
  ["Le notaire est clair : *50 *familles cet été.", "hudFam"],
  ["Sinon, la mairie le !récupère.", ""],
  ["Délai : !120 !jours. Budget : *80 *000 *euros.", "hudAll"],
  ["*30 emplacements mangés par les !ronces… et !0 campeur.", "pan"],
  ["Enfin, presque.", "presque"],
  ["Dans la vieille caravane du fond, il y a +Roger.", "roger"],
  ["Le chien de ton grand-oncle. Il n'est jamais parti.", "wouf"],
  ["Et Roger a une liste.", "liste"],
  ["Point un : l'entrée.", "p1"],
  ["Le portail est !rouillé, le panneau est par terre.", ""],
  ["Portail neuf, panneau repeint : *4 *000 *euros.", "calc1"],
  ["Point deux : les !ronces.", "p2"],
  ["Débroussailleuse, benne, trois jours de sueur : *2 *500 *euros.", "calc2"],
  ["Point trois : les ~douches.", "p3"],
  ["Sans douches, personne ne reste une nuit.", ""],
  ["Le bloc est !fissuré, les tuyaux ont !gelé.", ""],
  ["Plomberie, carrelage, chauffe-eau : *34 *000 *euros.", "calc3"],
  ["~Vérification : tu ouvres le robinet…", "verif"],
  ["L'eau est +chaude. Roger +valide.", "ok"],
  ["Dépensé : *40 *500. Il reste *39 *500 *euros.", "bilan"],
  ["!0 famille sur 50. Il reste !110 !jours.", "bilan2"],
  ["Maintenant, il faut une raison de venir.", "choix0"],
  ["Une ~piscine… ou une *aire *de *jeux ?", "choix"],
  ["Écris piscine ou jeux en commentaire.", "comment"],
  ["Le plus voté sera construit au prochain épisode.", "fin"],
];

/* ---------- Minutage (remplaçable par celui d'une vraie voix off) ---------- */
const CPS = 15.5;            // caractères par seconde (rythme narrateur TikTok)
const WORDS = [], SENT = [], B = {};
(function minuter() {
  let t = 0.35;
  SCRIPT.forEach(([txt, beat], si) => {
    const s0 = t;
    const mots = txt.split(/\s+/);
    mots.forEach((m) => {
      let couleur = "w", brut = m;
      if ("*!+~".includes(m[0])) { couleur = { "*": "y", "!": "r", "+": "g", "~": "b" }[m[0]]; brut = m.slice(1); }
      const d = (brut.length + 1) / CPS;
      WORDS.push({ t, d, txt: brut, c: couleur, si });
      t += d;
      if (/…$/.test(brut)) t += 0.45; else if (/[.:?!,]$/.test(brut)) t += /[,]$/.test(brut) ? 0.08 : 0.22;
    });
    SENT.push({ t0: s0, t1: t });
    if (beat) B[beat] = s0;
    t += 0.12;
  });
  window.FIN_VOIX = t;
})();
const DUREE = FIN_VOIX + 2.6;

/* Découpe des sous-titres : 3 mots max, coupe après la ponctuation */
const CHUNKS = [];
(function decouper() {
  let cur = [];
  const pousser = () => { if (cur.length) { CHUNKS.push(cur); cur = []; } };
  WORDS.forEach((w, i) => {
    const suivant = WORDS[i + 1];
    cur.push(w);
    if (cur.length >= 3 || /[.:?!,…]$/.test(w.txt) || !suivant || suivant.si !== w.si) pousser();
  });
  CHUNKS.forEach((c, i) => { c.t0 = c[0].t; c.t1 = CHUNKS[i + 1] ? CHUNKS[i + 1][0].t : c.at(-1).t + c.at(-1).d + 0.4; });
})();

/* ---------- Outils ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const ease = (t, a, d) => easeIO(clamp((t - a) / d));
const lerp = (a, b, p) => a + (b - a) * p;
const mixC = (c1, c2, p) => {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const a = h(c1), b = h(c2);
  return "#" + a.map((v, i) => Math.round(lerp(v, b[i], p)).toString(16).padStart(2, "0")).join("");
};
const euros = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const vis = (t, a, b, f = 0.25) => clamp(Math.min((t - a) / f, (b - t) / f)); // apparition/disparition
const fin = (beat, apres = 0) => (B[beat] ?? 0) + apres;
const finPhrase = (beat) => { const i = SCRIPT.findIndex((s) => s[1] === beat); return SENT[i].t1; };

/* Caméra : clés [temps, x, zoom, durée] enchaînées */
const CAM = [
  [0, 620, 0.85, 0.01],
  [0.4, 760, 0.95, 5],
  [fin("hudAll"), 1150, 0.72, 2.5],
  [fin("pan"), 600, 1.45, 0.7],
  [fin("pan", 0.8), 1280, 1.45, finPhrase("pan") - fin("pan") - 0.8],
  [fin("roger"), 2040, 1.9, 1.0],
  [fin("liste"), 2010, 1.6, 0.8],
  [fin("p1"), 300, 1.7, 1.1],
  [fin("p2"), 930, 1.3, 1.0],
  [fin("p3"), 1620, 1.7, 1.0],
  [fin("verif"), 1790, 2.7, 1.0],
  [fin("bilan"), 1300, 0.9, 1.2],
];
function camera(t) {
  let x = CAM[0][1], z = CAM[0][2];
  for (const [kt, kx, kz, kd] of CAM) {
    if (t < kt) break;
    const p = ease(t, kt, kd);
    x = lerp(x, kx, p); z = lerp(z, kz, p);
  }
  return { x, z };
}
/* Toi et Roger : positions clés */
const TOI = [
  [0, 330, 0.01], [fin("pan", 0.6), 600, 2.6], [fin("roger"), 1880, 1.0], [fin("p1"), 410, 1.1],
  [fin("p2"), 760, 1.0], [fin("p3"), 1440, 1.0], [fin("verif"), 1740, 0.9], [fin("bilan"), 1150, 1.2],
];
const ROGER = [
  [0, 2085, 0.01], [fin("liste", 0.3), 1990, 0.8], [fin("p1"), 480, 1.2], [fin("p2"), 830, 1.1],
  [fin("p3"), 1520, 1.1], [fin("verif"), 1850, 1.0], [fin("bilan"), 1230, 1.3],
];
function piste(cles, t) {
  let x = cles[0][1], v = 0;
  for (const [kt, kx, kd] of cles) {
    if (t < kt) break;
    const p = ease(t, kt, kd);
    if (p > 0 && p < 1) v = 1;
    x = lerp(x, kx, p);
  }
  return { x, marche: v };
}

/* ---------- Dessins (monde : sol à y = 1060) ---------- */
const SOL = 1060;

function ciel(t, jour) {
  const nuit = ["#16264f", "#3a5287"], aube = ["#2f3a6e", "#e9906b"], plein = ["#4f9fdc", "#c4e6f5"];
  const top = jour < 0.5 ? mixC(nuit[0], aube[0], jour * 2) : mixC(aube[0], plein[0], (jour - 0.5) * 2);
  const bas = jour < 0.5 ? mixC(nuit[1], aube[1], jour * 2) : mixC(aube[1], plein[1], (jour - 0.5) * 2);
  let s = `<defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bas}"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
  <rect width="1080" height="1300" fill="url(#gc)"/>`;
  const etoiles = clamp(1 - jour * 2.2);
  if (etoiles > 0) {
    let r = 7;
    for (let i = 0; i < 70; i++) {
      r = (r * 9301 + 49297) % 233280; const x = (r / 233280) * 1080;
      r = (r * 9301 + 49297) % 233280; const y = 260 + (r / 233280) * 600;
      const sc = 0.6 + 0.4 * Math.sin(t * 2 + i);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.2 + (i % 3) * 0.7).toFixed(1)}" fill="#fff" opacity="${(etoiles * sc * 0.8).toFixed(2)}"/>`;
    }
  }
  const lune = clamp(1 - jour * 2);
  if (lune > 0) s += `<circle cx="820" cy="330" r="44" fill="#e9eef7" opacity="${lune}"/><circle cx="806" cy="320" r="9" fill="#cfd6e4" opacity="${lune}"/><circle cx="834" cy="345" r="6" fill="#cfd6e4" opacity="${lune}"/>`;
  if (jour > 0.25) {
    const y = lerp(980, 330, ease(jour, 0.25, 0.75));
    s += `<circle cx="250" cy="${y}" r="150" fill="url(#halo)"/><circle cx="250" cy="${y}" r="52" fill="#ffe08a"/>`;
  }
  return s;
}

function collines(cam, jour) {
  const f = 0.25, z = 1 + (cam.z - 1) * 0.35;
  const tx = 540 - (cam.x * f) * z;
  const c1 = mixC("#2a3d68", "#7fae8c", jour), c2 = mixC("#22345a", "#5f9a6b", jour), c3 = mixC("#1a2a48", "#3f7a52", jour);
  let s = `<g transform="translate(${tx},${SOL}) scale(${z}) translate(0,${-SOL})">`;
  s += `<path d="M-900 ${SOL} Q -500 760 -100 900 T 700 870 T 1500 900 T 2300 860 L 2300 ${SOL} Z" fill="${c1}"/>`;
  s += `<path d="M-900 ${SOL} Q -400 880 100 960 T 900 940 T 1700 960 T 2400 950 L 2400 ${SOL} Z" fill="${c2}"/>`;
  for (let i = 0; i < 40; i++) {
    const x = -800 + i * 85 + ((i * 37) % 30), h = 70 + ((i * 53) % 50);
    s += `<path d="M${x} ${SOL - 20} l 22 ${-h} l 22 ${h} Z" fill="${c3}"/>`;
  }
  return s + `</g>`;
}

function pin(x, h, couleur = "#2f5d3a") {
  const tronc = `<rect x="${x - 7}" y="${SOL - 40}" width="14" height="40" fill="#5b3b25"/>`;
  let s = tronc;
  for (let i = 0; i < 4; i++) {
    const w = 70 - i * 13, y = SOL - 30 - i * (h / 5);
    s += `<path d="M${x - w} ${y} L ${x} ${y - h / 3} L ${x + w} ${y} Z" fill="${mixC(couleur, "#5b8f52", i * 0.12)}"/>`;
  }
  return s;
}

function entree(t, neuf) {
  let s = "";
  // piliers en pierre
  [150, 420].forEach((x) => {
    s += `<rect x="${x - 26}" y="${SOL - 190}" width="52" height="190" fill="#8f8a80"/><rect x="${x - 32}" y="${SOL - 202}" width="64" height="18" fill="#a29d93"/>`;
    for (let j = 0; j < 6; j++) s += `<line x1="${x - 26}" y1="${SOL - 160 + j * 30}" x2="${x + 26}" y2="${SOL - 160 + j * 30}" stroke="#77736a" stroke-width="3"/>`;
  });
  // portail : rouillé (de travers) -> neuf
  const coul = mixC("#7a4a2a", "#2e6b52", neuf), pointe = mixC("#5c3a22", "#f2c14e", neuf);
  const ang = lerp(9, 0, neuf);
  for (let side = 0; side < 2; side++) {
    const x0 = side ? 285 : 176, x1 = side ? 394 : 285;
    const pivot = side ? 394 : 176;
    const a = side ? -ang * 0.4 : ang;
    s += `<g transform="rotate(${a} ${pivot} ${SOL - 20})">`;
    s += `<rect x="${x0}" y="${SOL - 150}" width="${x1 - x0}" height="12" fill="${coul}"/><rect x="${x0}" y="${SOL - 40}" width="${x1 - x0}" height="12" fill="${coul}"/>`;
    for (let b = x0 + 8; b < x1; b += 18) {
      const casse = !neuf && (b * 7) % 5 === 0;
      s += `<rect x="${b}" y="${SOL - (casse ? 110 : 160)}" width="7" height="${casse ? 70 : 135}" fill="${coul}"/><path d="M${b - 3} ${SOL - (casse ? 110 : 160)} l 6.5 -14 l 6.5 14 Z" fill="${pointe}"/>`;
    }
    s += `</g>`;
  }
  // panneau : par terre -> en haut
  const p = neuf;
  const px = lerp(500, 285, p), py = lerp(SOL - 26, SOL - 262, p), rot = lerp(-12, 0, p);
  if (p > 0.05) s += `<rect x="${200}" y="${SOL - 262}" width="10" height="${80 * p}" fill="#6b4a2f"/><rect x="${360}" y="${SOL - 262}" width="10" height="${80 * p}" fill="#6b4a2f"/>`;
  s += `<g transform="translate(${px},${py}) rotate(${rot})">
    <rect x="-150" y="-40" width="300" height="80" rx="10" fill="${mixC("#8a7a62", "#f6ecd2", p)}" stroke="${mixC("#5b4c38", "#2e6b52", p)}" stroke-width="6"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="${mixC("#5b4c38", "#2e6b52", p)}" letter-spacing="2">CAMPING</text>
    <text x="0" y="24" text-anchor="middle" font-family="Inter" font-weight="900" font-size="28" fill="${mixC("#4a3c2b", "#1f4d3a", p)}">LES PINS PERDUS</text>
    ${p < 0.5 ? `<path d="M-120 -30 l 40 55 M60 -38 l 30 40" stroke="#4a3c2b" stroke-width="3" opacity="${1 - p * 2}"/>` : ""}
  </g>`;
  return s;
}

function emplacements(t, deblai) {
  let s = "";
  // bordures et piquets numérotés
  for (let i = 0; i < 5; i++) {
    const x = 540 + i * 170;
    s += `<rect x="${x - 4}" y="${SOL - 46}" width="8" height="46" fill="#7a5636"/><rect x="${x - 22}" y="${SOL - 64}" width="44" height="24" rx="4" fill="${mixC("#6d6152", "#f6ecd2", deblai)}"/><text x="${x}" y="${SOL - 46}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="16" fill="#2b2b2b">${String(i * 6 + 1).padStart(2, "0")}</text>`;
  }
  // ronces : disparaissent de gauche à droite
  for (let i = 0; i < 9; i++) {
    const x = 520 + i * 95 + ((i * 29) % 30), h = 80 + ((i * 41) % 50);
    const part = clamp(deblai * 9 - i * 0.85);
    const sc = 1 - part;
    if (sc <= 0.02) continue;
    s += `<g transform="translate(${x},${SOL}) scale(${sc.toFixed(3)}) translate(${-x},${-SOL})">`;
    s += `<ellipse cx="${x}" cy="${SOL - h * 0.45}" rx="${h * 0.75}" ry="${h * 0.5}" fill="#2d3b22"/><ellipse cx="${x - 30}" cy="${SOL - h * 0.3}" rx="${h * 0.5}" ry="${h * 0.36}" fill="#36472a"/><ellipse cx="${x + 34}" cy="${SOL - h * 0.35}" rx="${h * 0.45}" ry="${h * 0.38}" fill="#26331d"/>`;
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI * (0.1 + 0.8 * (k / 6));
      s += `<path d="M${x} ${SOL - 10} q ${Math.cos(a) * h * 0.6} ${Math.sin(a) * h * 1.2} ${Math.cos(a) * h * 1.1} ${Math.sin(a) * h * 0.9}" stroke="#4a3a24" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    }
    s += `<circle cx="${x - 20}" cy="${SOL - h * 0.6}" r="6" fill="#5b2a6b"/><circle cx="${x + 18}" cy="${SOL - h * 0.5}" r="5" fill="#5b2a6b"/></g>`;
  }
  // poussière pendant le débroussaillage
  if (deblai > 0 && deblai < 1) {
    for (let k = 0; k < 6; k++) {
      const x = 520 + deblai * 860 + k * 14 - 40, y = SOL - 30 - ((t * 120 + k * 37) % 80);
      s += `<circle cx="${x}" cy="${y}" r="${10 + k * 2}" fill="#b9a98a" opacity=".35"/>`;
    }
  }
  return s;
}

function douches(t, repare) {
  const x0 = 1450, w = 300, h = 175;
  const mur = mixC("#a39880", "#f3eee2", repare), toit = mixC("#5c5248", "#3a4a5c", repare);
  let s = `<rect x="${x0}" y="${SOL - h}" width="${w}" height="${h}" fill="${mur}"/>`;
  s += `<rect x="${x0 - 14}" y="${SOL - h - 18}" width="${w + 28}" height="22" fill="${toit}"/>`;
  // bande de carrelage
  s += `<rect x="${x0}" y="${SOL - 42}" width="${w}" height="42" fill="${mixC("#7d7464", "#3aa0d8", repare)}"/>`;
  if (repare > 0.5) for (let i = 0; i < 12; i++) s += `<line x1="${x0 + i * 25}" y1="${SOL - 42}" x2="${x0 + i * 25}" y2="${SOL}" stroke="#2b86bd" stroke-width="2"/>`;
  // porte et fenêtre
  s += `<rect x="${x0 + 30}" y="${SOL - 130}" width="62" height="130" fill="${mixC("#6b5a45", "#2e6b52", repare)}"/><circle cx="${x0 + 80}" cy="${SOL - 64}" r="5" fill="#e6c36a"/>`;
  s += `<rect x="${x0 + 150}" y="${SOL - 140}" width="110" height="56" fill="${mixC("#2a2f38", "#ffd98a", repare)}" stroke="#4a4036" stroke-width="5"/>`;
  if (repare < 0.5) s += `<path d="M${x0 + 152} ${SOL - 138} l 40 30 l -10 20 l 30 4" stroke="#cfd6e4" stroke-width="3" fill="none" opacity=".6"/>`;
  // panneau DOUCHES
  s += `<rect x="${x0 + 110}" y="${SOL - h + 12}" width="150" height="40" rx="6" fill="${mixC("#5d6d7a", "#1f6fae", repare)}"/><text x="${x0 + 185}" y="${SOL - h + 41}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#fff" letter-spacing="2">DOUCHES</text>`;
  // fissures et mousse (disparaissent)
  const fis = 1 - repare;
  if (fis > 0) {
    s += `<g opacity="${fis}"><path d="M${x0 + 110} ${SOL - h} l 12 30 l -8 22 l 16 26 l -6 30" stroke="#3a3128" stroke-width="5" fill="none"/>
      <path d="M${x0 + 270} ${SOL - 60} l -18 -24 l 10 -18 l -14 -30" stroke="#3a3128" stroke-width="4" fill="none"/>
      <ellipse cx="${x0 + 20}" cy="${SOL - 6}" rx="40" ry="14" fill="#3f5a2c"/><ellipse cx="${x0 + 250}" cy="${SOL - h - 6}" rx="36" ry="10" fill="#3f5a2c"/></g>`;
  }
  // robinet extérieur (vérification)
  const rx = 1800;
  s += `<rect x="${rx - 6}" y="${SOL - 120}" width="12" height="120" fill="#6b6b6b"/><rect x="${rx - 6}" y="${SOL - 120}" width="40" height="12" fill="#8a8a8a"/><rect x="${rx + 26}" y="${SOL - 120}" width="10" height="26" fill="#8a8a8a"/><rect x="${rx - 2}" y="${SOL - 138}" width="22" height="10" rx="4" fill="#d24b3e"/>`;
  s += `<rect x="${rx - 4}" y="${SOL - 40}" width="80" height="40" fill="#bfc5cc"/><rect x="${rx}" y="${SOL - 40}" width="72" height="8" fill="#9aa3ad"/>`;
  return s;
}

function eauRobinet(t) {
  const a = fin("verif", 1.2);
  if (t < a) return "";
  const p = clamp((t - a) / 0.3), rx = 1831;
  let s = `<rect x="${rx - 5}" y="${SOL - 94}" width="10" height="${54 * p}" fill="#5fb3ff" opacity=".9"/>`;
  for (let k = 0; k < 4; k++) {
    const y = SOL - 92 + ((t * 160 + k * 14) % 54);
    s += `<circle cx="${rx + (k % 2 ? 4 : -4)}" cy="${y}" r="3" fill="#bfe3ff"/>`;
  }
  const vap = ease(t, fin("ok") - 0.2, 0.6);
  for (let k = 0; k < 3; k++) {
    const y = SOL - 50 - ((t * 40 + k * 30) % 90);
    s += `<path d="M${rx + 20 + k * 14} ${y} q 10 -14 0 -28 q -10 -14 0 -28" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="${(0.55 * vap).toFixed(2)}"/>`;
  }
  return s;
}

function caravane(t) {
  const x0 = 1930;
  let s = `<rect x="${x0 - 60}" y="${SOL - 40}" width="70" height="8" fill="#555"/><rect x="${x0 - 70}" y="${SOL - 30}" width="24" height="30" fill="#8f8a80"/>`;
  s += `<path d="M${x0} ${SOL - 30} L ${x0} ${SOL - 160} Q ${x0} ${SOL - 210} ${x0 + 60} ${SOL - 210} L ${x0 + 250} ${SOL - 210} Q ${x0 + 300} ${SOL - 210} ${x0 + 300} ${SOL - 150} L ${x0 + 300} ${SOL - 30} Z" fill="#e3d6b8"/>`;
  s += `<rect x="${x0}" y="${SOL - 110}" width="300" height="22" fill="#a0603a"/>`;
  s += `<rect x="${x0 + 30}" y="${SOL - 180}" width="80" height="55" rx="12" fill="#ffcf73"/><rect x="${x0 + 180}" y="${SOL - 180}" width="80" height="55" rx="12" fill="#2a2f38"/>`;
  s += `<rect x="${x0 + 130}" y="${SOL - 165}" width="40" height="135" fill="#c9b994"/><circle cx="${x0 + 162}" cy="${SOL - 95}" r="4" fill="#6b5a45"/>`;
  s += `<circle cx="${x0 + 60}" cy="${SOL - 190}" r="10" fill="#9a6b46" opacity=".7"/><circle cx="${x0 + 270}" cy="${SOL - 60}" r="14" fill="#9a6b46" opacity=".6"/><circle cx="${x0 + 250}" cy="${SOL - 130}" r="8" fill="#9a6b46" opacity=".6"/>`;
  s += `<ellipse cx="${x0 + 220}" cy="${SOL - 14}" rx="30" ry="18" fill="#222"/><ellipse cx="${x0 + 220}" cy="${SOL - 14}" rx="12" ry="8" fill="#777"/>`;
  s += `<ellipse cx="${x0 + 360}" cy="${SOL - 8}" rx="22" ry="8" fill="#c0392b"/>`;
  return s;
}

function lumieres(t, repare) {
  let s = `<circle cx="2000" cy="${SOL - 152}" r="90" fill="url(#halo)"/>`;
  if (repare > 0) s += `<circle cx="1655" cy="${SOL - 112}" r="${110 * repare}" fill="url(#halo)"/>`;
  return s;
}

/* ---------- Personnages (style « sticker » : trait foncé, grosses têtes) ---------- */
const TRAIT = "#1d1a2b", PEAU = "#f3c7a1", CHEVEUX = "#5a3420";

/* Humeur du héros selon le moment de l'histoire */
function humeur(t) {
  const H = [
    [0, "content"], [fin("hudFam"), "inquiet"], [fin("pan", 1.2), "choque"], [fin("presque"), "surpris"],
    [fin("roger", 1.2), "content"], [fin("p1", 1.4), "grimace"], [fin("calc1", 2.2), "content"],
    [fin("p2", 0.8), "grimace"], [fin("calc2", 2.8), "content"], [fin("p3", 1.2), "inquiet"],
    [fin("verif"), "concentre"], [fin("ok"), "joie"], [fin("bilan", 0.5), "content"], [fin("bilan2"), "inquiet"],
    [fin("choix0"), "reflechit"], [fin("comment"), "joie"],
  ];
  let h = "content";
  for (const [ht, v] of H) if (t >= ht) h = v;
  return h;
}
function geste(t, h) {
  if (h === "joie" && t >= fin("ok") && t < fin("bilan")) return "pouce";
  if (h === "reflechit") return "menton";
  if (t >= fin("comment")) return "salut";
  if (h === "choque") return "choc";
  return "";
}

function visage(h, t) {
  const O = TRAIT;
  const cligne = h !== "joie" && h !== "choque" && (t % 3.3) < 0.13;
  const grand = h === "choque" || h === "surpris";
  let s = "";
  // yeux
  [4, 22].forEach((ex, i) => {
    if (h === "joie") { s += `<path d="M${ex - 7} 3 q 7 -10 14 0" stroke="${O}" stroke-width="4" fill="none" stroke-linecap="round"/>`; return; }
    if (cligne) { s += `<path d="M${ex - 7} 1 h 14" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`; return; }
    const ry = grand ? 11 : 9, rp = h === "choque" ? 2.6 : 4.2;
    const dy = h === "reflechit" ? -3 : 0, dx = h === "reflechit" ? 1 : 2.5;
    s += `<ellipse cx="${ex}" cy="0" rx="${grand ? 8.5 : 7}" ry="${ry}" fill="#fff" stroke="${O}" stroke-width="3"/>`;
    s += `<circle cx="${ex + dx}" cy="${1 + dy}" r="${rp}" fill="${O}"/><circle cx="${ex + dx + 1.5}" cy="${-1 + dy}" r="1.3" fill="#fff"/>`;
  });
  // sourcils
  const S = {
    content: ["M-3 -14 q 7 -5 14 0", "M15 -14 q 7 -5 14 0"],
    joie: ["M-3 -15 q 7 -6 14 0", "M15 -15 q 7 -6 14 0"],
    inquiet: ["M-3 -12 L 11 -18", "M15 -18 L 29 -12"],
    grimace: ["M-3 -18 L 11 -11", "M15 -11 L 29 -18"],
    concentre: ["M-3 -17 L 11 -13", "M15 -13 L 29 -17"],
    choque: ["M-3 -22 q 7 -6 14 0", "M15 -22 q 7 -6 14 0"],
    surpris: ["M-3 -20 q 7 -6 14 0", "M15 -20 q 7 -6 14 0"],
    reflechit: ["M-3 -14 q 7 -3 14 0", "M15 -21 q 7 -6 14 2"],
  }[h] || ["M-3 -14 q 7 -5 14 0", "M15 -14 q 7 -5 14 0"];
  s += S.map((d) => `<path d="${d}" stroke="${CHEVEUX}" stroke-width="5" fill="none" stroke-linecap="round"/>`).join("");
  // nez + joues
  s += `<path d="M31 5 q 7 4 0 9" stroke="${O}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  s += `<ellipse cx="2" cy="15" rx="6" ry="4" fill="#f08a8a" opacity=".45"/><ellipse cx="25" cy="15" rx="6" ry="4" fill="#f08a8a" opacity=".45"/>`;
  // bouche
  const M = {
    content: `<path d="M8 20 q 8 8 16 0" stroke="${O}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    joie: `<path d="M6 18 q 10 18 20 0 Z" fill="#7a2230" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 25 q 5 4 10 0" fill="#ef7b86"/>`,
    inquiet: `<path d="M8 24 q 4 -4 8 0 q 4 4 8 0" stroke="${O}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    grimace: `<rect x="6" y="18" width="20" height="10" rx="3" fill="#fff" stroke="${O}" stroke-width="3"/><path d="M6 23 h 20 M13 18 v 10 M19 18 v 10" stroke="${O}" stroke-width="2"/>`,
    concentre: `<path d="M9 23 h 14" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`,
    choque: `<ellipse cx="16" cy="24" rx="6.5" ry="9" fill="#7a2230" stroke="${O}" stroke-width="3"/>`,
    surpris: `<ellipse cx="16" cy="23" rx="4.5" ry="5.5" fill="#7a2230" stroke="${O}" stroke-width="3"/>`,
    reflechit: `<path d="M10 25 q 7 -2 13 -7" stroke="${O}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  };
  return s + (M[h] || M.content);
}

function bras(sx, a1, a2, fonce, pouce) {
  const O = TRAIT;
  return `<g transform="translate(${sx},-128) rotate(${a1})">
    <rect x="-10" y="-6" width="20" height="32" rx="9" fill="${fonce ? "#2c5590" : "#3f74c2"}" stroke="${O}" stroke-width="4"/>
    <rect x="-10" y="18" width="20" height="7" rx="3" fill="${fonce ? "#244a7e" : "#35649f"}"/>
    <g transform="translate(0,24) rotate(${a2})">
      <rect x="-6.5" y="-2" width="13" height="26" rx="6" fill="${PEAU}" stroke="${O}" stroke-width="4"/>

      <circle cx="0" cy="28" r="9" fill="${PEAU}" stroke="${O}" stroke-width="4"/>
    </g></g>`;
}

function jambe(dx, ang, fonce) {
  const O = TRAIT;
  return `<g transform="rotate(${ang} ${dx} -80)">
    <rect x="${dx - 7.5}" y="-56" width="15" height="40" fill="${PEAU}" stroke="${O}" stroke-width="4"/>

    <path d="M${dx - 12} -16 h 20 q 16 1 16 12 v 4 h -36 Z" fill="${fonce ? "#c43a31" : "#e2483d"}" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
    <rect x="${dx - 12}" y="-5" width="36" height="5" rx="2" fill="#fff" stroke="${O}" stroke-width="2.5"/>
    <rect x="${dx - 13}" y="-84" width="26" height="34" rx="7" fill="${fonce ? "#8f7c4f" : "#ad9765"}" stroke="${O}" stroke-width="4"/>
  </g>`;
}

/* Le héros : Malo, 19 ans, cheveux en bataille, chemise en jean ouverte sur un t-shirt « pin » */
function personnage(x, marche, t, regard = 1, h = "content", g = "") {
  const O = TRAIT;
  const ph = t * 11;
  const bob = marche ? Math.abs(Math.sin(ph)) * 6 : Math.sin(t * 2.4) * 1.5;
  const j = marche ? Math.sin(ph) * 24 : 0;
  const b = marche ? Math.sin(ph) * 30 : Math.sin(t * 2.4) * 3;
  // angles des bras [épaule, coude] : 0 = vers le bas, négatif = vers l'avant
  let avant = [-b - 6, -14], arriere = [b + 6, -10], pouce = false;
  if (g === "pouce") { avant = [-105, -70]; pouce = true; }
  if (g === "menton") avant = [-28, -148];
  if (g === "salut") avant = [-165, Math.sin(t * 10) * 25];
  if (g === "choc") { avant = [-60, -40]; arriere = [55, 30]; }
  const saut = h === "joie" && t >= fin("ok") && t < fin("ok", 0.5) ? Math.sin(((t - fin("ok")) / 0.5) * Math.PI) * 18 : 0;
  const tete = h === "reflechit" ? -6 : marche ? Math.sin(ph) * 2 : 0;
  return `<g transform="translate(${x},${SOL - bob - saut}) scale(${regard},1)">
    <ellipse cx="0" cy="${bob + saut + 2}" rx="34" ry="7" fill="#000" opacity=".22"/>
    ${bras(-14, arriere[0], arriere[1], true, false)}
    ${jambe(-8, -j, true)}${jambe(8, j, false)}
    <rect x="-26" y="-96" width="52" height="20" rx="6" fill="#ad9765" stroke="${O}" stroke-width="4"/>
    <rect x="-26" y="-96" width="52" height="6" fill="#6b5a3a"/>
    <rect x="-24" y="-142" width="48" height="52" rx="13" fill="#f7f4ec" stroke="${O}" stroke-width="4"/>
    <path d="M-4 -106 l 8 -16 l 8 16 Z" fill="#2e8b57"/><rect x="2" y="-106" width="4" height="5" fill="#6b3f22"/>
    <path d="M-25 -136 Q -26 -110 -24 -90 L -9 -90 L -9 -128 L -14 -142 Z" fill="#3f74c2" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M25 -136 Q 26 -110 24 -90 L 13 -90 L 13 -128 L 15 -142 Z" fill="#3f74c2" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-7" y="-152" width="14" height="14" fill="${PEAU}" stroke="${O}" stroke-width="4"/>
    <g transform="translate(0,-186) rotate(${tete})">
      <path d="M-34 4 Q -42 -38 -2 -46 Q 36 -48 38 -8 L 32 6 Z" fill="${CHEVEUX}" stroke="${O}" stroke-width="4"/>
      <ellipse cx="2" cy="0" rx="33" ry="34" fill="${PEAU}" stroke="${O}" stroke-width="4"/>
      <ellipse cx="-27" cy="7" rx="6" ry="9" fill="${PEAU}" stroke="${O}" stroke-width="3.5"/>
      <path d="M-28 3 q 4 4 0 8" stroke="${O}" stroke-width="2.5" fill="none"/>
      <path d="M-36 6 Q -42 -34 -6 -40 Q 28 -46 38 -16 Q 42 -4 34 2 Q 31 -14 19 -14 Q 23 -4 14 -1 Q 11 -14 0 -16 Q 2 -7 -6 -5 Q -9 -18 -22 -13 Q -27 -2 -36 6 Z" fill="${CHEVEUX}" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-2 -42 q 2 -16 16 -20 q -6 8 -4 18" fill="${CHEVEUX}" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-20 -30 q 10 -8 22 -8" stroke="#7a4a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g transform="translate(-5,2)">${visage(h, t)}</g>
    </g>
    ${bras(14, avant[0], avant[1], false, pouce)}
  </g>`;
}

/* Roger : chien de camping, oreille tombante, foulard rouge */
function chien(x, marche, t, regard = -1) {
  const O = TRAIT;
  const bob = marche ? Math.abs(Math.sin(t * 14)) * 4 : 0;
  const queue = Math.sin(t * (marche ? 14 : 8)) * 18;
  const j = marche ? Math.sin(t * 14) * 14 : 0;
  const cligne = (t % 4.1) < 0.12;
  return `<g transform="translate(${x},${SOL - bob}) scale(${regard},1)">
    <ellipse cx="0" cy="${bob + 2}" rx="40" ry="6" fill="#000" opacity=".2"/>
    <path d="M-36 -44 q -20 -10 -16 -32" stroke="${O}" stroke-width="13" fill="none" stroke-linecap="round" transform="rotate(${queue} -36 -44)"/>
    <path d="M-36 -44 q -20 -10 -16 -32" stroke="#c98f4a" stroke-width="6" fill="none" stroke-linecap="round" transform="rotate(${queue} -36 -44)"/>
    <rect x="-32" y="-30" width="11" height="30" rx="4" fill="#b07a3c" stroke="${O}" stroke-width="3.5" transform="rotate(${j} -26 -30)"/>
    <rect x="14" y="-30" width="11" height="30" rx="4" fill="#b07a3c" stroke="${O}" stroke-width="3.5" transform="rotate(${-j} 20 -30)"/>
    <ellipse cx="-4" cy="-38" rx="38" ry="21" fill="#c98f4a" stroke="${O}" stroke-width="4"/>
    <ellipse cx="-8" cy="-31" rx="17" ry="10" fill="#f1e2c6"/>
    <rect x="-24" y="-30" width="11" height="30" rx="4" fill="#c98f4a" stroke="${O}" stroke-width="3.5" transform="rotate(${-j} -18 -30)"/>
    <rect x="22" y="-30" width="11" height="30" rx="4" fill="#c98f4a" stroke="${O}" stroke-width="3.5" transform="rotate(${j} 28 -30)"/>
    <path d="M14 -50 l 26 6 l -8 10 Z" fill="#d23c3c" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="32" cy="-62" r="22" fill="#c98f4a" stroke="${O}" stroke-width="4"/>
    <ellipse cx="47" cy="-55" rx="14" ry="10" fill="#f1e2c6" stroke="${O}" stroke-width="3.5"/>
    <ellipse cx="58" cy="-59" rx="6" ry="5" fill="${O}"/>
    <path d="M44 -48 q 6 4 12 0" stroke="${O}" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${cligne ? `<path d="M31 -68 h 9" stroke="${O}" stroke-width="3.5" stroke-linecap="round"/>` : `<circle cx="36" cy="-68" r="4.2" fill="${O}"/><circle cx="37.5" cy="-69.5" r="1.3" fill="#fff"/>`}
    <path d="M18 -80 q -18 2 -16 34 q 12 -4 18 -24 Z" fill="#7a4a24" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
  </g>`;
}

/* ---------- Interface (notre style : stickers crème, trait foncé, ombre pleine) ---------- */
let ZOOM = 1;
function bulle(x, y, texte, couleur = "#fff6e3", ink = TRAIT, o = 1) {
  if (o <= 0) return "";
  const w = texte.length * 17 + 44;
  return `<g opacity="${o}" transform="translate(${x},${y}) scale(${(0.7 + 0.3 * easeIO(o)) * 1.25 / ZOOM})">
    <rect x="${-w / 2 + 5}" y="-25" width="${w}" height="54" rx="18" fill="${TRAIT}"/>
    <path d="M-12 22 l 4 22 l 20 -22 Z" fill="${couleur}" stroke="${TRAIT}" stroke-width="4" stroke-linejoin="round"/>
    <rect x="${-w / 2}" y="-30" width="${w}" height="54" rx="18" fill="${couleur}" stroke="${TRAIT}" stroke-width="4"/>
    <rect x="-10" y="18" width="20" height="8" fill="${couleur}"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="${ink}">${texte}</text></g>`;
}

function hud(t) {
  const oF = vis(t, fin("hudFam"), 1e9, 0.3), oA = vis(t, fin("hudAll"), 1e9, 0.3);
  if (oF <= 0) return "";
  const sauts = [[fin("calc1", 2.2), 76000, 119], [fin("calc2", 2.6), 73500, 116], [fin("calc3", 2.2), 39500, 110]];
  let budget = 80000, delai = 120, prev = 80000, prevD = 120, delta = null;
  for (const [ts, b, d] of sauts) {
    const p = ease(t, ts, 0.7);
    if (t >= ts) { budget = lerp(prev, b, p); delai = Math.round(lerp(prevD, d, p)); if (t < ts + 2) delta = { v: b - prev, o: vis(t, ts, ts + 2, 0.2) }; }
    prev = b; prevD = d;
  }
  const ico = {
    jours: `<rect x="-12" y="-10" width="24" height="22" rx="3" fill="#fff" stroke="${TRAIT}" stroke-width="3"/><rect x="-12" y="-10" width="24" height="7" fill="${TRAIT}"/><path d="M-6 -14 v6 M6 -14 v6" stroke="${TRAIT}" stroke-width="3" stroke-linecap="round"/>`,
    familles: `<path d="M-15 12 L 0 -13 L 15 12 Z" fill="#fff" stroke="${TRAIT}" stroke-width="3" stroke-linejoin="round"/><path d="M0 -13 L -4 12 M0 -13 L 4 12" stroke="${TRAIT}" stroke-width="3"/>`,
    budget: `<circle r="13" fill="#ffe27a" stroke="${TRAIT}" stroke-width="3"/><text y="6" text-anchor="middle" font-family="Inter" font-weight="900" font-size="17" fill="${TRAIT}">€</text>`,
  };
  const boite = (cx, rot, lab, val, col, ic, o) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},150) rotate(${rot}) scale(${0.8 + 0.2 * easeIO(o)})">
    <rect x="-125" y="-46" width="250" height="92" rx="24" fill="${TRAIT}" transform="translate(5,7)"/>
    <rect x="-125" y="-46" width="250" height="92" rx="24" fill="#fff6e3" stroke="${TRAIT}" stroke-width="5"/>
    <circle cx="-88" cy="0" r="25" fill="${col}" stroke="${TRAIT}" stroke-width="4"/><g transform="translate(-88,0)">${ic}</g>
    <text x="-54" y="-12" font-family="Inter" font-weight="800" font-size="17" fill="#7a6f80" letter-spacing="2">${lab}</text>
    <text x="-54" y="27" font-family="Inter" font-weight="900" font-size="34" fill="${TRAIT}">${val}</text></g>`;
  let s = boite(265, -2, "JOURS", `${delai}`, "#ff6b5e", ico.jours, oA);
  s += boite(540, 1, "FAMILLES", "0 / 50", "#4ade80", ico.familles, oF);
  s += boite(815, -1.5, "BUDGET", `${euros(budget)} €`, "#ffc93c", ico.budget, oA);
  if (delta) s += `<g opacity="${delta.o}" transform="translate(830,236) rotate(-3)"><rect x="-90" y="-26" width="180" height="48" rx="14" fill="#ff5a5f" stroke="${TRAIT}" stroke-width="4"/><text y="10" text-anchor="middle" font-family="Inter" font-weight="900" font-size="28" fill="#fff">−${euros(-delta.v)} €</text></g>`;
  return s;
}

function puce(t) {
  const etapes = [["1", "L'ENTRÉE", fin("p1"), fin("p2")], ["2", "LES RONCES", fin("p2"), fin("p3")], ["3", "LES DOUCHES", fin("p3"), fin("verif")]];
  let s = "";
  for (const [n, txt, a, b] of etapes) {
    const o = vis(t, a, b, 0.2);
    if (o <= 0) continue;
    const w = txt.length * 19 + 190;
    s += `<g opacity="${o}" transform="translate(540,262) scale(${0.85 + 0.15 * o})">
      <rect x="${-w / 2}" y="-27" width="${w}" height="54" rx="27" fill="${TRAIT}"/>
      <rect x="${-w / 2 + 7}" y="-20" width="132" height="40" rx="20" fill="#ff6b5e"/>
      <text x="${-w / 2 + 73}" y="9" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#fff">ÉTAPE ${n}/3</text>
      <text x="${-w / 2 + 156}" y="10" font-family="Inter" font-weight="900" font-size="28" fill="#fff6e3">${txt}</text></g>`;
  }
  // tampon « vérification »
  const a = fin("verif"), o = vis(t, a, fin("ok"), 0.15);
  if (o > 0) {
    const k = 1 + 0.6 * (1 - easeIO(clamp((t - a) / 0.22)));
    s += `<g opacity="${o}" transform="translate(540,268) rotate(-5) scale(${k})">
      <rect x="-200" y="-38" width="400" height="76" rx="10" fill="#fff6e3" stroke="#2b7bd6" stroke-width="6"/>
      <rect x="-190" y="-28" width="380" height="56" rx="6" fill="none" stroke="#2b7bd6" stroke-width="3"/>
      <text y="13" text-anchor="middle" font-family="Inter" font-weight="900" font-size="38" fill="#2b7bd6" letter-spacing="4">VÉRIFICATION</text></g>`;
  }
  return s;
}

/* Le calcul façon ticket de caisse */
function carteCalcul(t, a, b, lignes, total, num = 1) {
  const o = vis(t, a, b, 0.25);
  if (o <= 0) return "";
  const h = 150 + lignes.length * 50 + 80;
  let bord = `M-250 0 H 250 V ${h}`;
  for (let x = 250; x > -250; x -= 25) bord += ` L ${x - 12.5} ${h - 14} L ${x - 25} ${h}`;
  bord += " Z";
  const mono = `font-family="JetBrains Mono" font-weight="800"`;
  let s = `<g opacity="${o}" transform="translate(540,${330 + (1 - easeIO(o)) * -40}) rotate(2.5)">
    <path d="${bord}" fill="${TRAIT}" transform="translate(7,9)"/>
    <path d="${bord}" fill="#ffffff" stroke="${TRAIT}" stroke-width="4" stroke-linejoin="round"/>
    <text x="0" y="44" text-anchor="middle" ${mono} font-size="24" fill="${TRAIT}">CAMPING LES PINS PERDUS</text>
    <text x="0" y="76" text-anchor="middle" ${mono} font-size="20" fill="#7a6f80">TICKET N°${num}</text>
    <line x1="-225" y1="98" x2="225" y2="98" stroke="${TRAIT}" stroke-width="3" stroke-dasharray="10 8"/>`;
  lignes.forEach(([lab, val], i) => {
    const oi = clamp((t - a - 0.35 - i * 0.55) / 0.15);
    s += `<g opacity="${oi}"><text x="-225" y="${140 + i * 50}" ${mono} font-size="25" fill="${TRAIT}">${lab}</text><text x="225" y="${140 + i * 50}" text-anchor="end" ${mono} font-size="25" fill="${TRAIT}">${val}</text></g>`;
  });
  const ot = clamp((t - a - 0.35 - lignes.length * 0.55) / 0.15), yt = 140 + lignes.length * 50 + 14;
  s += `<g opacity="${ot}"><line x1="-225" y1="${yt - 36}" x2="225" y2="${yt - 36}" stroke="${TRAIT}" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="-225" y="${yt + 6}" font-family="Inter" font-weight="900" font-size="32" fill="#e23b3b">TOTAL</text><text x="225" y="${yt + 6}" text-anchor="end" font-family="Inter" font-weight="900" font-size="36" fill="#e23b3b">${total}</text></g>`;
  return s + `</g>`;
}

/* La liste de Roger : un porte-bloc */
function liste(t) {
  const fen = [[fin("liste"), fin("p1", 0.6), false], [fin("bilan"), fin("choix0"), true]];
  let s = "";
  for (const [a, b, coches] of fen) {
    const o = vis(t, a, b, 0.25);
    if (o <= 0) continue;
    const items = ["1. L'ENTRÉE", "2. LES RONCES", "3. LES DOUCHES", coches ? "4. ???" : null].filter(Boolean);
    const h = 140 + items.length * 60;
    const patte = `<g transform="translate(205,74)" fill="#c98f4a" stroke="${TRAIT}" stroke-width="2.5"><ellipse cx="0" cy="6" rx="12" ry="10"/><circle cx="-12" cy="-8" r="5"/><circle cx="-4" cy="-14" r="5"/><circle cx="5" cy="-14" r="5"/><circle cx="13" cy="-8" r="5"/></g>`;
    s += `<g opacity="${o}" transform="translate(540,${330 + (1 - easeIO(o)) * -40}) rotate(-2)">
      <rect x="-265" y="0" width="530" height="${h}" rx="22" fill="${TRAIT}" transform="translate(7,9)"/>
      <rect x="-265" y="0" width="530" height="${h}" rx="22" fill="#b9773f" stroke="${TRAIT}" stroke-width="5"/>
      <rect x="-238" y="26" width="476" height="${h - 48}" rx="6" fill="#fff6e3" stroke="${TRAIT}" stroke-width="3"/>
      <rect x="-70" y="-18" width="140" height="42" rx="12" fill="#aab3bd" stroke="${TRAIT}" stroke-width="4"/>
      <text x="-205" y="88" font-family="Inter" font-weight="900" font-size="30" fill="${TRAIT}">LA LISTE DE ROGER</text>${patte}`;
    items.forEach((it, i) => {
      const oi = clamp((t - a - 0.3 - i * 0.35) / 0.2), y = 152 + i * 60;
      const coche = coches && i < 3 ? clamp((t - a - 0.6 - i * 0.4) / 0.2) : 0;
      s += `<g opacity="${oi}"><rect x="-205" y="${y - 30}" width="36" height="36" rx="8" fill="#fff" stroke="${TRAIT}" stroke-width="4"/>
        <text x="-152" y="${y}" font-family="Inter" font-weight="900" font-size="30" fill="${it.includes("???") ? "#e23b3b" : TRAIT}">${it}</text>
        ${coche > 0 ? `<path d="M-199 ${y - 14} l 12 14 l 26 -32" stroke="#22a55a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${coche}"/>` : ""}</g>`;
    });
    s += `</g>`;
  }
  return s;
}

function choix(t) {
  const a = fin("choix"), b = DUREE - 2.6;
  const carte = (cx, rot, titre, sous, col, icone, o, pulse) => o <= 0 ? "" : `<g opacity="${o}" transform="translate(${cx},480) rotate(${rot}) scale(${(0.75 + 0.25 * easeIO(o)) * (1 + pulse * 0.035)})">
    <rect x="-200" y="-125" width="400" height="250" rx="30" fill="${TRAIT}" transform="translate(8,10)"/>
    <rect x="-200" y="-125" width="400" height="250" rx="30" fill="#fff6e3" stroke="${TRAIT}" stroke-width="6"/>
    <rect x="-200" y="-125" width="400" height="22" rx="11" fill="${col}" stroke="${TRAIT}" stroke-width="6"/>
    ${icone}
    <text x="0" y="62" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="${TRAIT}">${titre}</text>
    <text x="0" y="98" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#7a6f80" letter-spacing="2">${sous}</text></g>`;
  const vagues = `<g transform="translate(0,-38)"><rect x="-90" y="-40" width="180" height="70" rx="14" fill="#2b7bd6" stroke="${TRAIT}" stroke-width="4"/><path d="M-80 -8 q 20 -16 40 0 t 40 0 t 40 0 t 40 0" stroke="#bfe3ff" stroke-width="7" fill="none"/><path d="M-80 14 q 20 -16 40 0 t 40 0 t 40 0 t 40 0" stroke="#7cc4f5" stroke-width="7" fill="none"/></g>`;
  const tobog = `<g transform="translate(0,-40)" stroke="${TRAIT}" stroke-width="4" stroke-linejoin="round"><rect x="-70" y="-60" width="12" height="92" fill="#ffc93c"/><rect x="-22" y="-60" width="12" height="92" fill="#ffc93c"/><rect x="-76" y="-66" width="72" height="12" fill="#f08a24"/><path d="M-10 -58 Q 40 -40 62 32 L 84 32 Q 62 -50 -10 -74 Z" fill="#ff5a5f"/></g>`;
  const pulse = Math.sin(t * 6) * 0.5 + 0.5;
  let s = carte(285, -3, "PISCINE", "CHAUFFÉE", "#2b7bd6", vagues, vis(t, a, b, 0.25), pulse);
  s += carte(795, 3, "AIRE DE JEUX", "TOBOGGAN · BALANÇOIRES", "#ffc93c", tobog, vis(t, a + 1.0, b, 0.25), 1 - pulse);
  const oOu = vis(t, a + 0.6, b, 0.2);
  if (oOu > 0) s += `<g opacity="${oOu}"><circle cx="540" cy="480" r="46" fill="${TRAIT}" stroke="#fff6e3" stroke-width="5"/><text x="540" y="494" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#fff6e3">OU</text></g>`;
  const oC = vis(t, fin("comment"), b, 0.25);
  if (oC > 0) s += `<g opacity="${oC}" transform="translate(540,715) scale(${0.85 + 0.15 * oC})"><rect x="-370" y="-38" width="740" height="76" rx="38" fill="${TRAIT}" transform="translate(5,7)"/><rect x="-370" y="-38" width="740" height="76" rx="38" fill="#ff3b5c" stroke="${TRAIT}" stroke-width="5"/><text x="0" y="13" text-anchor="middle" font-family="Inter" font-weight="900" font-size="32" fill="#fff">ÉCRIS « PISCINE » OU « JEUX »</text></g>`;
  return s;
}

/* Sous-titres : mot en cours surligné dans une pastille */
const MESURE = document.createElement("canvas").getContext("2d");
function largeur(txt, taille) { MESURE.font = `900 ${taille}px Inter`; return MESURE.measureText(txt).width; }
function sousTitres(t) {
  const c = CHUNKS.find((k) => t >= k.t0 && t < k.t1);
  if (!c || t > FIN_VOIX + 0.3) return "";
  const COUL = { w: "#ffffff", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#5fb0ff" };
  const PASTILLE = { w: "#ffd23f", y: "#ffc93c", r: "#ff5a5f", g: "#4ade80", b: "#5fb0ff" };
  let taille = 72;
  const mots = c.map((w) => w.txt.toUpperCase());
  const ecart = 22;
  let total = mots.reduce((s, m) => s + largeur(m, taille), 0) + ecart * (mots.length - 1);
  if (total > 960) { taille = taille * 960 / total; total = 960; }
  const pop = 0.9 + 0.1 * easeIO(clamp((t - c.t0) / 0.12));
  let cur = -1;
  c.forEach((w, i) => { if (t >= w.t) cur = i; });
  let x = 540 - total / 2, s = `<g transform="translate(540,1395) scale(${pop}) translate(-540,-1395)">`;
  c.forEach((w, i) => {
    const m = mots[i].replace(/&/g, "&amp;"), lw = largeur(mots[i], taille);
    if (i === cur) {
      const k = 1 + 0.08 * (1 - easeIO(clamp((t - w.t) / 0.15)));
      s += `<g transform="translate(${x + lw / 2},1372) scale(${k}) translate(${-(x + lw / 2)},-1372)">
        <rect x="${x - 14}" y="${1395 - taille * 0.86}" width="${lw + 28}" height="${taille * 1.12}" rx="16" fill="${TRAIT}" transform="translate(5,6)"/>
        <rect x="${x - 14}" y="${1395 - taille * 0.86}" width="${lw + 28}" height="${taille * 1.12}" rx="16" fill="${PASTILLE[w.c]}" stroke="${TRAIT}" stroke-width="5"/>
        <text x="${x}" y="1395" font-family="Inter" font-weight="900" font-size="${taille}" fill="${TRAIT}">${m}</text></g>`;
    } else {
      const dit = t >= w.t;
      s += `<text x="${x}" y="1395" font-family="Inter" font-weight="900" font-size="${taille}" fill="${dit ? COUL[w.c] : "#ffffff"}" opacity="${dit ? 1 : 0.5}" stroke="${TRAIT}" stroke-width="12" paint-order="stroke" stroke-linejoin="round">${m}</text>`;
    }
    x += lw + ecart;
  });
  return s + `</g>`;
}

function carteFin(t) {
  const a = DUREE - 2.6, o = clamp((t - a) / 0.35);
  if (o <= 0) return "";
  return `<g opacity="${o}"><rect width="1080" height="1920" fill="#14182a" opacity=".93"/>
    <text x="540" y="560" text-anchor="middle" font-family="Inter" font-weight="900" font-size="40" fill="#4ade80" letter-spacing="6">LES PINS PERDUS</text>
    <text x="540" y="660" text-anchor="middle" font-family="Inter" font-weight="900" font-size="92" fill="#fff6e3">ÉPISODE 2</text>
    <text x="540" y="755" text-anchor="middle" font-family="Inter" font-weight="900" font-size="92" fill="#ffc93c">BIENTÔT</text>
    <g transform="translate(540,1450) scale(2.1) translate(-540,${-SOL})">${personnage(500, 0, t, 1, "joie", "salut")}${chien(600, 0, t, -1)}</g>
    <g transform="translate(540,1620)"><rect x="-340" y="-44" width="680" height="88" rx="44" fill="${TRAIT}" transform="translate(5,7)"/><rect x="-340" y="-44" width="680" height="88" rx="44" fill="#ff3b5c" stroke="#fff6e3" stroke-width="4"/><text x="0" y="14" text-anchor="middle" font-family="Inter" font-weight="900" font-size="36" fill="#fff">+ ABONNE-TOI POUR LA SUITE</text></g></g>`;
}

/* ---------- Rendu d'une image ---------- */
function rendre(t) {
  const cam = camera(t);
  const jour = ease(t, fin("p3"), fin("verif") - fin("p3") + 0.6);
  const neuf = ease(t, fin("calc1", 2.2), 0.7);
  const deblai = ease(t, fin("calc2", 0.4), 2.4);
  const repare = ease(t, fin("calc3", 2.2), 0.7);
  const toi = piste(TOI, t), rog = piste(ROGER, t);
  const tint = 0.3 * (1 - jour);

  let s = ciel(t, jour) + collines(cam, jour);
  s += `<g transform="translate(540,${SOL}) scale(${cam.z}) translate(${-cam.x},${-SOL})">`;
  // monde
  s += `<rect x="-2000" y="${SOL}" width="6400" height="1600" fill="#4a3426"/><rect x="-2000" y="${SOL - 4}" width="6400" height="22" fill="#4f8a3c"/><rect x="-2000" y="${SOL + 18}" width="6400" height="10" fill="#3d2a1f"/>`;
  // tuyau d'eau (après réparation)
  const tuyau = ease(t, fin("calc3", 2.4), 1.2);
  s += `<rect x="1400" y="${SOL + 70}" width="${430 * tuyau}" height="14" rx="7" fill="#4fa3ff" opacity="${tuyau > 0 ? 1 : 0}"/>`;
  s += [470, 1390, 1880, -40, 2400, 2600].map((x, i) => pin(x, 190 + (i % 3) * 40)).join("");
  s += entree(t, neuf) + emplacements(t, deblai) + douches(t, repare) + caravane(t);
  s += `<rect x="-2000" y="0" width="6400" height="${SOL + 1600}" fill="#0b1430" opacity="${tint}" style="mix-blend-mode:multiply"/>`;
  s += lumieres(t, repare) + eauRobinet(t);
  const rVis = clamp((t - fin("roger") - 0.4) / 0.3);
  s += `<g opacity="${rVis}">${chien(rog.x, rog.marche, t, rog.x > toi.x ? -1 : 1)}</g>`;
  ZOOM = cam.z;
  const hu = humeur(t);
  s += personnage(toi.x, toi.marche, t, toi.x < rog.x || hu === "reflechit" ? 1 : -1, hu, geste(t, hu));
  // bulles dans le monde
  s += bulle(rog.x + 20, SOL - 105 - 40 / ZOOM, "ROGER", "#4ade80", "#1d1a2b", vis(t, fin("roger", 1.2), fin("liste"), 0.2));
  s += bulle(rog.x + 20, SOL - 105 - 40 / ZOOM, "WOUF.", "#fff6e3", "#1d1a2b", vis(t, fin("wouf", 1.6), finPhrase("wouf") + 0.3, 0.2));
  s += bulle(toi.x, SOL - 250 - 40 / ZOOM, "C'EST TOI", "#ffc93c", "#1d1a2b", vis(t, 0.5, 3.0, 0.2));
  s += bulle(toi.x, SOL - 250 - 40 / ZOOM, "AÏE…", "#fff6e3", "#1d1a2b", vis(t, fin("presque") - 2.6, fin("presque") - 0.6, 0.2));
  s += bulle(toi.x, SOL - 250 - 40 / ZOOM, "SÉRIEUX ?!", "#fff6e3", "#1d1a2b", vis(t, fin("p1", 1.4), fin("calc1") - 0.1, 0.2));
  s += bulle(toi.x, SOL - 250 - 40 / ZOOM, "ELLE EST CHAUDE !", "#fff6e3", "#1d1a2b", vis(t, fin("ok"), fin("ok", 1.6), 0.2) * (cam.z > 1.5 ? 0.9 : 1));
  s += bulle(rog.x + 20, SOL - 105 - 40 / ZOOM, "WOUF ! ✔", "#4ade80", "#1d1a2b", vis(t, fin("ok", 1.5), fin("bilan"), 0.2));
  s += `</g>`;
  // dégradé sous le sol pour la zone de sous-titres
  s += `<defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d16" stop-opacity="0"/><stop offset=".35" stop-color="#22170f" stop-opacity=".75"/><stop offset="1" stop-color="#120c08"/></linearGradient></defs>
    <rect x="0" y="1150" width="1080" height="770" fill="url(#gs)"/>`;
  s += hud(t) + puce(t);
  s += carteCalcul(t, fin("calc1"), fin("p2", 0.2), [["PORTAIL NEUF", "2 500 €"], ["PANNEAU REPEINT", "1 500 €"]], "4 000 €", 1);
  s += carteCalcul(t, fin("calc2"), fin("p3", 0.2), [["DÉBROUSSAILLEUSE", "300 €"], ["BENNE × 2", "900 €"], ["3 JOURS DE BOULOT", "1 300 €"]], "2 500 €", 2);
  s += carteCalcul(t, fin("calc3"), fin("verif", 0.2), [["PLOMBERIE", "14 000 €"], ["CARRELAGE", "12 000 €"], ["CHAUFFE-EAU", "8 000 €"]], "34 000 €", 3);
  s += liste(t) + choix(t) + sousTitres(t);
  s += `<text x="1040" y="1868" text-anchor="end" font-family="Inter" font-weight="800" font-size="24" fill="#ffffff" opacity=".55" letter-spacing="2">LES PINS PERDUS · ÉP. 1</text>`;
  s += carteFin(t);
  document.getElementById("scene").innerHTML = s;
}

window.DUREE = DUREE;
window.rendre = rendre;
window.MINUTAGE = { SCRIPT, SENT, WORDS: WORDS.map(({ t, d, txt }) => ({ t, d, txt })) };

if (!location.search.includes("rendu")) {
  const debut = performance.now();
  const boucle = () => { rendre(((performance.now() - debut) / 1000) % DUREE); requestAnimationFrame(boucle); };
  requestAnimationFrame(boucle);
} else {
  document.body.classList.add("rendu");
}
</script>
</body>
