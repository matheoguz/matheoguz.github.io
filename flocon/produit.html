<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flocon — Maison de décoration de Noël</title>
<meta name="theme-color" content="#16291f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316291f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23d8c29a'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="top"></div>

<main class="wrap" id="main"></main>

<section class="block" id="relatedWrap" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><div><span class="caps">À associer</span><h2>Dans la même pièce</h2></div></div>
    <div class="grid" id="related"></div>
  </div>
</section>

<div class="sticky-buy" id="stickyBuy"></div>

<div id="foot"></div>

<script src="assets/store.js"></script>
<script>
var id = new URLSearchParams(location.search).get('id');
var p = getProduct(id);
var main = document.getElementById('main');

if (!p) {
  main.innerHTML = '<div class="empty-state" style="padding-top:100px"><p>Cette pièce est introuvable.</p><a class="btn btn-dark" href="index.html#collection">Voir la collection</a></div>';
  document.getElementById('relatedWrap').hidden = true;
} else {
  document.title = p.name + ' — Flocon';
  var specs = Object.keys(p.specs).map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + esc(p.specs[k]) + '</dd>'; }).join('');
  var worth = packWorth(p);
  main.innerHTML =
    '<div class="crumbs"><a href="index.html">Accueil</a> &nbsp;/&nbsp; <a href="index.html#collection">Collection</a> &nbsp;/&nbsp; ' + esc(p.name) + '</div>' +
    '<div class="product">' +
      '<div class="gallery">' +
        '<div class="thumbs">' + p.images.map(function (im, i) {
          return '<button class="' + (i === 0 ? 'on' : '') + '" data-img="' + im + '" aria-label="Photo ' + (i + 1) + '"><img src="' + U(im, 200) + '" alt=""></button>';
        }).join('') + '</div>' +
        '<div class="gallery-main"><img id="mainImg" src="' + U(p.images[0], 1400) + '" alt="' + esc(p.name) + '"></div>' +
        '<p class="photo-note">Photographies d\'ambiance ; la pièce livrée peut présenter de légères différences.</p>' +
      '</div>' +
      '<div class="info">' +
        '<span class="caps">' + esc(p.tag || 'Collection Noël') + '</span>' +
        '<h1>' + esc(p.name) + '</h1>' +
        '<div class="price-lg">' + eur(p.price) + (worth ? '<small>au lieu de ' + eur(worth) + ' séparément</small>' : '') + '</div>' +
        '<p class="lead">' + esc(p.desc) + '</p>' +
        '<ul class="feat">' + p.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' +
        '<div class="buy"><div class="qty"><button id="minus" aria-label="Diminuer la quantité">&minus;</button><span id="q">1</span><button id="plus" aria-label="Augmenter la quantité">+</button></div>' +
        '<button class="btn btn-dark" id="addBtn">Ajouter au panier</button></div>' +
        '<div class="acc">' +
          '<details open><summary>Caractéristiques</summary><div><dl>' + specs + '</dl></div></details>' +
          '<details><summary>Livraison</summary><div><p>Expédition depuis notre entrepôt européen, livraison en ' + CONFIG.deliveryDays + '. Offerte dès ' + CONFIG.freeShippingFrom + ' €, sinon ' + eur(CONFIG.shippingFee) + '.</p><p>Pour Noël, commandez avant le ' + CONFIG.christmasDeadline + '.</p></div></details>' +
          '<details><summary>Retours</summary><div><p>Quatorze jours après réception pour changer d\'avis. <a href="legal.html#retours">Conditions de retour</a></p></div></details>' +
        '</div>' +
      '</div>' +
    '</div>';

  var q = 1, qEl = document.getElementById('q');
  document.getElementById('minus').onclick = function () { q = Math.max(1, q - 1); qEl.textContent = q; };
  document.getElementById('plus').onclick = function () { q = Math.min(20, q + 1); qEl.textContent = q; };
  document.getElementById('addBtn').onclick = function () { addToCart(p.id, q); };
  var mainImg = document.getElementById('mainImg');
  document.querySelectorAll('.thumbs button').forEach(function (b) {
    b.onclick = function () {
      mainImg.style.opacity = 0;
      setTimeout(function () { mainImg.src = U(b.getAttribute('data-img'), 1400); mainImg.style.opacity = 1; }, 180);
      document.querySelectorAll('.thumbs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
  });

  // Barre d'achat fixe sur mobile
  var sticky = document.getElementById('stickyBuy');
  sticky.innerHTML = '<div><div style="font-family:var(--display);font-size:1.1rem;line-height:1.1">' + esc(p.name) + '</div><div style="font-size:.85rem">' + eur(p.price) + '</div></div><button class="btn btn-dark" id="stickyAdd">Ajouter</button>';
  document.getElementById('stickyAdd').onclick = function () { addToCart(p.id, 1); };
  var addBtn = document.getElementById('addBtn');
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { sticky.classList.toggle('show', !en[0].isIntersecting && en[0].boundingClientRect.top < 0); }).observe(addBtn);
  }

  var related = PRODUCTS.filter(function (x) { return x.id !== p.id && !x.pack; }).slice(0, 3);
  document.getElementById('related').innerHTML = related.map(cardHTML).join('');
  bindAddButtons(document.getElementById('related'));
}
</script>
</body>
</html>
