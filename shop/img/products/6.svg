<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="strip6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="ctrl6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <filter id="ledGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sh6">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="#FFF3E0"/>
  <!-- Ground shadow -->
  <ellipse cx="200" cy="340" rx="110" ry="14" fill="rgba(0,0,0,0.06)"/>
  <!-- LED strip coil - back layers -->
  <!-- Coil layer 5 (innermost/back) -->
  <ellipse cx="200" cy="205" rx="40" ry="18" fill="none" stroke="url(#strip6)" stroke-width="12" opacity="0.4"/>
  <!-- Coil layer 4 -->
  <ellipse cx="200" cy="200" rx="58" ry="26" fill="none" stroke="url(#strip6)" stroke-width="12" opacity="0.5"/>
  <!-- Coil layer 3 -->
  <ellipse cx="200" cy="195" rx="76" ry="34" fill="none" stroke="url(#strip6)" stroke-width="13" opacity="0.6"/>
  <!-- Coil layer 2 -->
  <ellipse cx="200" cy="190" rx="94" ry="42" fill="none" stroke="url(#strip6)" stroke-width="13" opacity="0.8"/>
  <!-- Coil layer 1 (outermost/front) -->
  <ellipse cx="200" cy="185" rx="112" ry="50" fill="none" stroke="#F0F0F0" stroke-width="14" filter="url(#sh6)"/>
  <!-- Strip texture - copper dots on strips -->
  <!-- LED dots on outer coil with rainbow glow -->
  <g filter="url(#ledGlow)">
    <!-- Outer ring LEDs -->
    <circle cx="90" cy="192" r="4" fill="#FF1744"/>
    <circle cx="108" cy="176" r="4" fill="#FF6D00"/>
    <circle cx="132" cy="162" r="4" fill="#FFEA00"/>
    <circle cx="160" cy="152" r="4" fill="#76FF03"/>
    <circle cx="190" cy="148" r="4" fill="#00E5FF"/>
    <circle cx="220" cy="150" r="4" fill="#2979FF"/>
    <circle cx="248" cy="158" r="4" fill="#651FFF"/>
    <circle cx="272" cy="170" r="4" fill="#D500F9"/>
    <circle cx="290" cy="184" r="4" fill="#FF1744"/>
    <circle cx="300" cy="198" r="4" fill="#FF6D00"/>
    <!-- Second ring LEDs -->
    <circle cx="108" cy="198" r="3.5" fill="#76FF03"/>
    <circle cx="130" cy="182" r="3.5" fill="#00E5FF"/>
    <circle cx="156" cy="170" r="3.5" fill="#2979FF"/>
    <circle cx="184" cy="164" r="3.5" fill="#D500F9"/>
    <circle cx="216" cy="164" r="3.5" fill="#FF1744"/>
    <circle cx="244" cy="170" r="3.5" fill="#FF6D00"/>
    <circle cx="270" cy="182" r="3.5" fill="#FFEA00"/>
    <circle cx="292" cy="198" r="3.5" fill="#76FF03"/>
    <!-- Third ring LEDs -->
    <circle cx="126" cy="202" r="3" fill="#651FFF"/>
    <circle cx="148" cy="190" r="3" fill="#FF1744"/>
    <circle cx="174" cy="180" r="3" fill="#00E5FF"/>
    <circle cx="200" cy="178" r="3" fill="#FFEA00"/>
    <circle cx="226" cy="180" r="3" fill="#FF6D00"/>
    <circle cx="252" cy="190" r="3" fill="#D500F9"/>
    <circle cx="274" cy="202" r="3" fill="#2979FF"/>
  </g>
  <!-- Glow halos behind LEDs (subtle) -->
  <circle cx="90" cy="192" r="10" fill="#FF1744" opacity="0.1"/>
  <circle cx="160" cy="152" r="10" fill="#76FF03" opacity="0.1"/>
  <circle cx="220" cy="150" r="10" fill="#2979FF" opacity="0.1"/>
  <circle cx="272" cy="170" r="10" fill="#D500F9" opacity="0.1"/>
  <!-- Trailing strip end going to controller -->
  <path d="M305,200 C315,205 320,220 318,240 L310,270" fill="none" stroke="#F0F0F0" stroke-width="10" stroke-linecap="round"/>
  <!-- LED dots on trailing strip -->
  <g filter="url(#ledGlow)">
    <circle cx="314" cy="220" r="3" fill="#FF1744"/>
    <circle cx="316" cy="235" r="3" fill="#76FF03"/>
    <circle cx="314" cy="250" r="3" fill="#2979FF"/>
  </g>
  <!-- Controller box -->
  <rect x="285" y="268" width="55" height="32" rx="5" fill="url(#ctrl6)" filter="url(#sh6)"/>
  <!-- Controller details -->
  <rect x="290" y="273" width="45" height="22" rx="3" fill="#2A2A2A"/>
  <!-- IR receiver -->
  <circle cx="298" cy="280" r="3.5" fill="#1A1A1A" stroke="#444" stroke-width="0.5"/>
  <circle cx="298" cy="280" r="1.5" fill="#880E4F" opacity="0.6"/>
  <!-- Controller buttons -->
  <circle cx="312" cy="280" r="2.5" fill="#4CAF50"/>
  <circle cx="322" cy="280" r="2.5" fill="#F44336"/>
  <!-- Controller label -->
  <text x="312" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#666">RGB</text>
  <!-- DC power wire from controller -->
  <path d="M312,300 L312,320 L300,335" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- DC plug -->
  <circle cx="298" cy="338" r="5" fill="#333"/>
  <circle cx="298" cy="338" r="2" fill="#555"/>
  <!-- Adhesive backing visible on strip edge -->
  <path d="M86,199 L86,205" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Center spool hub -->
  <ellipse cx="200" cy="200" rx="20" ry="10" fill="#E0E0E0"/>
  <ellipse cx="200" cy="198" rx="18" ry="8" fill="#EEEEEE"/>
  <ellipse cx="200" cy="196" rx="8" ry="4" fill="#BDBDBD"/>
</svg>