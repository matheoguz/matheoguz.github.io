<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bottle2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
    </linearGradient>
    <linearGradient id="liquid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="40%" stop-color="#FF6E80"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="base2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <linearGradient id="cap2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.13"/>
    </filter>
    <clipPath id="bottleClip">
      <rect x="140" y="100" width="120" height="220" rx="18"/>
    </clipPath>
  </defs>
  <rect width="400" height="400" rx="20" fill="#E0F7FA"/>
  <!-- Ground shadow -->
  <ellipse cx="200" cy="358" rx="80" ry="12" fill="rgba(0,0,0,0.07)"/>
  <!-- Bottle body - outer shell -->
  <rect x="138" y="98" width="124" height="224" rx="20" fill="#B2EBF2" filter="url(#sh2)"/>
  <!-- Bottle body - transparent look -->
  <rect x="140" y="100" width="120" height="220" rx="18" fill="rgba(224,247,250,0.7)"/>
  <!-- Smoothie liquid fill (bottom 65%) -->
  <rect x="142" y="172" width="116" height="146" rx="16" fill="url(#liquid2)" opacity="0.85"/>
  <!-- Fruit elements inside (clipped to bottle) -->
  <g clip-path="url(#bottleClip)">
    <!-- Strawberry -->
    <g transform="translate(170,200)">
      <path d="M0,-14 C-10,-14 -16,-4 -16,6 C-16,16 -6,22 0,24 C6,22 16,16 16,6 C16,-4 10,-14 0,-14Z" fill="#D32F2F"/>
      <ellipse cx="0" cy="-14" rx="6" ry="4" fill="#4CAF50"/>
      <circle cx="-5" cy="2" r="1.2" fill="#FFCDD2" opacity="0.7"/>
      <circle cx="3" cy="8" r="1.2" fill="#FFCDD2" opacity="0.7"/>
      <circle cx="-3" cy="14" r="1.2" fill="#FFCDD2" opacity="0.7"/>
      <circle cx="6" cy="-2" r="1" fill="#FFCDD2" opacity="0.6"/>
    </g>
    <!-- Banana slices -->
    <ellipse cx="215" cy="230" rx="14" ry="10" fill="#FFF9C4" stroke="#FFD54F" stroke-width="1.5" transform="rotate(-15,215,230)"/>
    <ellipse cx="215" cy="230" rx="5" ry="3" fill="#FFE082" transform="rotate(-15,215,230)"/>
    <ellipse cx="175" cy="260" rx="13" ry="9" fill="#FFF9C4" stroke="#FFD54F" stroke-width="1.5" transform="rotate(10,175,260)"/>
    <ellipse cx="175" cy="260" rx="4.5" ry="2.8" fill="#FFE082" transform="rotate(10,175,260)"/>
    <!-- Blueberries -->
    <circle cx="210" cy="275" r="8" fill="#5C6BC0"/>
    <circle cx="210" cy="275" r="3" fill="#7986CB" opacity="0.5"/>
    <circle cx="190" cy="288" r="7" fill="#5C6BC0"/>
    <circle cx="190" cy="288" r="2.5" fill="#7986CB" opacity="0.5"/>
    <!-- Strawberry slice -->
    <ellipse cx="165" cy="235" rx="11" ry="8" fill="#EF5350" transform="rotate(20,165,235)"/>
    <ellipse cx="165" cy="235" rx="4" ry="2.5" fill="#FFCDD2" opacity="0.5" transform="rotate(20,165,235)"/>
    <!-- Bubbles -->
    <circle cx="170" cy="195" r="4" fill="white" opacity="0.25"/>
    <circle cx="218" cy="210" r="3" fill="white" opacity="0.2"/>
    <circle cx="185" cy="180" r="2.5" fill="white" opacity="0.2"/>
    <circle cx="205" cy="190" r="2" fill="white" opacity="0.15"/>
  </g>
  <!-- Bottle glass shine -->
  <rect x="144" y="105" width="18" height="180" rx="9" fill="white" opacity="0.15"/>
  <!-- Measurement lines on side -->
  <line x1="256" y1="200" x2="262" y2="200" stroke="#90A4AE" stroke-width="1"/>
  <line x1="258" y1="230" x2="262" y2="230" stroke="#90A4AE" stroke-width="1"/>
  <line x1="256" y1="260" x2="262" y2="260" stroke="#90A4AE" stroke-width="1"/>
  <line x1="258" y1="290" x2="262" y2="290" stroke="#90A4AE" stroke-width="1"/>
  <!-- Base motor unit -->
  <rect x="135" y="318" width="130" height="36" rx="8" fill="url(#base2)" filter="url(#sh2)"/>
  <rect x="135" y="318" width="130" height="12" rx="6" fill="#CFD8DC"/>
  <!-- USB-C port on base -->
  <rect x="188" y="346" width="24" height="8" rx="3" fill="#78909C"/>
  <rect x="193" y="349" width="14" height="3" rx="1.5" fill="#546E7A"/>
  <!-- USB label -->
  <text x="200" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#78909C" font-weight="bold">USB-C</text>
  <!-- Power button on base -->
  <circle cx="242" cy="336" r="7" fill="#B0BEC5" stroke="#90A4AE" stroke-width="1"/>
  <path d="M242,331 L242,335" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M238,332 A5,5 0 1,0 246,332" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cap / lid on top -->
  <rect x="155" y="78" width="90" height="24" rx="10" fill="url(#cap2)" filter="url(#sh2)"/>
  <!-- Carry loop -->
  <path d="M185,78 C185,58 215,58 215,78" fill="none" stroke="#BDBDBD" stroke-width="5" stroke-linecap="round"/>
  <path d="M185,78 C185,60 215,60 215,78" fill="none" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
  <!-- Drinking spout -->
  <rect x="192" y="85" width="16" height="8" rx="4" fill="#E0E0E0"/>
  <rect x="195" y="82" width="10" height="6" rx="3" fill="#CFD8DC"/>
</svg>