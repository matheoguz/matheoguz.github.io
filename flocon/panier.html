<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — Flocon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16291f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316291f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23d8c29a'%3EF%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="top"></div>

<main class="wrap">
  <div class="page-head"><span class="caps">Commande</span><h1>Votre panier</h1></div>
  <div id="content"></div>
</main>

<div id="foot"></div>

<script src="assets/store.js"></script>
<script>
var content = document.getElementById('content');

var saved = {};
function saveForm() {
  var f = document.getElementById('form');
  if (!f) return;
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name) saved[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
}
function restoreForm() {
  var f = document.getElementById('form');
  if (!f) return;
  Object.keys(saved).forEach(function (k) { var el = f.elements[k]; if (!el) return; if (el.type === 'checkbox') el.checked = saved[k]; else el.value = saved[k]; });
}
var payReady = !!(CONFIG.paypalMerchantId || CONFIG.contactEmail);

function render() {
  saveForm();
  var cart = readCart();
  if (!cart.length) {
    content.innerHTML = '<div class="empty-state"><p>Votre panier est vide.</p><a class="btn btn-dark" href="index.html#collection">Découvrir la collection</a></div>';
    return;
  }
  var t = cartTotals(cart);
  var remain = CONFIG.freeShippingFrom - t.sub;
  var pct = Math.min(100, Math.round(t.sub / CONFIG.freeShippingFrom * 100));
  content.innerHTML =
    '<div class="checkout">' +
      '<div class="panel"><h2>Articles</h2>' +
        cart.map(lineHTML).join('') +
        '<div class="progress" style="margin-top:22px"><span>' + (remain > 0 ? 'Plus que ' + eur(remain) + ' pour la livraison offerte' : 'Livraison offerte') + '</span><div class="bar"><span style="width:' + pct + '%"></span></div></div>' +
      '</div>' +
      '<div class="aside"><h2 style="font-family:var(--display);font-weight:500;font-size:1.7rem;margin-bottom:18px">Livraison et paiement</h2>' +
        '<form class="form" id="form" novalidate>' +
          '<div class="row"><label>Prénom<input name="first" autocomplete="given-name" required></label><label>Nom<input name="last" autocomplete="family-name" required></label></div>' +
          '<label>Email<input name="email" type="email" autocomplete="email" required></label>' +
          '<label>Téléphone<input name="phone" type="tel" autocomplete="tel" required placeholder="Pour le transporteur"></label>' +
          '<label>Adresse<input name="address" autocomplete="street-address" required></label>' +
          '<div class="row"><label>Code postal<input name="zip" autocomplete="postal-code" inputmode="numeric" required></label><label>Ville<input name="city" autocomplete="address-level2" required></label></div>' +
          '<label>Pays<select name="country">' + CONFIG.countries.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></label>' +
          '<div class="totals"><div><span>Sous-total</span><span>' + eur(t.sub) + '</span></div>' +
            '<div><span>Livraison</span><span>' + (t.ship ? eur(t.ship) : 'Offerte') + '</span></div>' +
            '<div class="grand"><span>Total TTC</span><span>' + eur(t.total) + '</span></div></div>' +
          '<label class="check"><input type="checkbox" name="cgv" required><span>J\'accepte les <a href="legal.html#cgv" target="_blank">conditions de vente</a> et j\'ai pris connaissance de mon <a href="legal.html#retours" target="_blank">droit de rétractation</a>.</span></label>' +
          '<p class="err" id="err" role="alert"></p>' +
          (payReady ? '' : '<p class="notice">Le paiement en ligne ouvre très prochainement. Votre panier reste enregistré sur cet appareil.</p>') +
          '<button class="pay-btn" type="submit" id="payBtn"' + (payReady ? '' : ' disabled') + '>Payer ' + eur(t.total) + ' avec <b>PayPal</b></button>' +
          '<p class="secure">' + ICON.lock + 'Paiement sécurisé · compte PayPal ou carte bancaire</p>' +
        '</form>' +
        '<div id="fallback" hidden></div>' +
      '</div>' +
    '</div>';
  bindLineControls(content, render);
  document.getElementById('form').addEventListener('submit', submit);
  restoreForm();
}

function submit(e) {
  e.preventDefault();
  var f = e.target, err = document.getElementById('err');
  var c = {};
  ['first', 'last', 'email', 'phone', 'address', 'zip', 'city', 'country'].forEach(function (k) { c[k] = f.elements[k].value.trim(); });
  if (!c.first || !c.last || !c.address || !c.zip || !c.city) { err.textContent = 'Merci de compléter votre adresse de livraison.'; return; }
  if (c.phone.replace(/[^0-9]/g, '').length < 9) { err.textContent = 'Merci d\'indiquer un numéro de téléphone valide.'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) { err.textContent = 'Merci de vérifier votre adresse email.'; return; }
  if (!f.elements.cgv.checked) { err.textContent = 'Merci d\'accepter les conditions de vente.'; return; }
  err.textContent = '';

  var cart = readCart(), t = cartTotals(cart), ref = orderRef();
  var b = document.getElementById('payBtn');
  b.disabled = true;
  b.textContent = 'Enregistrement de la commande';
  sendOrder(cart, c, ref).then(function (saved) {
    b.disabled = false;
    b.innerHTML = 'Payer ' + eur(t.total) + ' avec <b>PayPal</b>';
    finish(f, cart, t, c, ref, saved);
  });
}

function finish(f, cart, t, c, ref, saved) {
  var err = document.getElementById('err');
  if (CONFIG.paypalMerchantId) {
    var b = document.getElementById('payBtn');
    b.disabled = true;
    b.textContent = 'Redirection vers PayPal';
    paypalCartForm(cart, t, c, ref).submit();
    return;
  }

  // Mode secours : récapitulatif par email + paiement PayPal.me
  if (!CONFIG.contactEmail) { err.textContent = 'Le paiement en ligne sera disponible très prochainement.'; return; }
  var mail = 'mailto:' + CONFIG.contactEmail + '?subject=' + encodeURIComponent('Commande Flocon ' + ref) + '&body=' + encodeURIComponent(orderSummaryText(cart, t, c, ref));
  var pay = 'https://paypal.me/' + CONFIG.paypalMe + '/' + t.total.toFixed(2) + 'EUR';
  f.hidden = true;
  var fb = document.getElementById('fallback');
  fb.hidden = false;
  fb.innerHTML = saved
    ? '<p style="margin-bottom:18px">Votre commande <strong>' + ref + '</strong> est enregistrée. Il ne reste plus qu\'à la régler :</p>' +
      '<div class="form"><a class="pay-btn" href="' + pay + '" target="_blank" rel="noopener">Payer ' + eur(t.total) + ' avec <b>PayPal</b></a>' +
      '<p class="secure">Indiquez la référence ' + ref + ' dans la note PayPal. Votre commande est expédiée dès réception du paiement.</p></div>'
    : '<p style="margin-bottom:18px">Votre commande <strong>' + ref + '</strong> est prête. Deux étapes pour la finaliser :</p>' +
      '<div class="form"><a class="btn btn-line btn-block" href="' + mail + '">1 &nbsp; Envoyer ma commande</a>' +
      '<a class="pay-btn" href="' + pay + '" target="_blank" rel="noopener">2 &nbsp; Payer ' + eur(t.total) + ' avec <b>PayPal</b></a>' +
      '<p class="secure">Indiquez la référence ' + ref + ' dans la note PayPal.</p></div>';
  fb.querySelector('.pay-btn').addEventListener('click', function () { writeCart([]); });
}

render();
</script>
</body>
</html>
